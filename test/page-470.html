let activeQuestions = [...masterQuestions];
let currentFilteredIdx = 0;
let userAnswers = {};
let wrongTestCount = 1;
let timerSeconds = 1200;
let timerInterval = null;

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      alert("ಸಮಯ ಮುಗಿದಿದೆ!");
      return;
    }
    timerSeconds--;
    let min = Math.floor(timerSeconds / 60);
    let sec = timerSeconds % 60;
    document.getElementById("timer").innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
  }, 1000);
}

function renderQuiz() {
  const q = activeQuestions[currentFilteredIdx];
  document.getElementById("q-text").innerText = q.question;
  
  const optsContainer = document.getElementById("options-container");
  optsContainer.innerHTML = "";
  
  const expBox = document.getElementById("exp-box");
  expBox.style.display = "none";
  expBox.innerHTML = `<strong>ವಿವರಣೆ:</strong> ${q.explanation}`;

  const isAnswered = userAnswers.hasOwnProperty(q.id);

  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = opt;

    if (isAnswered) {
      btn.disabled = true;
      if (idx === q.correct) btn.classList.add("correct");
      if (userAnswers[q.id] === idx && idx !== q.correct) btn.classList.add("wrong");
    } else {
      btn.onclick = () => handleAnswer(q.id, idx);
    }
    optsContainer.appendChild(btn);
  });

  if (isAnswered) expBox.style.display = "block";

  document.getElementById("prev-btn").disabled = currentFilteredIdx === 0;
  document.getElementById("next-btn").disabled = currentFilteredIdx === activeQuestions.length - 1;

  renderPalette();
  updateScore();
}

function handleAnswer(qId, selectedIdx) {
  userAnswers[qId] = selectedIdx;
  renderQuiz();
}

function renderPalette() {
  const pGrid = document.getElementById("palette");
  pGrid.innerHTML = "";

  activeQuestions.forEach((q, idx) => {
    const btn = document.createElement("button");
    btn.className = "palette-btn";
    btn.innerText = q.id;

    if (idx === currentFilteredIdx) btn.classList.add("active");
    if (userAnswers.hasOwnProperty(q.id)) {
      if (userAnswers[q.id] === q.correct) btn.classList.add("correct");
      else btn.classList.add("wrong");
    }

    btn.onclick = () => {
      currentFilteredIdx = idx;
      renderQuiz();
    };
    pGrid.appendChild(btn);
  });
}

function updateScore() {
  let score = 0;
  masterQuestions.forEach(q => {
    if (userAnswers[q.id] === q.correct) score++;
  });
  document.getElementById("score-text").innerText = `ಅಂಕಗಳು: ${score} / ${masterQuestions.length}`;
}

function navigate(dir) {
  currentFilteredIdx += dir;
  renderQuiz();
}

  activeQuestions = [...masterQuestions];
  currentFilteredIdx = 0;
  wrongTestCount = 1;
  document.getElementById("test-title").innerText = "ಸಂವಿಧಾನದ ಭಾಗಗಳು, ಪಟ್ಟಿಗಳು ಮತ್ತು ಇತರೆ ಮಾಹಿತಿ - Page 470";
  timerSeconds = 1200;
  startTimer();
  renderQuiz();
}

function testWrongAnswers() {
  const wrongQs = masterQuestions.filter(q => userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.correct);
  if (wrongQs.length === 0) {
    alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳು ಕಂಡುಬಂದಿಲ್ಲ! (No wrong answers found!)");
    return;
  }
  wrongQs.forEach(q => delete userAnswers[q.id]);
  activeQuestions = wrongQs;
  currentFilteredIdx = 0;
  document.getElementById("test-title").innerText = `Wrong Test-${wrongTestCount++}`;
  renderQuiz();
}

window.onload = () => {
  startTimer();
  renderQuiz();
};
</script>
</body>
</html>
