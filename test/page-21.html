<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Mock Test - Chapter D</title>
    <style>
        :root { --primary-blue: #1a237e; --card-bg: #ffffff; --body-bg: #f4f6f9; --text-color: #333333; --correct-green: #2e7d32; --wrong-red: #c62828; --active-blue: #2196f3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--body-bg); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--primary-blue); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .test-title { font-size: 1.2rem; font-weight: bold; }
        .timer-box { background-color: #ffffff; color: #d32f2f; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 1.1rem; border: 2px solid #d32f2f; }
        .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .quiz-section { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        .quiz-card { background: var(--card-bg); padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background-color: #f8f9fa; border: 2px solid #e0e0e0; padding: 12px 18px; border-radius: 6px; text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background-color: #e8eaf6; border-color: var(--primary-blue); }
        .option-btn:disabled { cursor: not-allowed; }
        .option-btn.correct { background-color: #e8f5e9 !important; border-color: var(--correct-green) !important; color: var(--correct-green) !important; font-weight: bold; box-shadow: 0 0 10px rgba(76, 175, 80, 0.7); }
        .option-btn.wrong { background-color: #ffebee !important; border-color: var(--wrong-red) !important; color: var(--wrong-red) !important; font-weight: bold; box-shadow: 0 0 10px rgba(244, 67, 54, 0.7); }
        .explanation-block { margin-top: 20px; padding: 15px; background-color: #e8eaf6; border-left: 5px solid var(--primary-blue); border-radius: 4px; display: none; }
        .explanation-block.visible { display: block; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 15px; }
        .action-btn { padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-nav { background-color: var(--primary-blue); color: white; }
        .btn-nav:disabled { background-color: #cccccc; cursor: not-allowed; }
        .btn-retest { background-color: #4caf50; color: white; box-shadow: 0 0 10px rgba(76, 175, 80, 0.7); }
        .btn-wrong-test { background-color: #f44336; color: white; box-shadow: 0 0 10px rgba(244, 67, 54, 0.7); }
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .palette-card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .score-display { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center; padding: 10px; background-color: #f0f4f8; border-radius: 5px; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .palette-btn { aspect-ratio: 1; border: 1px solid #ccc; background-color: #ffffff; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .palette-btn.active { border: 3px solid var(--active-blue); transform: scale(1.05); }
        .palette-btn.correct { background-color: #e8f5e9; border-color: var(--correct-green); color: var(--correct-green); box-shadow: 0 0 8px rgba(76, 175, 80, 0.7); }
        .palette-btn.wrong { background-color: #ffebee; border-color: var(--wrong-red); color: var(--wrong-red); box-shadow: 0 0 8px rgba(244, 67, 54, 0.7); }
        .global-controls { display: flex; flex-direction: column; gap: 10px; }
        @media (max-width: 768px) { .main-container { flex-direction: column; } .sidebar { order: -1; } }
    </style>
</head>
<body>
    <header>
        <div class="test-title" id="testHeaderTitle">Chapter D: ಕರ್ನಾಟಕದ ಪ್ರಮುಖ ನದಿ ಯೋಜನೆಗಳು</div>
        <div class="timer-box" id="timer">00:00</div>
    </header>

    <div class="main-container">
        <main class="quiz-section">
            <div class="quiz-card">
                <div class="question-text" id="questionText">Loading...</div>
                <div class="options-container" id="optionsContainer"></div>
                <div class="explanation-block" id="explanationBlock"></div>
            </div>
            <div class="nav-buttons">
                <button class="action-btn btn-nav" id="prevBtn" onclick="navigateQuestion(-1)">Previous</button>
                <button class="action-btn btn-nav" id="nextBtn" onclick="navigateQuestion(1)">Next</button>
            </div>
        </main>
        <aside class="sidebar">
            <div class="palette-card">
                <div class="score-display">Score: <span id="scoreVal">0</span> / <span id="totalVal">0</span></div>
                <div class="palette-grid" id="paletteGrid"></div>
                <div class="global-controls">
                    <button class="action-btn btn-retest" onclick="retestAll()">ಮರುಪರೀಕ್ಷೆ (Retest All)</button>
                    <button class="action-btn btn-wrong-test" onclick="startWrongTest()">Test Wrong Answers</button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const rawQuestions = [
            { id: 1, question: "ಭದ್ರಾ ಯೋಜನೆಯು ಯಾವ ಸ್ಥಳ, ಜಿಲ್ಲೆ ಮತ್ತು ನದಿಗೆ ಸಂಬಂಧಿಸಿದೆ?", options: ["ಸ್ಥಳ: ಲಕ್ಕವಳ್ಳಿ, ಜಿಲ್ಲೆ: ಚಿಕ್ಕಮಗಳೂರು, ನದಿ: ತುಂಗಾ", "ಸ್ಥಳ: ಗಾಜನೂರು, ಜಿಲ್ಲೆ: ಶಿವಮೊಗ್ಗ, ನದಿ: ತುಂಗಾ", "ಸ್ಥಳ: ಬೀಚನಹಳ್ಳಿ, ಜಿಲ್ಲೆ: ಮೈಸೂರು, ನದಿ: ಕಬಿನಿ", "ಸ್ಥಳ: ತರೀಕೆರೆ, ಜಿಲ್ಲೆ: ಚಿಕ್ಕಮಗಳೂರು, ನದಿ: ಭದ್ರಾ"], correct: 0, explanation: "ಭದ್ರಾ ಯೋಜನೆ - ಲಕ್ಕವಳ್ಳಿ, ಚಿಕ್ಕಮಗಳೂರು ಜಿಲ್ಲೆ, ತುಂಗಾ ನದಿ." },
            { id: 2, question: "ತುಂಗಾ ಅಣೆಕಟ್ಟು ಎಲ್ಲಿದೆ?", options: ["ಸ್ಥಳ: ಬಿರುವಾಳು, ಜಿಲ್ಲೆ: ಮೈಸೂರು", "ಸ್ಥಳ: ಗಾಜನೂರು, ಜಿಲ್ಲೆ: ಶಿವಮೊಗ್ಗ", "ಸ್ಥಳ: ಹಿಡಕಲ್, ಜಿಲ್ಲೆ: ಬೆಳಗಾವಿ", "ಸ್ಥಳ: ಹದಗೂರು, ಜಿಲ್ಲೆ: ಕೊಡಗು"], correct: 1, explanation: "ತುಂಗಾ ಅಣೆಕಟ್ಟು - ಗಾಜನೂರು, ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆ, ತುಂಗಾ ನದಿ." },
            { id: 3, question: "ಕಬಿನಿ ಯೋಜನೆಯು ಯಾವ ನದಿಗೆ ಕಟ್ಟಲಾಗಿದೆ?", options: ["ನುಗು", "ಕಬಿನಿ", "ಘಟಪ್ರಭಾ", "ಹಾರಂಗಿ"], correct: 1, explanation: "ಕಬಿನಿ ಯೋಜನೆ - ಬೀಚನಹಳ್ಳಿ, ಮೈಸೂರು ಜಿಲ್ಲೆ, ಕಬಿನಿ ನದಿ." },
            { id: 4, question: "ನುಗು ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಸ್ಥಳ: ಬಿರುವಾಳು, ಜಿಲ್ಲೆ: ಮೈಸೂರು, ನದಿ: ನುಗು", "ಸ್ಥಳ: ಮಾರಿಕಣಿವೆ, ಜಿಲ್ಲೆ: ಚಿತ್ರದುರ್ಗ, ನದಿ: ವೇದಾವತಿ", "ಸ್ಥಳ: ಕನ್ನಂಬಾಡಿ, ಜಿಲ್ಲೆ: ಮಂಡ್ಯ, ನದಿ: ಕಾವೇರಿ", "ಸ್ಥಳ: ಮಲ್ಲಾಪುರ, ಜಿಲ್ಲೆ: ವಿಜಯನಗರ, ನದಿ: ತುಂಗಭದ್ರಾ"], correct: 0, explanation: "ನುಗು ಯೋಜನೆ - ಬಿರುವಾಳು, ಮೈಸೂರು district, ನುಗು ನದಿ." },
            { id: 5, question: "ಘಟಪ್ರಭಾ ಯೋಜನೆ ಯಾವ ಸ್ಥಳ ಮತ್ತು ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಹಿಡಕಲ್, ಬೆಳಗಾವಿ", "ಹದಗೂರು, ಕೊಡಗು", "ಮಾರಿಕಣಿವೆ, ಚಿತ್ರದುರ್ಗ", "ಗೋರೂರು, ಹಾಸನ"], correct: 0, explanation: "ಘಟಪ್ರಭಾ ಯೋಜನೆ - ಹಿಡಕಲ್, ಬೆಳಗಾವಿ ಜಿಲ್ಲೆ, ಘಟಪ್ರಭಾ ನದಿ." },
            { id: 6, question: "ಹಾರಂಗಿ ಯೋಜನೆ ಯಾವ ನದಿಗೆ ಸಂಬಂದಿಸಿದೆ?", options: ["ವೇದಾವತಿ", "ಕಾವೇರಿ", "ಹಾರಂಗಿ ನದಿ", "ಹೇಮಾವತಿ"], correct: 2, explanation: "ಹಾರಂಗಿ ಯೋಜನೆ - ಹದಗೂರು, ಕೊಡಗು ಜಿಲ್ಲೆ, ಹಾರಂಗಿ ನದಿ." },
            { id: 7, question: "ವಾಣಿವಿಲಾಸ ಸಾಗರ ಯೋಜನೆ ಯಾವ ನದಿಯಲ್ಲಿದೆ?", options: ["ವೇದಾವತಿ ನದಿ", "ತುಂಗಭದ್ರಾ", "ಮಾಂಜ್ರಾನದಿ", "ಕೃಷ್ಣಾ"], correct: 0, explanation: "ವಾಣಿವಿಲಾಸ ಸಾಗರ ಯೋಜನೆ - ಮಾರಿಕಣಿವೆ, ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆ, ವೇದಾವತಿ ನದಿ." },
            { id: 8, question: "ಕೃಷ್ಣರಾಜಸಾಗರ (KRS) ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಕನ್ನಂಬಾಡಿ, ಮಂಡ್ಯ (ಕಾವೇರಿ ನದಿ)", "ಮಲ್ಲಾಪುರ, ವಿಜಯನಗರ (ತುಂಗಭದ್ರಾ)", "ಗೋರೂರು, ಹಾಸನ (ಹೇಮಾವತಿ)", "ಬ್ಯಾಲಹಳ್ಳಿ, ಬೀದರ (ಮಾಂಜ್ರಾನದಿ)"], correct: 0, explanation: "ಕೃಷ್ಣರಾಜಸಾಗರ ಯೋಜನೆ - ಕನ್ನಂಬಾಡಿ, ಮಂಡ್ಯ ಜಿಲ್ಲೆ, ಕಾವೇರಿ ನದಿ." },
            { id: 9, question: "ತುಂಗಭದ್ರಾ ಯೋಜನೆ ಸ್ಥಳ ಯಾವುದು?", options: ["ಮಲ್ಲಾಪುರ, ವಿಜಯನಗರ", "ಆಲಮಟ್ಟಿ, ವಿಜಯಪುರ", "ಮುನವಳ್ಳಿ, ಬೆಳಗಾವಿ", "ಅಬ್ಬಗೂಳೂರು, ಚಾಮರಾಜನಗರ"], correct: 0, explanation: "ತುಂಗಭದ್ರಾ ಯೋಜನೆ - ಮಲ್ಲಾಪುರ, ವಿಜಯನಗರ district, ತುಂಗಭದ್ರಾ ನದಿ." },
            { id: 10, question: "ಹೇಮಾವತಿ ಅಣೆಕಟ್ಟು ಇರುವ ಸ್ಥಳ ಮತ್ತು ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಗೋರೂರು, ಹಾಸನ", "ಬ್ಯಾಲಹಳ್ಳಿ, ಬೀದರ", "ಆಲಮಟ್ಟಿ, ವಿಜಯಪುರ", "ಹೇರೂರು, ಕಲಬುರ್ಗಿ"], correct: 0, explanation: "ಹೇಮಾವತಿ ಅಣೆಕಟ್ಟು - ಗೋರೂರು, ಹಾಸನ ಜಿಲ್ಲೆ, ಹೇಮಾವತಿ ನದಿ." },
            { id: 11, question: "ಕಾರಂಜಾ ಯೋಜನೆ ಯಾವ ನದಿಗೆ ಸೇರಿದೆ?", options: ["ಮಾಂಜ್ರಾನದಿ", "ಕೃಷ್ಣಾ", "ಮಲಪ್ರಭಾ", "ಚಿಕ್ಕಹೊಳೆ"], correct: 0, explanation: "ಕಾರಂಜಾ ಯೋಜನೆ - ಬ್ಯಾಲಹಳ್ಳಿ, ಬೀದರ ಜಿಲ್ಲೆ, ಮಾಂಜ್ರಾನದಿ." },
            { id: 12, question: "ಲಾಲ್ ಬಹದ್ದೂರ್ ಶಾಸ್ತ್ರಿ ಅಣೆಕಟ್ಟು (ಆಲಮಟ್ಟಿ) ಯಾವ ನದಿಯಲ್ಲಿದೆ?", options: ["ಕೃಷ್ಣಾ", "ಮಲಪ್ರಭಾ", "ಬೆಣ್ಣೆತೊರೆ", "ಶರಾವತಿ"], correct: 0, explanation: "ಲಾಲ್ ಬಹದ್ದೂರ್ ಶಾಸ್ತ್ರಿ ಅಣೆಕಟ್ಟು - ಆಲಮಟ್ಟಿ, ವಿಜಯಪುರ, ಕೃಷ್ಣಾ ನದಿ." },
            { id: 13, question: "ಮಲಪ್ರಭಾ ಯೋಜನೆ ಎಲ್ಲಿ ನಿರ್ಮಿಸಲಾಗಿದೆ?", options: ["ಮುನವಳ್ಳಿ, ಬೆಳಗಾವಿ", "ಅಬ್ಬಗೂಳೂರು, ಚಾಮರಾಜನಗರ", "ಹೇರೂರು, ಕಲಬುರ್ಗಿ", "ಸವದತ್ತಿ, ಬೆಳಗಾವಿ"], correct: 0, explanation: "ಮಲಪ್ರಭಾ ಯೋಜನೆ - ಮುನವಳ್ಳಿ, ಬೆಳಗಾವಿ ಜಿಲ್ಲೆ, ಮಲಪ್ರಭಾ ನದಿ." },
            { id: 14, question: "ಚಿಕ್ಕಹೊಳೆ ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಅಬ್ಬಗೂಳೂರು, ಚಾಮರಾಜನಗರ", "ನಾರಾಯಣಪುರ, ಯಾದಗಿರಿ", "ಸಾಗರ, ಶಿವಮೊಗ್ಗ", "ಜೋಯ್ಡಾ, ಉತ್ತರಕನ್ನಡ"], correct: 0, explanation: "ಚಿಕ್ಕಹೊಳೆ ಯೋಜನೆ - ಅಬ್ಬಗೂಳೂರು, ಚಾಮರಾಜನಗರ, ಚಿಕ್ಕಹೊಳೆ ನದಿ." },
            { id: 15, question: "ಬೆಣ್ಣೆತೊರೆ ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಹೇರೂರು, ಕಲಬುರ್ಗಿ", "ತರೀಕೆರೆ, ಚಿಕ್ಕಮಗಳೂರು", "ಕುಣಿಗಲ್, ತುಮಕೂರು", "ಯಗಚಿ, ಹಾಸನ"], correct: 0, explanation: "ಬೆಣ್ಣೆತೊರೆ ಯೋಜನೆ - ಹೇರೂರು, ಕಲಬುರ್ಗಿ, ಬೆಣ್ಣೆತೊರೆ ನದಿ." },
            { id: 16, question: "ನಾರಾಯಣಪುರ ಅಣೆಕಟ್ಟು ಯಾವ ನದಿಗೆ ಅಡ್ಡಲಾಗಿ ನಿರ್ಮಿಸಲಾಗಿದೆ?", options: ["ಕೃಷ್ಣಾ", "ಮಲಪ್ರಭಾ", "ಭದ್ರಾ", "ಕಾಳಿ ನದಿ"], correct: 0, explanation: "ನಾರಾಯಣಪುರ ಅಣೆಕಟ್ಟು - ನಾರಾಯಣಪುರ, ಯಾದಗಿರಿ, ಕೃಷ್ಣಾ ನದಿ." },
            { id: 17, question: "ನವಿಲುತೀರ್ಥ ಯೋಜನೆ ಎಲ್ಲಿ ಮತ್ತು ಯಾವ ನದಿಯಲ್ಲಿದೆ?", options: ["ಸವದತ್ತಿ, ಬೆಳಗಾವಿ (ಮಲಪ್ರಭಾ)", "ತರೀಕೆರೆ, ಚಿಕ್ಕಮಗಳೂರು (ಭದ್ರಾ)", "ಸಾಗರ, ಶಿವಮೊಗ್ಗ (ಶರಾವತಿ)", "ಜೋಯ್ಡಾ, ಉತ್ತರಕನ್ನಡ (ಕಾಳಿ)"], correct: 0, explanation: "ನವಿಲುತೀರ್ಥ - ಸವದತ್ತಿ, ಬೆಳಗಾವಿ, ಮಲಪ್ರಭಾ ನದಿ." },
            { id: 18, question: "ಲಕ್ಷ್ಮವಳ್ಳಿ ಸ್ಥಳವು ಯಾವ ಯೋಜನೆಗೆ ಸೇರಿದೆ?", options: ["ಭದ್ರಾ (ತರೀಕೆರೆ, ಚಿಕ್ಕಮಗಳೂರು)", "ಲಿಂಗನಮಕ್ಕಿ", "ಸುಪಾ", "ಮಾರಕನಹಳ್ಳಿ"], correct: 0, explanation: "ಲಕ್ಷ್ಮವಳ್ಳಿ - ತರೀಕೆರೆ, ಚಿಕ್ಕಮಗಳೂರು, ಭದ್ರಾ ನದಿ." },
            { id: 19, question: "ಲಿಂಗನಮಕ್ಕಿ ಅಣೆಕಟ್ಟು ಯಾವ ನದಿಗೆ ಕಟ್ಟಲಾಗಿದೆ?", options: ["ಶರಾವತಿ", "ಕಾಳಿ", "ಶಿಂಷಾ", "ವಾರಾಹಿ"], correct: 0, explanation: "ಲಿಂಗನಮಕ್ಕಿ - ಸಾಗರ, ಶಿವಮೊಗ್ಗ, ಶರಾವತಿ ನದಿ." },
            { id: 20, question: "ಸುಪಾ ಅಣೆಕಟ್ಟು ಎಲ್ಲಿ ನೆಲೆಗೊಂಡಿದೆ?", options: ["ಜೋಯ್ಡಾ, ಉತ್ತರಕನ್ನಡ (ಕಾಳಿ ನದಿ)", "ಕುಣಿಗಲ್, ತುಮಕೂರು (ಶಿಂಷಾ)", "ಕಲಬುರ್ಗಿ (ಗಂಡೋರಿನಾಲ)", "ಉಡುಪಿ (ವಾರಾಹಿ)"], correct: 0, explanation: "ಸುಪಾ ಅಣೆಕಟ್ಟು - ಜೋಯ್ಡಾ, ಉತ್ತರಕನ್ನಡ, ಕಾಳಿ ನದಿ." },
            { id: 21, question: "ಮಾರಕನಹಳ್ಳಿ ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಕುಣಿಗಲ್, ತುಮಕೂರು (ಶಿಂಷಾ ನದಿ)", "ಕಲಬುರ್ಗಿ (ಗಂಡೋರಿನಾಲ)", "ಪಶ್ಚಿಮಘಟ್ಟ, ಉಡುಪಿ (ವಾರಾಹಿ)", "ಯಗಚಿ, ಹಾಸನ (ಯಗಚಿ)"], correct: 0, explanation: "ಮಾರಕನಹಳ್ಳಿ - ಕುಣಿಗಲ್, ತುಮಕೂರು, ಶಿಂಷಾ ನದಿ." },
            { id: 22, question: "ಗಂಡೋರಿನಾಲಾ ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಕಲಬುರ್ಗಿ, ಕಲಬುರ್ಗಿ", "ಪಶ್ಚಿಮಘಟ್ಟ, ಉಡುಪಿ", "ಯಗಚಿ, ಹಾಸನ", "ಸಾಗರ, ಶಿವಮೊಗ್ಗ"], correct: 0, explanation: "ಗಂಡೋರಿನಾಲಾ - ಕಲಬುರ್ಗಿ, ಕಲಬುರ್ಗಿ district, ಗಂಡೋರಿನಾಲ." },
            { id: 23, question: "ವಾರಾಹಿ ಯೋಜನೆ ಎಲ್ಲಿದೆ?", options: ["ಪಶ್ಚಿಮಘಟ್ಟ, ಉಡುಪಿ, ವಾರಾಹಿ ನದಿ", "ಯಗಚಿ, ಹಾಸನ, ಯಗಚಿ ನದಿ", "ಕುಣಿಗಲ್, ತುಮಕೂರು, ಶಿಂಷಾ", "ಸವದತ್ತಿ, ಬೆಳಗಾವಿ, ಮಲಪ್ರಭಾ"], correct: 0, explanation: "ವಾರಾಹಿ ಯೋಜನೆ - ಪಶ್ಚಿಮಘಟ್ಟ, ಉಡುಪಿ, ವಾರಾಹಿ ನದಿ." },
            { id: 24, question: "ಯಗಚಿ ಅಣೆಕಟ್ಟು ಎಲ್ಲಿ ಮತ್ತು ಯಾವ ನದಿಯಲ್ಲಿದೆ?", options: ["ಯಗಚಿ, ಹಾಸನ (ಯಗಚಿ ನದಿ)", "ಜೋಯ್ಡಾ, ಉತ್ತರಕನ್ನಡ (ಕಾಳಿ)", "ಗೋರೂರು, ಹಾಸನ (ಹೇಮಾವತಿ)", "ಮಾರಿಕಣಿವೆ, ಚಿತ್ರದುರ್ಗ (ವೇದಾವತಿ)"], correct: 0, explanation: "ಯಗಚಿ ಅಣೆಕಟ್ಟು - ಯಗಚಿ, ಹಾಸನ, ಯಗಚಿ ನದಿ." }
        ];

        let activeQuestions = [...rawQuestions], userAnswers = {}, currentIndex = 0, wrongTestCounter = 1, timerSeconds = 0, timerInterval = null;

        function startTimer() {
            clearInterval(timerInterval); timerSeconds = 0;
            timerInterval = setInterval(() => {
                timerSeconds++;
                document.getElementById('timer').textContent = `${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;
            }, 1000);
        }

        function initQuiz() { currentIndex = 0; renderPalette(); renderQuestion(); updateScore(); startTimer(); }

        function renderPalette() {
            const grid = document.getElementById('paletteGrid'); grid.innerHTML = '';
            activeQuestions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn' + (index === currentIndex ? ' active' : '');
                btn.textContent = q.id;
                if (userAnswers.hasOwnProperty(q.id)) btn.classList.add(userAnswers[q.id] === q.correct ? 'correct' : 'wrong');
                btn.onclick = () => { currentIndex = index; renderQuestion(); renderPalette(); };
                grid.appendChild(btn);
            });
        }

        function renderQuestion() {
            const currentQ = activeQuestions[currentIndex];
            document.getElementById('questionText').textContent = `${currentQ.id}. ${currentQ.question}`;
            const optionsContainer = document.getElementById('optionsContainer'); optionsContainer.innerHTML = '';
            const isAnswered = userAnswers.hasOwnProperty(currentQ.id), selectedOpt = userAnswers[currentQ.id];

            currentQ.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.textContent = optText;
                if (isAnswered) {
                    btn.disabled = true;
                    if (optIdx === currentQ.correct) btn.classList.add('correct');
                    if (optIdx === selectedOpt && selectedOpt !== currentQ.correct) btn.classList.add('wrong');
                } else { btn.onclick = () => selectOption(optIdx); }
                optionsContainer.appendChild(btn);
            });

            const expBlock = document.getElementById('explanationBlock');
            if (isAnswered) { expBlock.textContent = `ವಿವರಣೆ: ${currentQ.explanation}`; expBlock.classList.add('visible'); }
            else { expBlock.classList.remove('visible'); expBlock.textContent = ''; }

            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === activeQuestions.length - 1);
        }

        function selectOption(optIndex) { userAnswers[activeQuestions[currentIndex].id] = optIndex; renderQuestion(); renderPalette(); updateScore(); }
        function navigateQuestion(direction) { if (currentIndex + direction >= 0 && currentIndex + direction < activeQuestions.length) { currentIndex += direction; renderQuestion(); renderPalette(); } }
        function updateScore() {
            let score = rawQuestions.reduce((acc, q) => userAnswers[q.id] === q.correct ? acc + 1 : acc, 0);
            document.getElementById('scoreVal').textContent = score; document.getElementById('totalVal').textContent = rawQuestions.length;
        }
        function retestAll() { userAnswers = {}; activeQuestions = [...rawQuestions]; wrongTestCounter = 1; document.getElementById('testHeaderTitle').textContent = "Chapter D: ಕರ್ನಾಟಕದ ಪ್ರಮುಖ ನದಿ ಯೋಜನೆಗಳು"; initQuiz(); }
        function startWrongTest() {
            const wrongQs = rawQuestions.filter(q => userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.correct);
            if (wrongQs.length === 0) return alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳಿಲ್ಲ! (No wrong answers found!)");
            wrongQs.forEach(q => delete userAnswers[q.id]); activeQuestions = wrongQs;
            document.getElementById('testHeaderTitle').textContent = `Chapter D: Wrong Test-${wrongTestCounter++}`;
            currentIndex = 0; renderPalette(); renderQuestion(); updateScore();
        }
        window.onload = initQuiz;
    </script>
</body>
