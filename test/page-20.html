        body {

            flex-direction: column;
            min-height: 100vh;

            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);

        .test-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .timer-box {
            background-color: #ffffff;
            color: #d32f2f;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #d32f2f;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-section {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quiz-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            padding: 12px 18px;
            border-radius: 6px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e8eaf6;
            border-color: var(--primary-blue);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--correct-green) !important;
            color: var(--correct-green) !important;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
        }

        .option-btn.wrong {
            background-color: #ffebee !important;
            border-color: var(--wrong-red) !important;
            color: var(--wrong-red) !important;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.7);
        }

        .explanation-block {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8eaf6;
            border-left: 5px solid var(--primary-blue);
            border-radius: 4px;
            display: none;
        }

        .explanation-block.visible {
            display: block;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-nav {
            background-color: var(--primary-blue);
            color: white;
        }

        .btn-nav:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn-retest {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
        }

        .btn-retest:hover {
            background-color: #43a047;
        }

        .btn-wrong-test {
            background-color: #f44336;
            color: white;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.7);
        }

        .btn-wrong-test:hover {
            background-color: #e53935;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .palette-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background-color: #f0f4f8;
            border-radius: 5px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .palette-btn {
            aspect-ratio: 1;
            border: 1px solid #ccc;
            background-color: #ffffff;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .palette-btn.active {
            border: 3px solid var(--active-blue);
            transform: scale(1.05);

        .palette-btn.correct {
            background-color: #e8f5e9;
            border-color: var(--correct-green);
            color: var(--correct-green);
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.7);

            background-color: #ffebee;
            border-color: var(--wrong-red);
            color: var(--wrong-red);
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.7);
        }

        .global-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                order: -1;
            }
        }
    </style>

                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function initQuiz() {
            currentIndex = 0;
            renderPalette();
            renderQuestion();
            updateScore();
            startTimer();
        }

        function renderPalette() {
            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            
            activeQuestions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = q.id; 
                
                if (index === currentIndex) {
                    btn.classList.add('active');
                }

                if (userAnswers.hasOwnProperty(q.id)) {
                    if (userAnswers[q.id] === q.correct) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('wrong');
                    }
                }

                btn.onclick = () => {
                    currentIndex = index;
                    renderQuestion();
                    renderPalette();
                };

                grid.appendChild(btn);
            });
        }

        function renderQuestion() {
            const currentQ = activeQuestions[currentIndex];
            document.getElementById('questionText').textContent = `${currentQ.id}. ${currentQ.question}`;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const isAnswered = userAnswers.hasOwnProperty(currentQ.id);
            const selectedOpt = userAnswers[currentQ.id];

            currentQ.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = optText;

                if (isAnswered) {
                    btn.disabled = true;
                    if (optIdx === currentQ.correct) {
                        btn.classList.add('correct');
                    }
                    if (optIdx === selectedOpt && selectedOpt !== currentQ.correct) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectOption(optIdx);
                }

                optionsContainer.appendChild(btn);
            });

            const expBlock = document.getElementById('explanationBlock');
            if (isAnswered) {
                expBlock.textContent = `ವಿವರಣೆ: ${currentQ.explanation}`;
                expBlock.classList.add('visible');
            } else {
                expBlock.classList.remove('visible');
                expBlock.textContent = '';
            }

            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === activeQuestions.length - 1);
        }

        function selectOption(optIndex) {
            const currentQ = activeQuestions[currentIndex];
            userAnswers[currentQ.id] = optIndex;
            
            renderQuestion();
            renderPalette();
            updateScore();
        }

        function navigateQuestion(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < activeQuestions.length) {
                currentIndex = newIndex;
                renderQuestion();
                renderPalette();
            }
        }

        function updateScore() {
            let score = 0;
            rawQuestions.forEach(q => {
                if (userAnswers[q.id] === q.correct) {
                    score++;
                }
            });
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('totalVal').textContent = rawQuestions.length;
        }

        function retestAll() {
            userAnswers = {};
            activeQuestions = [...rawQuestions];
            wrongTestCounter = 1;
            document.getElementById('testHeaderTitle').textContent = "Chapter A: ಕರ್ನಾಟಕದ ರಾಜಮನೆತನಗಳ ವಿಶೇಷತೆ";
            initQuiz();
        }

        function startWrongTest() {
            const wrongQs = rawQuestions.filter(q => userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.correct);
            
            if (wrongQs.length === 0) {
                alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳಿಲ್ಲ! (No wrong answers found!)");
                return;
            }

            wrongQs.forEach(q => {
                delete userAnswers[q.id];
            });

            activeQuestions = wrongQs;
            document.getElementById('testHeaderTitle').textContent = `Chapter A: Wrong Test-${wrongTestCounter}`;
            wrongTestCounter++;
            
            currentIndex = 0;
            renderPalette();
            renderQuestion();
            updateScore();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
