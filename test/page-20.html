  <script>

      { id: 1, q: "ಮೌರ್ಯರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಪಾಟಲೀಪುತ್ರ, ಸ್ಥಾಪಕ: ಚಂದ್ರಗುಪ್ತ", "ರಾಜಧಾನಿ: ಪೈಠಾಣ, ಸ್ಥಾಪಕ: ಸಿಮುಖ", "ರಾಜಧಾನಿ: ಬನವಾಸಿ, ಸ್ಥಾಪಕ: ಮಯೂರ ವರ್ಮ", "ರಾಜಧಾನಿ: ತಲಕಾಡು, ಸ್ಥಾಪಕ: ದಡಿಗ & ಮಾಧವ"], ans: 0, exp: "ಮೌರ್ಯರ ರಾಜಧಾನಿ ಪಾಟಲೀಪುತ್ರ ಹಾಗೂ ಸ್ಥಾಪಕ ಚಂದ್ರಗುಪ್ತ." },
      { id: 2, q: "ಶತಾವಹನರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಪೈಠಾಣ, ಸ್ಥಾಪಕ: ಸಿಮುಖ", "ರಾಜಧಾನಿ: ಬಾದಾಮಿ, ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ", "ರಾಜಧಾನಿ: ಮಾನ್ಯಖೇಟ, ಸ್ಥಾಪಕ: ದಂತಿ ದುರ್ಗ", "ರಾಜಧಾನಿ: ದ್ವಾರಸಮುದ್ರ, ಸ್ಥಾಪಕ: ಸಳ"], ans: 0, exp: "ಶತಾವಹನರ ರಾಜಧಾನಿ ಪೈಠಾಣ ಹಾಗೂ ಸ್ಥಾಪಕ ಸಿಮುಖ." },
      { id: 3, q: "ಕದಂಬರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಬನವಾಸಿ, ಸ್ಥಾಪಕ: ಮಯೂರ ವರ್ಮ", "ರಾಜಧಾನಿ: ತಲಕಾಡು, ಸ್ಥಾಪಕ: ದಡಿಗ & ಮಾಧವ", "ರಾಜಧಾನಿ: ಕಲ್ಯಾಣ, ಸ್ಥಾಪಕ: 2ನೇ ತೈಲಪ", "ರಾಜಧಾನಿ: ಹಂಪಿ, ಸ್ಥಾಪಕ: ಹಕ್ಕಬುಕ್ಕರು"], ans: 0, exp: "ಕದಂಬರ ರಾಜಧಾನಿ ಬನವಾಸಿ ಹಾಗೂ ಸ್ಥಾಪಕ ಮಯೂರ ವರ್ಮ." },
      { id: 4, q: "ಗಂಗರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕರು ಯಾರು?", options: ["ರಾಜಧಾನಿ: ತಲಕಾಡು, ಸ್ಥಾಪಕರು: ದಡಿಗ & ಮಾಧವ", "ರಾಜಧಾನಿ: ಪೈಠಾಣ, ಸ್ಥಾಪಕ: ಸಿಮುಖ", "ರಾಜಧಾನಿ: ಬಾದಾಮಿ, ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ", "ರಾಜಧಾನಿ: ಗುಲ್ಬರ್ಗ, ಸ್ಥಾಪಕ: ಹಸನ್ ಗಂಗೂ"], ans: 0, exp: "ಗಂಗರ ರಾಜಧಾನಿ ತಲಕಾಡು ಹಾಗೂ ಸ್ಥಾಪಕರು ದಡಿಗ & ಮಾಧವ." },
      { id: 5, q: "ಬಾದಾಮಿ ಚಾಲುಕ್ಯರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಬಾದಾಮಿ, ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ", "ರಾಜಧಾನಿ: ಮಾನ್ಯಖೇಟ, ಸ್ಥಾಪಕ: ದಂತಿ ದುರ್ಗ", "ರಾಜಧಾನಿ: ಕಲ್ಯಾಣ, ಸ್ಥಾಪಕ: 2ನೇ ತೈಲಪ", "ರಾಜಧಾನಿ: ಮೈಸೂರು, ಸ್ಥಾಪಕ: ಯದುರಾಯ"], ans: 0, exp: "ಬಾದಾಮಿ ಚಾಲುಕ್ಯರ ರಾಜಧಾನಿ ಬಾದಾಮಿ ಹಾಗೂ ಸ್ಥಾಪಕ ಜಯಸಿಂಹ." },
      { id: 6, q: "ಕಲ್ಯಾಣ ಚಾಲುಕ್ಯರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಕಲ್ಯಾಣ, ಸ್ಥಾಪಕ: 2ನೇ ತೈಲಪ", "ರಾಜಧಾನಿ: ಬಾದಾಮಿ, ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ", "ರಾಜಧಾನಿ: ದ್ವಾರಸಮುದ್ರ, ಸ್ಥಾಪಕ: ಸಳ", "ರಾಜಧಾನಿ: ಪೈಠಾಣ, ಸ್ಥಾಪಕ: ಸಿಮುಖ"], ans: 0, exp: "ಕಲ್ಯಾಣ ಚಾಲುಕ್ಯರ ರಾಜಧಾನಿ ಕಲ್ಯಾಣ ಹಾಗೂ ಸ್ಥಾಪಕ 2ನೇ ತೈಲಪ." },
      { id: 7, q: "ರಾಷ್ಟ್ರಕೂಟರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಮಾನ್ಯಖೇಟ, ಸ್ಥಾಪಕ: ದಂತಿ ದುರ್ಗ", "ರಾಜಧಾನಿ: ಬನವಾಸಿ, ಸ್ಥಾಪಕ: ಮಯೂರ ವರ್ಮ", "ರಾಜಧಾನಿ: ತಲಕಾಡು, ಸ್ಥಾಪಕ: ದಡಿಗ", "ರಾಜಧಾನಿ: ಪಾಟಲೀಪುತ್ರ, ಸ್ಥಾಪಕ: ಚಂದ್ರಗುಪ್ತ"], ans: 0, exp: "ರಾಷ್ಟ್ರಕೂಟರ ರಾಜಧಾನಿ ಮಾನ್ಯಖೇಟ ಹಾಗೂ ಸ್ಥಾಪಕ ದಂತಿ ದುರ್ಗ." },
      { id: 8, q: "ಹೊಯ್ಸಳರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ದ್ವಾರಸಮುದ್ರ, ಸ್ಥಾಪಕ: ಸಳ", "ರಾಜಧಾನಿ: ಹಂಪಿ, ಸ್ಥಾಪಕ: ಹಕ್ಕಬುಕ್ಕರು", "ರಾಜಧಾನಿ: ಮೈಸೂರು, ಸ್ಥಾಪಕ: ಯದುರಾಯ", "ರಾಜಧಾನಿ: ಕಲ್ಯಾಣ, ಸ್ಥಾಪಕ: 2ನೇ ತೈಲಪ"], ans: 0, exp: "ಹೊಯ್ಸಳರ ರಾಜಧಾನಿ ದ್ವಾರಸಮುದ್ರ ಹಾಗೂ ಸ್ಥಾಪಕ ಸಳ." },
      { id: 9, q: "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕರು ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಹಂಪಿ, ಸ್ಥಾಪಕರು: ಹಕ್ಕಬುಕ್ಕರು", "ರಾಜಧಾನಿ: ಗುಲ್ಬರ್ಗ/ಬೀದರ್, ಸ್ಥಾಪಕ: ಹಸನ್ ಗಂಗೂ", "ರಾಜಧಾನಿ: ಮೈಸೂರು, ಸ್ಥಾಪಕ: ಯದುರಾಯ & ಕೃಷ್ಣರಾಯ", "ರಾಜಧಾನಿ: ಬಾದಾಮಿ, ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ"], ans: 0, exp: "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ರಾಜಧಾನಿ ಹಂಪಿ ಹಾಗೂ ಸ್ಥಾಪಕರು ಹಕ್ಕಬುಕ್ಕರು." },
      { id: 10, q: "ಬಹಮನಿ ಸುಲ್ತಾನರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕ ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಗುಲ್ಬರ್ಗ/ಬೀದರ್, ಸ್ಥಾಪಕ: ಹಸನ್ ಗಂಗೂ ಬಹಮನ್ ಶಾ", "ರಾಜಧಾನಿ: ಮಾನ್ಯಖೇಟ, ಸ್ಥಾಪಕ: ದಂತಿ ದುರ್ಗ", "ರಾಜಧಾನಿ: ದ್ವಾರಸಮುದ್ರ, ಸ್ಥಾಪಕ: ಸಳ", "ರಾಜಧಾನಿ: ಪಾಟಲೀಪುತ್ರ, ಸ್ಥಾಪಕ: ಚಂದ್ರಗುಪ್ತ"], ans: 0, exp: "ಬಹಮನಿ ಸುಲ್ತಾನರ ರಾಜಧಾನಿ ಗುಲ್ಬರ್ಗ/ಬೀದರ್ ಹಾಗೂ ಸ್ಥಾಪಕ ಹಸನ್ ಗಂಗೂ ಬಹಮನ್ ಶಾ." },
      { id: 11, q: "ಮೈಸೂರಿನ ಒಡೆಯರ ರಾಜಧಾನಿ ಮತ್ತು ಸ್ಥಾಪಕರು ಯಾರು?", options: ["ರಾಜಧಾನಿ: ಮೈಸೂರು, ಸ್ಥಾಪಕರು: ಯದುರಾಯ ಮತ್ತು ಕೃಷ್ಣರಾಯ", "ರಾಜಧಾನಿ: ಹಂಪಿ, ಸ್ಥಾಪಕರು: ಹಕ್ಕಬುಕ್ಕರು", "ರಾಜಧಾನಿ: ಬನವಾಸಿ, ಸ್ಥಾಪಕ: ಮಯೂರ ವರ್ಮ", "ರಾಜಧಾನಿ: ತಲಕಾಡು, ಸ್ಥಾಪಕರು: ದಡಿಗ & ಮಾಧವ"], ans: 0, exp: "ಮೈಸೂರಿನ ಒಡೆಯರ ರಾಜಧಾನಿ ಮೈಸೂರು ಹಾಗೂ ಸ್ಥಾಪಕರು ಯದುರಾಯ ಮತ್ತು ಕೃಷ್ಣರಾಯ." }
    ];
    let currentQuestionsList = [...rawQuestions], userAnswers = {}, currentActiveIndex = 0, wrongTestCounter = 1, timerInterval = null, totalSeconds = 0;
    const qText = document.getElementById('question-text'), optionsContainer = document.getElementById('options-container'), expBlock = document.getElementById('explanation-block'), prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn'), paletteGrid = document.getElementById('palette-grid'), scoreBox = document.getElementById('score-box'), testTitle = document.getElementById('test-title'), timerElem = document.getElementById('timer');
    function startTimer() { if (timerInterval) clearInterval(timerInterval); totalSeconds = 0; timerInterval = setInterval(() => { totalSeconds++; timerElem.innerText = `${String(Math.floor(totalSeconds / 60)).padStart(2, '0')}:${String(totalSeconds % 60).padStart(2, '0')}`; }, 1000); }
    function initTest() { userAnswers = {}; currentActiveIndex = 0; startTimer(); renderPalette(); loadQuestion(currentActiveIndex); updateScore(); }
    function loadQuestion(index) { currentActiveIndex = index; const qData = currentQuestionsList[index]; qText.innerText = `Q${qData.id}. ${qData.q}`; optionsContainer.innerHTML = ''; expBlock.style.display = 'none'; expBlock.innerText = `ವಿವರಣೆ: ${qData.exp}`; const answered = userAnswers.hasOwnProperty(qData.id), selectedOption = userAnswers[qData.id]; qData.options.forEach((optText, optIdx) => { const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = optText; if (answered) { btn.disabled = true; if (optIdx === qData.ans) btn.classList.add('correct'); if (selectedOption === optIdx && selectedOption !== qData.ans) btn.classList.add('wrong'); } else { btn.onclick = () => selectAnswer(qData.id, optIdx); } optionsContainer.appendChild(btn); }); if (answered) expBlock.style.display = 'block'; prevBtn.disabled = index === 0; nextBtn.disabled = index === currentQuestionsList.length - 1; updatePaletteHighlight(); }
    function selectAnswer(qId, selectedIdx) { userAnswers[qId] = selectedIdx; updateScore(); renderPalette(); loadQuestion(currentActiveIndex); }
    function renderPalette() { paletteGrid.innerHTML = ''; currentQuestionsList.forEach((qData, idx) => { const pBtn = document.createElement('button'); pBtn.className = 'palette-btn'; pBtn.innerText = qData.id; if (userAnswers.hasOwnProperty(qData.id)) { pBtn.classList.add(userAnswers[qData.id] === qData.ans ? 'correct' : 'wrong'); } if (idx === currentActiveIndex) pBtn.classList.add('active'); pBtn.onclick = () => loadQuestion(idx); paletteGrid.appendChild(pBtn); }); }
    function updatePaletteHighlight() { paletteGrid.querySelectorAll('.palette-btn').forEach((btn, idx) => { btn.classList.toggle('active', idx === currentActiveIndex); }); }
    function prevQuestion() { if (currentActiveIndex > 0) loadQuestion(currentActiveIndex - 1); }
    function nextQuestion() { if (currentActiveIndex < currentQuestionsList.length - 1) loadQuestion(currentActiveIndex + 1); }
    function updateScore() { let score = 0; rawQuestions.forEach(q => { if (userAnswers[q.id] === q.ans) score++; }); scoreBox.innerText = `ಅಂಕಗಳು: ${score} / ${rawQuestions.length}`; }
    function retestAll() { currentQuestionsList = [...rawQuestions]; userAnswers = {}; wrongTestCounter = 1; testTitle.innerText = "ಕರ್ನಾಟಕದ ರಾಜಮನೆತನಗಳ ವಿಶೇಷತೆ"; initTest(); }
    function testWrongAnswers() { const wrongQuestions = rawQuestions.filter(q => userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.ans); if (wrongQuestions.length === 0) { alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳು ಕಂಡುಬಂದಿಲ್ಲ! (No wrong answers found!)"); return; } wrongQuestions.forEach(q => delete userAnswers[q.id]); currentQuestionsList = wrongQuestions; testTitle.innerText = `Wrong Test-${wrongTestCounter++}`; currentActiveIndex = 0; renderPalette(); loadQuestion(currentActiveIndex); updateScore(); }
    window.onload = initTest;
  </script>
</body>
