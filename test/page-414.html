            { q: "ಸ್ಟ್ಯಾಫೋರ್ಡ್ ಕ್ರಿಪ್ಸ್‌ ನೇತೃತ್ವದ ಕ್ರಿಪ್ಸ್ ಆಯೋಗ ಭಾರತಕ್ಕೆ ಬಂದ ದಿನಾಂಕ ಯಾವುದು?", options: ["1942 ಮಾರ್ಚ್ 22", "1946 ಮಾರ್ಚ್ 24", "1947 ಆಗಸ್ಟ್ 15", "1950 ಜನವರಿ 26"], ans: 0, exp: "1942 ಮಾರ್ಚ್ 22 ರಂದು ಕ್ರಿಪ್ಸ್ ಆಯೋಗ ಭಾರತಕ್ಕೆ ಬಂದಿತು." },
            { q: "ಕ್ಲೈಮೆಂಟ್ ಅಟ್ಲಿ ಅವರ ನೇತೃತ್ವದಲ್ಲಿ ಕ್ಯಾಬಿನೆಟ್ ಆಯೋಗ ಭಾರತಕ್ಕೆ ಬಂದದ್ದು ಯಾವಾಗ?", options: ["1942 ಮಾರ್ಚ್ 22", "1946 ಮಾರ್ಚ್ 24", "1946 ಡಿಸೆಂಬರ್ 9", "1947 ಆಗಸ್ಟ್ 29"], ans: 1, exp: "1946 ಮಾರ್ಚ್ 24 ರಂದು ಕ್ಯಾಬಿನೆಟ್ ಆಯೋಗ ಭಾರತಕ್ಕೆ ಬಂದಿತು." },

            { q: "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯಲ್ಲಿ ಭಾಗವಹಿಸದ ಪ್ರಮುಖ ನಾಯಕರು ಯಾರು?", options: ["ನೆಹರು ಮತ್ತು ಪಟೇಲ್", "ಗಾಂಧೀಜಿ ಮತ್ತು ಜಿನ್ನಾ", "ಅಂಬೇಡ್ಕರ್ ಮತ್ತು ಬಿ.ಎನ್. ರಾವ್", "ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್"], ans: 1, exp: "ಮಹಾತ್ಮಾ ಗಾಂಧಿಜಿ ಮತ್ತು ಮಹಮ್ಮದ್ ಅಲಿ ಜಿನ್ನಾ ಭಾಗವಹಿಸಿರಲಿಲ್ಲ." },
            { q: "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಮೊದಲ ಅಧಿವೇಶನ ದೆಹಲಿಯ ಸೆಂಟ್ರಲ್ ಹಾಲ್‌ನಲ್ಲಿ ನಡೆದದ್ದು ಯಾವಾಗ?", options: ["1946 ಡಿಸೆಂಬರ್ 9", "1946 ಡಿಸೆಂಬರ್ 11", "1947 ಆಗಸ್ಟ್ 14", "1949 ನವೆಂಬರ್ 26"], ans: 0, exp: "1946 ಡಿಸೆಂಬರ್ 9 ರಂದು ಸೋಮವಾರ ಬೆಳಿಗ್ಗೆ 11 ಗಂಟೆಗೆ ಪ್ರಥಮ ಸಭೆ ನಡೆಯಿತು." },
            { q: "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಹಂಗಾಮಿ (ತಾತ್ಕಾಲಿಕ) ಅಧ್ಯಕ್ಷರಾಗಿ ಯಾರು ಆಯ್ಕೆಯಾಗಿದ್ದರು?", options: ["ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್", "ಸಚ್ಚಿದಾನಂದ ಸಿನ್ಹಾ", "ಡಾ. ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ಬಿ.ಎನ್. ರಾವ್"], ans: 1, exp: "ಡಾ. ಸಚ್ಚಿದಾನಂದ ಸಿನ್ಹಾರವರು ಹಂಗಾಮಿ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದರು." },
            { q: "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಎರಡನೇ ಸಭೆ ನಡೆದ ದಿನಾಂಕ ಯಾವುದು?", options: ["1946 ಡಿಸೆಂಬರ್ 9", "1946 ಡಿಸೆಂಬರ್ 11", "1946 ಡಿಸೆಂಬರ್ 13", "1947 ಆಗಸ್ಟ್ 29"], ans: 1, exp: "ಎರಡನೇ ಸಭೆಯು 1946 ಡಿಸೆಂಬರ್ 11 ರಂದು ನಡೆಯಿತು." },
            { q: "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಖಾಯಂ ಅಧ್ಯಕ್ಷರಾಗಿ ಆಯ್ಕೆಯಾದವರು ಯಾರು?", options: ["ಡಾ|| ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್", "ಜವಾಹರಲಾಲ್ ನೆಹರು", "ಸರ್ದಾರ್ ವಲ್ಲಭಭಾಯಿ ಪಟೇಲ್"], ans: 0, exp: "ಡಾ|| ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್ ಖಾಯಂ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದರು." },
            { q: "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಮುಖ್ಯ ಕಾನೂನು/ಸಂವಿಧಾನ ಸಲಹೆಗಾರರಾಗಿ ಯಾರು ಆಯ್ಕೆಯಾದರು?", options: ["ಬಿ.ಎನ್. ರಾವ್", "ಎಚ್.ವಿ. ಅಯ್ಯಂಗಾರ್", "ಕೆ.ಎಮ್. ಮುನ್ಷಿ", "ಅಲ್ಲಾಡಿ ಕೃಷ್ಣಸ್ವಾಮಿ"], ans: 0, exp: "ಬಿ.ಎನ್. ರಾವ್ ಅವರು ಸಂವಿಧಾನದ ಸಲಹೆಗಾರರಾಗಿದ್ದರು." },

        ];

        let currentQ = 0;
        let userAnswers = new Array(questions.length).fill(null);

        function loadQuestion() {
            const qData = questions[currentQ];
            document.getElementById("q-number").innerText = `Question ${currentQ + 1} of ${questions.length}`;
            document.getElementById("q-text").innerText = `${currentQ + 1}. ${qData.q}`;

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            qData.options.forEach((opt, idx) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
                
                if (userAnswers[currentQ] !== null) {
                    if (idx === qData.ans) {
                        li.classList.add("correct");
                    }
                    if (userAnswers[currentQ] === idx && idx !== qData.ans) {
                        li.classList.add("incorrect");
                    }
                }

                li.onclick = () => selectOption(idx);
                container.appendChild(li);
            });

            // Explanation handling
            const expBox = document.getElementById("explanation-box");
            if (userAnswers[currentQ] !== null) {
                expBox.style.display = "block";
                if (userAnswers[currentQ] === qData.ans) {
                    expBox.className = "explanation correct-exp";
                    expBox.innerText = `ಉತ್ತರ ಸರಿಯಾಗಿದೆ! \n${qData.exp}`;
                } else {
                    expBox.className = "explanation incorrect-exp";
                    expBox.innerText = `ತಪ್ಪು (Incorrect).\nಸರಿಯಾದ ಉತ್ತರ: ${qData.options[qData.ans]}\n${qData.exp}`;
                }
            } else {
                expBox.style.display = "none";
            }

            // Button States
            document.getElementById("prev-btn").disabled = currentQ === 0;
            document.getElementById("next-btn").disabled = currentQ === questions.length - 1;

            updatePalette();
            updateScore();
        }

        function selectOption(idx) {
            if (userAnswers[currentQ] !== null) return; // Prevent changing answer
            userAnswers[currentQ] = idx;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQ > 0) {
                currentQ--;
                loadQuestion();
            }
        }

        function retestQuiz() {
            if (confirm("ನೀವು ಪರೀಕ್ಷೆಯನ್ನು ಮತ್ತೆ ಮೊದಲಿನಿಂದ ಆರಂಭಿಸಲು ಬಯಸುತ್ತೀರಾ? (Do you want to restart the test?)")) {
                userAnswers = new Array(questions.length).fill(null);
                currentQ = 0;
                loadQuestion();
            }
        }

        function updatePalette() {
            const grid = document.getElementById("palette-grid");
            grid.innerHTML = "";
            questions.forEach((_, idx) => {
                const btn = document.createElement("button");
                btn.className = "p-btn";
                btn.innerText = idx + 1;

                if (idx === currentQ) btn.classList.add("current");

                if (userAnswers[idx] !== null) {
                    if (userAnswers[idx] === questions[idx].ans) {
                        btn.classList.add("answered-correct");
                    } else {
                        btn.classList.add("answered-wrong");
                    }
                }

                btn.onclick = () => {
                    currentQ = idx;
                    loadQuestion();
                };
                grid.appendChild(btn);
            });
        }

        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === questions[idx].ans) score++;
            });
            document.getElementById("score-display").innerText = `Score: ${score} / ${questions.length}`;
        }

        // Initialize Test
        loadQuestion();
    </script>
</body>
</html>
