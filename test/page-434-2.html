<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Mock Test - Indian Constitution Chapter 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0f24;
            --header-bg: #0d1b2a;
            --card-bg: #131e3a;
            --card-border: #1e2d5a;
            --slate-bg: #1e293b;
            --slate-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --glow-cyan: #00f2fe;
            
            --correct-bg: #1b4332;
            --correct-border: #2ec4b6;
            --correct-text: #e8f5e9;
            
            --wrong-bg: #4a151b;
            --wrong-border: #e63946;
            --wrong-text: #ffebee;
            
            --btn-retest: #475569;
            --btn-retest-hover: #334155;
            --btn-wrong: #dc2626;
            --btn-wrong-hover: #b91c1c;

            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .test-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer-badge {
            background-color: #2c121e;
            color: #ff5252;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 82, 82, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 12px rgba(255, 82, 82, 0.15);
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            padding: 28px;
            gap: 28px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* Quiz Panel */
        .quiz-panel {
            flex: 3;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-header {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-main);
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: var(--slate-bg);
            border: 2px solid var(--slate-border);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-main);
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-blue);
            background-color: rgba(37, 99, 235, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .option-btn[disabled] {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(46, 196, 182, 0.25);
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.25);
        }

        /* Explanation Box */
        .explanation-box {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--slate-border);
            border-left: 5px solid var(--glow-cyan);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            display: none;
            color: #e2e8f0;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Controls */
        .navigation-btns {
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not([disabled]) {
            transform: translateY(-2px);
        }

        .btn-nav {
            background-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-nav:hover:not([disabled]) {
            background-color: var(--accent-blue-hover);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        .btn:disabled {
            background-color: var(--slate-bg);
            color: var(--text-muted);
            border: 1px solid var(--slate-border);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Sidebar Palette */
        .palette-panel {
            flex: 1;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 320px;
        }

        .score-board {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .palette-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 10px;
            margin-bottom: 24px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .palette-grid::-webkit-scrollbar {
            width: 6px;
        }
        .palette-grid::-webkit-scrollbar-thumb {
            background: var(--slate-border);
            border-radius: 4px;
        }

        .palette-btn {
            width: 42px;
            height: 42px;
            border: 2px solid var(--slate-border);
            background: var(--slate-bg);
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .palette-btn:hover {
            border-color: var(--glow-cyan);
            color: var(--glow-cyan);
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .palette-btn.active {
            border-color: var(--glow-cyan) !important;
            border-width: 3px !important;
            box-shadow: 0 0 15px var(--glow-cyan);
        }

        .palette-btn.correct {
            background-color: var(--correct-border);
            border-color: var(--correct-border);
            color: #052e16;
        }

        .palette-btn.wrong {
            background-color: var(--wrong-border);
            border-color: var(--wrong-border);
            color: #ffffff;
        }

        .control-btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-retest {
            background-color: var(--btn-retest);
            color: white;
        }

        .btn-retest:hover {
            background-color: var(--btn-retest-hover);
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.3);
        }

        .btn-wrong {
            background-color: var(--btn-wrong);
            color: white;
        }

        .btn-wrong:hover {
            background-color: var(--btn-wrong-hover);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                padding: 16px;
                gap: 16px;
            }
            .palette-panel {
                min-width: 100%;
            }
            header {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="test-title" id="testTitle">ಅಧ್ಯಾಯ-10 ಭಾಗ-5 : ಕೇಂದ್ರ ಸರ್ಕಾರ</div>
        <div class="timer-badge" id="timer">⏱️ Time Remaining: 45:00</div>
    </header>

    <div class="container">
        <main class="quiz-panel">
            <div>
                <div class="question-header" id="questionText">Loading question...</div>
                <div class="options-container" id="optionsContainer"></div>
                <div class="explanation-box" id="explanationBox"></div>
            </div>

            <div class="navigation-btns">
                <button class="btn btn-nav" id="prevBtn" onclick="navigate(-1)">← Previous</button>
                <button class="btn btn-nav" id="nextBtn" onclick="navigate(1)">Next →</button>
            </div>
        </main>

        <aside class="palette-panel">
            <div>
                <div class="score-board" id="scoreBoard">Score: 0 / 0</div>
                <div class="palette-title">Question Palette (1 to 54)</div>

            </div>

            <div class="control-btns">
                <button class="btn btn-retest" onclick="resetFullTest()">🔄 ಮರುಪರೀಕ್ಷೆ (Retest All)</button>
                <button class="btn btn-wrong" onclick="startWrongTest()">⚠️ Test Wrong Answers</button>
            </div>
        </aside>
    </div>

    <script>
        // Full Question Dataset (Extracted from study material points 1 to 54)
        const originalQuestions = [
            {

                explanation: "ಕೇಂದ್ರ ಸರ್ಕಾರದ ಕುರಿತು ಸಂವಿಧಾನದ 5ನೇ ಭಾಗದಲ್ಲಿ (Part V) 52ನೇ ವಿಧಿಯಿಂದ 151ನೇ ವಿಧಿಯವರೆಗೂ ವಿವರಿಸಲಾಗಿದೆ."

            {

                options: ["ಪ್ರಧಾನ ಮಂತ್ರಿ", "ಬ್ರಿಟನ್ ದೊರೆ (Monarch)", "ಲಾರ್ಡ್ ಚಾನ್ಸೆಲರ್", "ಸ್ಪೀಕರ್"],

            {

            {
                id: 7,
                question: "ಸಂವಿಧಾನದ 60ನೇ ವಿಧಿಯ ಪ್ರಕಾರ ರಾಷ್ಟ್ರಪತಿಯವರಿಗೆ ಪ್ರಮಾಣವಚನವನ್ನು ಯಾರು ಬೋಧಿಸುತ್ತಾರೆ?",

            {

                options: ["ಎ.ಪಿ.ಜೆ. ಅಬ್ದುಲ್ ಕಲಾಂ", "ರಾಮನಾಥ್ ಕೋವಿಂದ್", "ದ್ರೌಪದಿ ಮುರ್ಮು", "ಎನ್. ಸಂಜೀವರೆಡ್ಡಿ"],
                correct: 2,
                explanation: "ದ್ರೌಪದಿ ಮುರ್ಮು ಅವರು ಸ್ವಾತಂತ್ರ್ಯದ ನಂತರ ಜನಿಸಿದ ಮೊದಲ ರಾಷ್ಟ್ರಪತಿ ಹಾಗೂ ಈ ಹುದ್ದೆಗೇರಿದ ಅತ್ಯಂತ ಕಿರಿಯ ವ್ಯಕ್ತಿಯಾಗಿದ್ದಾರೆ. (ಇವರು 2015-2021 ರವರೆಗೆ ಜಾರ್ಖಂಡ್ ರಾಜ್ಯಪಾಲರಾಗಿದ್ದರು)."

        // State Tracking Controls
        let activeQuestions = [...originalQuestions];
        let userAnswers = {};
        let currentActiveIndex = 0;
        let wrongTestCounter = 1;
        const baseTitle = "ಅಧ್ಯಾಯ-10 ಭಾಗ-5 : ಕೇಂದ್ರ ಸರ್ಕಾರ";

        // DOM Nodes
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanationBox = document.getElementById('explanationBox');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const paletteGrid = document.getElementById('paletteGrid');
        const scoreBoard = document.getElementById('scoreBoard');
        const testTitle = document.getElementById('testTitle');

        // Init App
        function initQuiz() {
            renderPalette();
            loadQuestion(0);
            updateScore();
            startTimer(45 * 60);
        }

        // Render Current Question Item
        function loadQuestion(index) {
            currentActiveIndex = index;
            const q = activeQuestions[index];

            questionText.innerHTML = `<strong>Q${q.id}.</strong> ${q.question}`;
            optionsContainer.innerHTML = '';
            
            const selectedOption = userAnswers[q.id];
            const isAnswered = selectedOption !== undefined;

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;

                if (isAnswered) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (selectedOption === optIdx && optIdx !== q.correct) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => handleAnswer(q.id, optIdx);
                }

                optionsContainer.appendChild(btn);
            });

            if (isAnswered) {
                explanationBox.innerHTML = q.explanation;
                explanationBox.style.display = 'block';
            } else {
                explanationBox.style.display = 'none';
            }

            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === activeQuestions.length - 1;

            highlightPalette();
        }

        // Handle Answer Click
        function handleAnswer(qId, selectedIdx) {
            userAnswers[qId] = selectedIdx;
            loadQuestion(currentActiveIndex);
            renderPalette();
            updateScore();
        }

        // Navigation Next / Prev
        function navigate(direction) {
            const newIndex = currentActiveIndex + direction;
            if (newIndex >= 0 && newIndex < activeQuestions.length) {
                loadQuestion(newIndex);
            }
        }

        // Render Palette Buttons (Preserving Global Original Numbers 1 to 54)
        function renderPalette() {
            paletteGrid.innerHTML = '';
            
            activeQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.innerText = q.id; // Strictly original Question Number

                const answer = userAnswers[q.id];
                if (answer !== undefined) {
                    if (answer === q.correct) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('wrong');
                    }
                }

                if (idx === currentActiveIndex) {
                    btn.classList.add('active');
                }

                btn.onclick = () => loadQuestion(idx);
                paletteGrid.appendChild(btn);
            });
        }

        // Highlight Active Question Button
        function highlightPalette() {
            const buttons = paletteGrid.children;
            for (let i = 0; i < buttons.length; i++) {
                if (i === currentActiveIndex) {
                    buttons[i].classList.add('active');
                } else {
                    buttons[i].classList.remove('active');
                }
            }
        }

        // Update Dynamic Score Display
        function updateScore() {
            let correctCount = 0;
            activeQuestions.forEach(q => {
                if (userAnswers[q.id] === q.correct) {
                    correctCount++;
                }
            });
            scoreBoard.innerText = `Score: ${correctCount} / ${activeQuestions.length}`;
        }

        // Action: Reset Complete Test
        function resetFullTest() {
            activeQuestions = [...originalQuestions];
            userAnswers = {};
            wrongTestCounter = 1;
            testTitle.innerText = baseTitle;
            renderPalette();
            loadQuestion(0);
            updateScore();
        }

        // Action: Filter and Retest Wrong Answers Only
        function startWrongTest() {
            const wrongQuestions = activeQuestions.filter(q => {
                const ans = userAnswers[q.id];
                return ans !== undefined && ans !== q.correct;
            });

            if (wrongQuestions.length === 0) {
                alert("ಖಾತ್ರಿಪಡಿಸಲಾಗಿದೆ: ಪುನರಾವರ್ತಿಸಲು ಯಾವುದೇ ತಪ್ಪು ಉತ್ತರಗಳಿಲ್ಲ! (No incorrect answers found to retest!)");
                return;
            }

            // Clear choices for incorrect questions to allow re-attempt
            wrongQuestions.forEach(q => {
                delete userAnswers[q.id];
            });

            activeQuestions = wrongQuestions;
            testTitle.innerText = `${baseTitle} (Wrong Test-${wrongTestCounter})`;
            wrongTestCounter++;

            renderPalette();
            loadQuestion(0);
            updateScore();
        }

        // Standard Timer Display
        function startTimer(durationSeconds) {
            let timer = durationSeconds;
            const timerDisplay = document.getElementById('timer');
            
            setInterval(() => {
                const minutes = Math.floor(timer / 60);
                const seconds = timer % 60;

                const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
                const displaySeconds = seconds < 10 ? '0' + seconds : seconds;

                timerDisplay.innerText = `⏱️ Time Remaining: ${displayMinutes}:${displaySeconds}`;

                if (--timer < 0) {
                    timer = 0;
                    timerDisplay.innerText = "⏱️ Time Expired!";
                }
            }, 1000);
        }

        // Launch Quiz
        window.onload = initQuiz;
    </script>
