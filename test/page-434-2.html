    { q: "ಕೇಂದ್ರ ಸರ್ಕಾರದ ಕುರಿತು ಸಂವಿಧಾನದ ಯಾವ ಭಾಗದಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ?", options: ["ಭಾಗ 3", "ಭಾಗ 4", "ಭಾಗ 5", "ಭಾಗ 6"], answer: 2, exp: "ಸಂವಿಧಾನದ 5ನೇ ಭಾಗದಲ್ಲಿ (ವಿಧ 52 ರಿಂದ 151) ಕೇಂದ್ರ ಸರ್ಕಾರದ ಬಗ್ಗೆ ವಿವರಿಸಲಾಗಿದೆ." },
    { q: "ಭಾರತದ ರಾಷ್ಟ್ರಪತಿಯವರ ಸ್ಥಾನವನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 52", "ವಿಧಿ 53", "ವಿಧಿ 54", "ವಿಧಿ 55"], answer: 0, exp: "ವಿಧಿ-52 ರ ಪ್ರಕಾರ ಭಾರತ ದೇಶಕ್ಕೆ ಒಬ್ಬರು ರಾಷ್ಟ್ರಪತಿ ಇರತಕ್ಕದ್ದು." },
    { q: "ರಾಷ್ಟ್ರಪತಿಗಳ ಚುನಾವಣೆಯನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 52", "ವಿಧಿ 54", "ವಿಧಿ 56", "ವಿಧಿ 60"], answer: 1, exp: "ವಿಧಿ-54 ರಾಷ್ಟ್ರಪತಿಗಳ ಚುನಾವಣೆಯ ಕುರಿತು ವಿವರಣೆ ನೀಡುತ್ತದೆ." },

    { q: "ಕೇಂದ್ರಾಡಳಿತ ಪ್ರದೇಶಗಳಿಂದ ರಾಷ್ಟ್ರಪತಿ ಚುನಾವಣೆಯಲ್ಲಿ ಭಾಗವಹಿಸುವವರು ಯಾರು?", options: ["ಲೆಫ್ಟಿನೆಂಟ್ ಗವರ್ನರ್", "ವಿಧಾನಸಭೆಯ ಚುನಾಯಿತ ಸದಸ್ಯರು", "ಆಡಳಿತಾಧಿಕಾರಿಗಳು", "ಯಾರೂ ಇಲ್ಲ"], answer: 1, exp: "ಕೇಂದ್ರಾಡಳಿತ ಪ್ರದೇಶಗಳ (ದೆಹಲಿ, ಪುದುಚೇರಿ ಇತ್ಯಾದಿ) ವಿಧಾನಸಭೆಯ ಚುನಾಯಿತ ಸದಸ್ಯರು ಮತ ಚಲಾಯಿಸುತ್ತಾರೆ." },

    { q: "ಯಾವ ಮಸೂದೆಗೆ ಜಂಟಿ ಅಧಿವೇಶನ ಕರೆಯಲು ಬರುವುದಿಲ್ಲ?", options: ["ವರದಕ್ಷಿಣೆ ಕಾಯ್ದೆ", "ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿ ಮಸೂದೆ", "ಬ್ಯಾಂಕಿಂಗ್ ಮಸೂದೆ", "ಪೋಟಾ ಕಾಯ್ದೆ"], answer: 1, exp: "ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿ ಮಸೂದೆಗೂ ಜಂಟಿ ಅಧಿವೇಶನ ಕರೆಯಲು ಬರುವುದಿಲ್ಲ." },
    { q: "ಯಾವ ವಿಷಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದಂತೆ ಜಂಟಿ ಅಧಿವೇಶನ ಕರೆಯಲು ಬರುವುದಿಲ್ಲ?", options: ["ಆಯವ್ಯಯ (ಬಜೆಟ್) ಮಸೂದೆ", "ಸಾಮಾನ್ಯ ಮಸೂದೆ", "ವರದಕ್ಷಿಣೆ ಕಾಯ್ದೆ", "ಬ್ಯಾಂಕಿಂಗ್ ಸೇವಾ ಆಯೋಗ"], answer: 0, exp: "ಆಯವ್ಯಯ ಮಸೂದೆಗೆ ಜಂಟಿ ಅಧಿವೇಶನ ಕರೆಯಲು ಅವಕಾಶವಿಲ್ಲ." },
    { q: "ಭಾರತದಲ್ಲಿ ಮೊದಲ ಬಾರಿಗೆ ಜಂಟಿ ಅಧಿವೇಶನ ಕರೆಯಲಾದ ಕಾಯ್ದೆ ಯಾವುದು? (1961)", options: ["ಬ್ಯಾಂಕಿಂಗ್ ಕಾಯ್ದೆ", "ವರದಕ್ಷಿಣೆ ನಿಷೇಧ ಕಾಯ್ದೆ ಮಸೂದೆ", "ಪೋಟಾ ಕಾಯ್ದೆ", "ಭ್ರಷ್ಟಾಚಾರ ತಡೆ ಕಾಯ್ದೆ"], answer: 1, exp: "1961 ರಲ್ಲಿ ವರದಕ್ಷಿಣೆ ನಿಷೇಧ ಕಾಯ್ದೆಗಾಗಿ ಮೊದಲ ಜಂಟಿ ಅಧಿವೇಶನ ನಡೆಯಿತು." },
    { q: "1978 ರಲ್ಲಿ ಜಂಟಿ ಅಧಿವೇಶನ ನಡೆಸಲಾದ ಮಸೂದೆ ಯಾವುದು?", options: ["ಬ್ಯಾಂಕಿಂಗ್ ಸೇವಾ ಆಯೋಗ ಮಸೂದೆ", "ವರದಕ್ಷಿಣೆ ಕಾಯ್ದೆ", "ಪೋಟಾ ಕಾಯ್ದೆ", "ಬಜೆಟ್ ಮಸೂದೆ"], answer: 0, exp: "1978 ರಲ್ಲಿ ಬ್ಯಾಂಕಿಂಗ್ ಸೇವಾ ಆಯೋಗ ಮಸೂದೆಗಾಗಿ ಜಂಟಿ ಅಧಿವೇಶನ ಕರೆಯಲಾಗಿತ್ತು." },
    { q: "2002 ರಲ್ಲಿ ಜಂಟಿ ಅಧಿವೇಶನದ ಮೂಲಕ ಅಂಗೀಕಾರಗೊಂಡ ಕಾಯ್ದೆ ಯಾವುದು?", options: ["ವರದಕ್ಷಿಣೆ ನಿಷೇಧ", "ಪೋಟಾ (POTA) ಕಾಯ್ದೆ", "ಬ್ಯಾಂಕಿಂಗ್ ಕಾಯ್ದೆ", "ಶಿಕ್ಷಣ ಕಾಯ್ದೆ"], answer: 1, exp: "2002 ರಲ್ಲಿ ಉಗ್ರ ನಿಗ್ರಹ ಕಾಯ್ದೆಯಾದ POTA ಮಸೂದೆಗೆ ಜಂಟಿ ಅಧಿವೇಶನ ನಡೆಯಿತು." },
    { q: "ರಾಷ್ಟ್ರಪತಿಗಳ ಸುಗ್ರೀವಾಜ್ಞೆ (Ordinance) ಹೊರಡಿಸುವ ಅಧಿಕಾರವನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 72", "ವಿಧಿ 110", "ವಿಧಿ 123", "ವಿಧಿ 213"], answer: 2, exp: "ವಿಧಿ-123 ರ ಅನ್ವಯ ಸಂಸತ್ತಿನ ಅಧಿವೇಶನ ಇಲ್ಲದಿದ್ದಾಗ ರಾಷ್ಟ್ರಪತಿ ಸುಗ್ರೀವಾಜ್ಞೆ ಹೊರಡಿಸಬಹುದು." },
    { q: "ಪ್ರಧಾನ ಮಂತ್ರಿಯವರನ್ನು ನೇಮಕ ಮಾಡುವ ರಾಷ್ಟ್ರಪತಿಗಳ ಅಧಿಕಾರ ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 74", "ವಿಧಿ 75", "ವಿಧಿ 76", "ವಿಧಿ 78"], answer: 1, exp: "ವಿಧಿ-75 ರ ಪ್ರಕಾರ ಬಹುಮತ ಪಡೆದ ಪಕ್ಷದ ನಾಯಕನನ್ನು ಪ್ರಧಾನಿಯಾಗಿ ರಾಷ್ಟ್ರಪತಿ ನೇಮಿಸುತ್ತಾರೆ." },
    { q: "ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ನೇಮಕ ಮಾಡಲು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 75", "ವಿಧಿ 76", "ವಿಧಿ 148", "ವಿಧಿ 155"], answer: 1, exp: "ವಿಧಿ-76 ರ ಅನ್ವಯ ರಾಷ್ಟ್ರಪತಿಗಳು ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ನೇಮಿಸುತ್ತಾರೆ." },
    { q: "ದೇಶದ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿಯನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["ಅಡ್ವೋಕೇಟ್ ಜನರಲ್", "ಸಾಲಿಸಿಟರ್ ಜನರಲ್", "ಅಟಾರ್ನಿ ಜನರಲ್", "ಮುಖ್ಯ ನ್ಯಾಯಾಧೀಶರು"], answer: 2, exp: "ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ದೇಶದ ಉನ್ನತ ಕಾನೂನಾಧಿಕಾರಿ ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ." },
    { q: "ಅಟಾರ್ನಿ ಜನರಲ್ ತಮ್ಮ ರಾಜೀನಾಮೆಯನ್ನು ಯಾರಿಗೆ ಸಲ್ಲಿಸುತ್ತಾರೆ?", options: ["ಪ್ರಧಾನ ಮಂತ್ರಿ", "ರಾಷ್ಟ್ರಪತಿ", "ಸುಪ್ರೀಂ ಕೋರ್ಟ್", "ಕಾನೂನು ಸಚಿವರು"], answer: 1, exp: "ಅಟಾರ್ನಿ ಜನರಲ್ ತಮ್ಮ ರಾಜೀನಾಮೆ ಪತ್ರವನ್ನು ರಾಷ್ಟ್ರಪತಿಗಳಿಗೆ ಸಲ್ಲಿಸುತ್ತಾರೆ." },
    { q: "ರಾಜ್ಯಗಳ ರಾಜ್ಯಪಾಲರನ್ನು ನೇಮಕ ಮಾಡುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 153", "ವಿಧಿ 155", "ವಿಧಿ 161", "ವಿಧಿ 165"], answer: 1, exp: "ವಿಧಿ-155 ರ ಪ್ರಕಾರ ಕೇಂದ್ರ ಸಚಿವ ಸಂಪುಟದ ಶಿಫಾರಸಿನಂತೆ ರಾಜ್ಯಪಾಲರನ್ನು ನೇಮಿಸಲಾಗುತ್ತದೆ." },
    { q: "CAG (ಕಂಟ್ರೋಲರ್ ಮತ್ತು ಆಡಿಟರ್ ಜನರಲ್) ನೇಮಕಾತಿಯನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 148", "ವಿಧಿ 280", "ವಿಧಿ 324", "ವಿಧಿ 315"], answer: 0, exp: "ವಿಧಿ-148 ರ ಅನ್ವಯ ಲೆಕ್ಕ ನಿಯಂತ್ರಕರು ಮತ್ತು ಮಹಾಲೆಕ್ಕ ಪರಿಶೋಧಕರನ್ನು నేಮಿಸಲಾಗುತ್ತದೆ." },
    { q: "ರಾಷ್ಟ್ರಪತಿಯವರ ಕ್ಷಮಾಧಾನ (Pardon) ಅಧಿಕಾರವನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 61", "ವಿಧಿ 72", "ವಿಧಿ 123", "ವಿಧಿ 161"], answer: 1, exp: "ವಿಧಿ-72 ರ ಪ್ರಕಾರ ಮರಣದಂಡನೆ ಸೇರಿದಂತೆ ಶಿಕ್ಷೆ ಕಡಿತಗೊಳಿಸುವ/ಕ್ಷಮಿಸುವ ಅಧಿಕಾರ ರಾಷ್ಟ್ರಪತಿಗಿದೆ." },
    { q: "ಸಂವಿಧಾನದ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಉಪಬಂಧಗಳನ್ನು ಯಾವ ದೇಶದಿಂದ ಎರವಲು ಪಡೆಯಲಾಗಿದೆ?", options: ["ಅಮೆರಿಕ", "ಬ್ರಿಟನ್", "ಜರ್ಮನಿ", "ರಷ್ಯಾ"], answer: 2, exp: "ಸಂವಿಧಾನದ 18ನೇ ಭಾಗದ ತುರ್ತು ಪರಿಸ್ಥಿತಿಯ ವಿಷಯವನ್ನು ಜರ್ಮನಿಯ ವೈಮರ್ ಸಂವಿಧಾನದಿಂದ ಪಡೆಯಲಾಗಿದೆ." },
    { q: "1962 ರ ಭಾರತ-ಚೀನಾ ಯುದ್ಧದ ಸಮಯದಲ್ಲಿ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಘೋಷಿಸಿದ ದಿನಾಂಕ ಯಾವುದು?", options: ["1962 ಅಕ್ಟೋಬರ್ 26", "1962 ನವೆಂಬರ್ 15", "1965 ಆಗಸ್ಟ್ 15", "1971 ಡಿಸೆಂಬರ್ 3"], answer: 0, exp: "1962 ಅಕ್ಟೋಬರ್ 26 ರಂದು ಚೀನಾ ದಾಳಿ ಮಾಡಿದಾಗ ಮೊದಲ ಬಾರಿ ರಾಷ್ಟ್ರೀಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಹೇರಲಾಯಿತು." },
    { q: "ಮೊದಲ ಬಾರಿಗೆ ರಾಜ್ಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿ (ವಿಧಿ 356) ಜಾರಿಯಾದ ರಾಜ್ಯ ಯಾವುದು?", options: ["ಕರ್ನಾಟಕ", "ಪಂಜಾಬ್", "ಕೇರಳ", "ತಮಿಳುನಾಡು"], answer: 1, exp: "1951 ರಲ್ಲಿ ಮೊದಲ ಬಾರಿಗೆ ಪಂಜಾಬ್ ರಾಜ್ಯದಲ್ಲಿ ರಾಷ್ಟ್ರಪತಿ ಆಳ್ವಿಕೆ ಹೇರಲಾಯಿತು." },
    { q: "ಕರ್ನಾಟಕದಲ್ಲಿ ಇದುವರೆಗೆ ಎಷ್ಟು ಬಾರಿ ರಾಷ್ಟ್ರಪತಿ ಆಳ್ವಿಕೆ (ರಾಜ್ಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿ) ಹೇರಲಾಗಿದೆ?", options: ["4 ಬಾರಿ", "5 ಬಾರಿ", "6 ಬಾರಿ", "8 ಬಾರಿ"], answer: 2, exp: "ಕರ್ನಾಟಕದಲ್ಲಿ ಇದುವರೆಗೆ ಒಟ್ಟು 6 ಬಾರಿ ರಾಜ್ಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಘೋಷಿಸಲಾಗಿದೆ." },
    { q: "ಒಂದು ಮಸೂದೆಯನ್ನು ಯಾವುದೇ ನಿರ್ಧಾರ ತೆಗೆದುಕೊಳ್ಳದೆ ತಮ್ಮಲ್ಲೇ ಇಟ್ಟುಕೊಳ್ಳುವ ರಾಷ್ಟ್ರಪತಿಯವರ ಅಧಿಕಾರ ಯಾವುದು?", options: ["ಪಾಕೆಟ್ ವೀಟೋ", "ಸೂಪರ್ ವೀಟೋ", "ನಿರಂಕುಶ ವೀಟೋ", "ಯಾವುದೂ ಅಲ್ಲ"], answer: 0, exp: "ಇದನ್ನು ಪಾಕೆಟ್ ವೀಟೋ (Pocket Veto) ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "ಮಸೂದೆಯನ್ನು ಮರು ಪರಿಶೀಲನೆಗೆ ಸಂಸತ್ತಿಗೆ ಹಿಂತಿರುಗಿಸುವ ಅಧಿಕಾರ ಯಾವುದು?", options: ["ಪಾಕೆಟ್ ವೀಟೋ", "ಸೂಪರ್ ವೀಟೋ (ಅಮಾನತು ವೀಟೋ)", "ನಿರಂಕುಶ ವೀಟೋ", "ವಿಶೇಷ ವೀಟೋ"], answer: 1, exp: "ಮರು ಪರಿಶೀಲನೆಗೆ ಕಳುಹಿಸುವುದನ್ನು ಸೂಪರ್/Suspensive Veto ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "ಮಸೂದೆಗೆ ಕಡ್ಡಾಯವಾಗಿ ಒಪ್ಪಿಗೆ ನೀಡುವುದು ಅಥವಾ ಸಂಪೂರ್ಣ ತಿರಸ್ಕರಿಸುವ ಅಧಿಕಾರ ಯಾವುದು?", options: ["ಪಾಕೆಟ್ ವೀಟೋ", "ಸೂಪರ್ ವೀಟೋ", "ನಿರಂಕುಶ ವೀಟೋ (Absolute Veto)", "ಅನಂತ ವೀಟೋ"], answer: 2, exp: "ಒಂದು ಮಸೂದೆಗೆ ಒಪ್ಪಿಗೆ ನೀಡದಿರುವುದನ್ನು ನಿರಂಕುಶ ವೀಟೋ ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "ಡಾ. ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್ ಅವರ ಜನ್ಮಸ್ಥಳ 'ಜಿರಾದೇಯಿ' ಯಾವ ರಾಜ್ಯದಲ್ಲಿದೆ?", options: ["ಉತ್ತರ ಪ್ರದೇಶ", "ಬಿಹಾರ", "ಮಧ್ಯಪ್ರದೇಶ", "ಒಡಿಶಾ"], answer: 1, exp: "ಜಿರಾದೇಯಿ ಬಿಹಾರ ರಾಜ್ಯದಲ್ಲಿದೆ." },
    { q: "ಡಿಸೆಂಬರ್ 3 ರಂದು ಯಾರ ಜನ್ಮದಿನವನ್ನು 'ವಕೀಲರ ದಿನ' (Advocates Day) ಆಗಿ ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್", "ಡಾ. ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ಸರ್ದಾರ್ ಪಟೇಲ್", "ಅಲ್ಲಾಡಿ ಕೃಷ್ಣಸ್ವಾಮಿ"], answer: 1, exp: "ಡಾ. ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್ ಅವರ ಜನ್ಮದಿನವನ್ನು ವಕೀಲರ ದಿನವಾಗಿ ಆಚರಿಸಲಾಗುತ್ತದೆ." },
    { q: "ಭಾರತದ ಮೊದಲ ರಾಷ್ಟ್ರಪತಿ ಯಾರು?", options: ["ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್", "ಡಾ. ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ಜಾಕೀರ್ ಹುಸೇನ್", "ವಿ.ವಿ. ಗಿರಿ"], answer: 1, exp: "ಡಾ|| ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್ ಭಾರತದ ಮೊದಲ ರಾಷ್ಟ್ರಪತಿಗಳು." },

let currentIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion() {
    const qData = quizData[currentIndex];
    document.getElementById("question-text").innerText = `${currentIndex + 1}. ${qData.q}`;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.style.display = "none";
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${String.fromCharCode(65 + index)}) ${opt}`;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
    });

    if (userAnswers[currentIndex] !== null) {
        showResult(userAnswers[currentIndex]);
    }

    document.getElementById("prev-btn").disabled = currentIndex === 0;
    document.getElementById("next-btn").disabled = currentIndex === quizData.length - 1;
    
    updatePalette();
}

function selectOption(selectedIndex) {
    if (userAnswers[currentIndex] !== null) return; // Prevent changing answer
    
    userAnswers[currentIndex] = selectedIndex;
    showResult(selectedIndex);
    updateScore();
    updatePalette();
}

function showResult(selectedIndex) {
    const qData = quizData[currentIndex];
    const optionBtns = document.querySelectorAll(".option-btn");
    const feedbackBox = document.getElementById("feedback-box");

    optionBtns.forEach((btn, index) => {
        btn.disabled = true;
        if (index === qData.answer) {
            btn.classList.add("selected-correct");
        }
        if (index === selectedIndex && selectedIndex !== qData.answer) {
            btn.classList.add("selected-wrong");
        }
    });

    feedbackBox.style.display = "block";
    if (selectedIndex === qData.answer) {
        feedbackBox.className = "feedback-box correct";
        feedbackBox.innerHTML = `<b>ಸರಿ! (Correct)</b><br>${qData.exp}`;
    } else {
        feedbackBox.className = "feedback-box wrong";
        feedbackBox.innerHTML = `<b>ತಪ್ಪು! (Incorrect)</b><br>ಸರಿಯಾದ ಉತ್ತರ: <b>${qData.options[qData.answer]}</b>.<br>${qData.exp}`;
    }
}

function changeQuestion(direction) {
    currentIndex += direction;
    loadQuestion();
}

function initPalette() {
    const gridContainer = document.getElementById("grid-container");
    gridContainer.innerHTML = "";
    quizData.forEach((_, index) => {
        const item = document.createElement("div");
        item.className = "grid-item";
        item.innerText = index + 1;
        item.onclick = () => {
            currentIndex = index;
            loadQuestion();
        };
        gridContainer.appendChild(item);
    });
}

function updatePalette() {
    const items = document.querySelectorAll(".grid-item");
    items.forEach((item, index) => {
        item.className = "grid-item";
        if (index === currentIndex) {
            item.classList.add("active");
        }
        if (userAnswers[index] !== null) {
            if (userAnswers[index] === quizData[index].answer) {
                item.classList.add("answered-correct");
            } else {
                item.classList.add("answered-wrong");
            }
        }
    });
}

function updateScore() {
    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].answer) score++;
    });
    document.getElementById("score-display").innerText = `ಅಂಕಗಳು: ${score} / ${quizData.length}`;
}

function resetQuiz() {
    userAnswers = new Array(quizData.length).fill(null);
    currentIndex = 0;
    updateScore();
    loadQuestion();
}

// Initialize Quiz
initPalette();
loadQuestion();
