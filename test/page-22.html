    function prevQuestion() { if (currentActiveIndex > 0) loadQuestion(currentActiveIndex - 1); }
    function nextQuestion() { if (currentActiveIndex < currentQuestionsList.length - 1) loadQuestion(currentActiveIndex + 1); }
    function updateScore() { let score = 0; rawQuestions.forEach(q => { if (userAnswers[q.id] === q.ans) score++; }); scoreBox.innerText = `ಅಂಕಗಳು: ${score} / ${rawQuestions.length}`; }
    function retestAll() { currentQuestionsList = [...rawQuestions]; userAnswers = {}; wrongTestCounter = 1; testTitle.innerText = "ಪ್ರಮುಖ ಕವಿಗಳ ಆಶ್ರಯದಾತರು"; initTest(); }
    function testWrongAnswers() { const wrongQuestions = rawQuestions.filter(q => userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.ans); if (wrongQuestions.length === 0) { alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳು ಕಂಡುಬಂದಿಲ್ಲ! (No wrong answers found!)"); return; } wrongQuestions.forEach(q => delete userAnswers[q.id]); currentQuestionsList = wrongQuestions; testTitle.innerText = `Wrong Test-${wrongTestCounter++}`; currentActiveIndex = 0; renderPalette(); loadQuestion(currentActiveIndex); updateScore(); }
    window.onload = initTest;
  </script>
</body>
</html>
