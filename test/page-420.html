                options: ["ಮೂಲಭೂತ ಕರ್ತವ್ಯಗಳು ಮತ್ತು ಪೀಠಿಕೆಯಲ್ಲಿರುವ ಸಾಮಾಜಿಕ, ಆರ್ಥಿಕ, ರಾಜಕೀಯ ನ್ಯಾಯದ ಪದಗಳು", "ಸಮವರ್ತಿ ಪಟ್ಟಿ", "ರಾಜ್ಯ ನಿರ್ದೇಶಕ ತತ್ವಗಳು", "ಏಕಪೌರತ್ವ"],
                ans: 0,
                exp: "ರಷ್ಯಾದಿಂದ: ಮೂಲಭೂತ ಕರ್ತವ್ಯಗಳು, ಪೀಠಿಕೆಯಲ್ಲಿರುವ ಸಾಮಾಜಿಕ, ಆರ್ಥಿಕ, ರಾಜಕೀಯ ನ್ಯಾಯ ಪದಗಳು."
            },
            {
                q: "ಫ್ರೆಂಚ್ (France) ಸಂವಿಧಾನದಿಂದ ಎರವಲು ಪಡೆದ ಪ್ರಮುಖ ಪದಗಳು ಯಾವುವು?",
                options: ["ಸಮಾನತೆ, ಸ್ವಾತಂತ್ರ್ಯ, ಭ್ರಾತೃತ್ವ (Equality, Liberty, Fraternity)", "ಸಾಮಾಜಿಕ, ಆರ್ಥಿಕ, ರಾಜಕೀಯ ನ್ಯಾಯ", "ಸಾರ್ವಭೌಮ, ಸಮಾಜವಾದಿ, ಜಾತ್ಯತೀತ", "ನ್ಯಾಯಾಂಗ ವಿಮರ್ಶೆ"],
                ans: 0,
                exp: "ಫ್ರೆಂಚ್ ಸಂವಿಧಾನದಿಂದ: ಪೂರ್ವ ಪೀಠಿಕೆಯಲ್ಲಿರುವ ಸಮಾನತೆ, ಸ್ವಾತಂತ್ರ್ಯ, ಭ್ರಾತೃತ್ವ ಎಂಬ ಪದಗಳು."
            },
            {
                q: "ಸಂವಿಧಾನದ ತಿದ್ದುಪಡಿ (Amendment) ವಿಧಾನವನ್ನು ಯಾವ ದೇಶದಿಂದ ಎರವಲು ಪಡೆಯಲಾಗಿದೆ?",
                options: ["ದಕ್ಷಿಣ ಆಫ್ರಿಕಾ", "ಅಮೇರಿಕಾ", "ಬ್ರಿಟನ್", "ಜರ್ಮನಿ"],
                ans: 0,
                exp: "ದಕ್ಷಿಣ ಆಫ್ರಿಕಾ ಸಂವಿಧಾನದಿಂದ ತಿದ್ದುಪಡಿ ವಿಧಾನವನ್ನು ಎರವಲು ಪಡೆಯಲಾಗಿದೆ."
            }
        ];

        let currentQ = 0;
        let userAnswers = new Array(questions.length).fill(null);

        function loadQuestion() {
            const qData = questions[currentQ];
            document.getElementById("q-number").innerText = `Question ${currentQ + 1} of ${questions.length}`;
            document.getElementById("q-text").innerText = `${currentQ + 1}. ${qData.q}`;

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            qData.options.forEach((opt, idx) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
                
                if (userAnswers[currentQ] !== null) {
                    if (idx === qData.ans) {
                        li.classList.add("correct");
                    }
                    if (userAnswers[currentQ] === idx && idx !== qData.ans) {
                        li.classList.add("incorrect");
                    }
                }

                li.onclick = () => selectOption(idx);
                container.appendChild(li);
            });

            const expBox = document.getElementById("explanation-box");
            if (userAnswers[currentQ] !== null) {
                expBox.style.display = "block";
                if (userAnswers[currentQ] === qData.ans) {
                    expBox.className = "explanation correct-exp";
                    expBox.innerText = `ಉತ್ತರ ಸರಿಯಾಗಿದೆ! \n${qData.exp}`;
                } else {
                    expBox.className = "explanation incorrect-exp";
                    expBox.innerText = `ತಪ್ಪು (Incorrect).\nಸರಿಯಾದ ಉತ್ತರ: ${qData.options[qData.ans]}\n${qData.exp}`;
                }
            } else {
                expBox.style.display = "none";
            }

            document.getElementById("prev-btn").disabled = currentQ === 0;
            document.getElementById("next-btn").disabled = currentQ === questions.length - 1;

            updatePalette();
            updateScore();
        }

        function selectOption(idx) {
            if (userAnswers[currentQ] !== null) return;
            userAnswers[currentQ] = idx;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQ > 0) {
                currentQ--;
                loadQuestion();
            }
        }

        function retestQuiz() {
            if (confirm("ನೀವು ಪರೀಕ್ಷೆಯನ್ನು ಮತ್ತೆ ಮೊದಲಿನಿಂದ ಆರಂಭಿಸಲು ಬಯಸುತ್ತೀರಾ? (Do you want to restart the test?)")) {
                userAnswers = new Array(questions.length).fill(null);
                currentQ = 0;
                loadQuestion();
            }
        }

        function updatePalette() {
            const grid = document.getElementById("palette-grid");
            grid.innerHTML = "";
            questions.forEach((_, idx) => {
                const btn = document.createElement("button");
                btn.className = "p-btn";
                btn.innerText = idx + 1;

                if (idx === currentQ) btn.classList.add("current");

                if (userAnswers[idx] !== null) {
                    if (userAnswers[idx] === questions[idx].ans) {
                        btn.classList.add("answered-correct");
                    } else {
                        btn.classList.add("answered-wrong");
                    }
                }

                btn.onclick = () => {
                    currentQ = idx;
                    loadQuestion();
                };
                grid.appendChild(btn);
            });
        }

        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === questions[idx].ans) score++;
            });
            document.getElementById("score-display").innerText = `Score: ${score} / ${questions.length}`;
        }

        loadQuestion();
    </script>
</body>
</html>
