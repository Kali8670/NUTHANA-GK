<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ರಾಜ್ಯ ನಿರ್ದೇಶಕ ತತ್ವಗಳು - Mock Test</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
        }

        .header {
            background-color: #1a365d;
            color: white;
            padding: 12px 20px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .quiz-container {
                flex-direction: row;
            }
        }

        .question-area {
            flex: 3;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .palette-area {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .q-header {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.05rem;
            color: #2b6cb0;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #edf2f7;
            border: 1px solid #cbd5e0;
            padding: 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            background: #e2e8f0;
        }

        .option-btn.correct {
            background-color: #48bb78 !important;
            color: white;
            border-color: #38a169;
        }

        .option-btn.wrong {
            background-color: #f56565 !important;
            color: white;
            border-color: #e53e3e;
        }

        .explanation-box {
            display: none;
            background-color: #fffaf0;
            border-left: 4px solid #dd6b20;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background-color: #3182ce;
        }

        .nav-btn:hover {
            background-color: #2b6cb0;
        }

        .retest-btn {
            background-color: #e53e3e;
        }

        .retest-btn:hover {
            background-color: #c53030;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .palette-num {
            padding: 10px 0;
            border: 1px solid #cbd5e0;
            background: #edf2f7;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .palette-num.active {
            border: 2px solid #3182ce;
        }

        .palette-num.answered-correct {
            background-color: #48bb78;
            color: white;
            border-color: #38a169;
        }

        .palette-num.answered-wrong {
            background-color: #f56565;
            color: white;
            border-color: #e53e3e;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>ರಾಜ್ಯ ನಿರ್ದೇಶಕ ತತ್ವಗಳು (DPSP) - Mock Test</h2>
</div>

<div class="quiz-container">
    <div class="question-area">
        <div class="q-header" id="question-title">Question Loading...</div>
        <div class="options-list" id="options-container"></div>
        
        <div class="explanation-box" id="explanation-box">
            <strong>ವಿವರಣೆ (Explanation):</strong>
            <p id="explanation-text"></p>
        </div>

        <div class="action-btns">
            <button class="nav-btn" onclick="prevQuestion()">Previous</button>
            <button class="nav-btn retest-btn" onclick="resetQuiz()">Retest (ಮರುಪರೀಕ್ಷೆ)</button>
            <button class="nav-btn" onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <div class="palette-area">
        <h3>Question Palette</h3>
        <p style="font-size: 0.8rem; color: #666; margin-top: 4px;">Score: <span id="score-display">0</span> / 13</p>
        <div class="palette-grid" id="palette-grid"></div>
    </div>
</div>

<script>
const quizData = [
    {
        q: "1. ರಾಜ್ಯ ನಿರ್ದೇಶಕ ತತ್ವಗಳನ್ನು (DPSP) ಯಾವ ದೇಶದ ಸಂವಿಧಾನದಿಂದ ಎರವಲಾಗಿ ಪಡೆಯಲಾಗಿದೆ?",
        options: ["A) ಅಮೆರಿಕ ಸಂವಿಧಾನ", "B) ಐರಿಷ್ ಸಂವಿಧಾನ", "C) ಬ್ರಿಟನ್ ಸಂವಿಧಾನ", "D) ಕೆನಡಾ ಸಂವಿಧಾನ"],
        correct: 1,
        exp: "ಇವುಗಳನ್ನು ಐರಿಷ್ ಸಂವಿಧಾನದಿಂದ (Ireland) ಎರವಲಾಗಿ ಪಡೆಯಲಾಗಿದೆ."
    },
    {
        q: "2. ಈ ತತ್ವಗಳನ್ನು ಸಂವಿಧಾನದ 4ನೇ ಭಾಗದಲ್ಲಿ ಯಾವ ವಿಧಿಗಳವರೆಗೆ ವಿವರಿಸಲಾಗಿದೆ?",
        options: ["A) ವಿಧಿ 12 ರಿಂದ 35", "B) ವಿಧಿ 36 ರಿಂದ 51", "C) ವಿಧಿ 51A ರಿಂದ 60", "D) ವಿಧಿ 14 ರಿಂದ 32"],
        correct: 1,
        exp: "ಈ ತತ್ವಗಳನ್ನು ಸಂವಿಧಾನದ 4ನೇ ಭಾಗದಲ್ಲಿ 36 ರಿಂದ 51ನೇ ವಿಧಿಯವರೆಗೂ ವಿವರಿಸಿದೆ."
    },
    {
        q: "3. ರಾಜ್ಯ ನಿರ್ದೇಶಕ ತತ್ವಗಳಿಗೆ ಸಂಬಂಧಿಸಿದಂತೆ ಯಾವ ವಿಧಿಯ ಪ್ರಕಾರ ನ್ಯಾಯಾಲಯದ ಮೊರೆ ಹೋಗುವಂತಿಲ್ಲ (Non-justiciable)?",
        options: ["A) ವಿಧಿ 36", "B) ವಿಧಿ 37", "C) ವಿಧಿ 38", "D) ವಿಧಿ 39"],
        correct: 1,
        exp: "ವಿಧ-37 ರ ಪ್ರಕಾರ ಈ ತತ್ವಗಳನ್ನು ಜಾರಿಗೊಳಿಸಲು ಕೋರ್ಟ್ ಮೊರೆ ಹೋಗುವಂತಿಲ್ಲ."
    },
    {
        q: "4. ಗ್ರಾಮ ಪಂಚಾಯತಿಯ ರಚನೆಯ ಕುರಿತು ಮಾಹಿತಿ ನೀಡುವ ಸಂವಿಧಾನದ ವಿಧಿ ಯಾವುದು?",
        options: ["A) ವಿಧಿ 40", "B) ವಿಧಿ 41", "C) ವಿಧಿ 42", "D) ವಿಧಿ 43"],
        correct: 0,
        exp: "ವಿಧ-40 ಗ್ರಾಮ ಪಂಚಾಯತಿಯ ರಚನೆಯ ಕುರಿತು ಮಾಹಿತಿ ನೀಡುತ್ತದೆ."
    },
    {
        q: "5. ಗ್ರಾಮ ಪಂಚಾಯತಿಯ ರಚನೆಗೆ ಸಂಬಂಧಿಸಿದ ಸಂವಿಧಾನದ ತಿದ್ದುಪಡಿ ಯಾವುದು?",
        options: ["A) 42ನೇ ತಿದ್ದುಪಡಿ", "B) 44ನೇ ತಿದ್ದುಪಡಿ", "C) 73ನೇ ತಿದ್ದುಪಡಿ", "D) 74ನೇ ತಿದ್ದುಪಡಿ"],
        correct: 2,
        exp: "ಗ್ರಾಮ ಪಂಚಾಯತಿಯ ರಚನೆಗೆ ಸಂಬಂಧಿಸಿದ ತಿದ್ದುಪಡಿ-73."
    },
    {
        q: "6. ಮುನ್ಸಿಪಾಲಿಟಿ ಅಥವಾ ನಗರ ಆಡಳಿತಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಂವಿಧಾನದ ತಿದ್ದುಪಡಿ ಯಾವುದು?",
        options: ["A) 71ನೇ ತಿದ್ದುಪಡಿ", "B) 72ನೇ ತಿದ್ದುಪಡಿ", "C) 73ನೇ ತಿದ್ದುಪಡಿ", "D) 74ನೇ ತಿದ್ದುಪಡಿ"],
        correct: 3,
        exp: "ಮುನ್ಸಿಪಾಲಿಟಿ ಅಥವಾ ನಗರಆಡಳಿತಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ತಿದ್ದುಪಡಿ-74."
    },
    {
        q: "7. ಪಂಚಾಯತ್ ರಾಜ್ ವ್ಯವಸ್ಥೆಯನ್ನು ಜಾರಿಗೊಳಿಸಿದ ಮೊದಲ ರಾಜ್ಯ ರಾಜಸ್ಥಾನದ ನಾಗೂರಿನಲ್ಲಿ ಯಾರು ಉದ್ಘಾಟಿಸಿದರು?",
        options: ["A) ಮಹಾತ್ಮ ಗಾಂಧಿ", "B) ಜವಾಹರಲಾಲ ನೆಹರು", "C) ಡಾ. ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್", "D) ಸರ್ದಾರ್ ಪಟೇಲ್"],
        correct: 1,
        exp: "ಪಂಚಾಯತ ರಾಜ್ಯ ವ್ಯವಸ್ಥೆಯನ್ನು ಜಾರಿಗೊಳಿಸಿದ ಮೊದಲ ರಾಜ್ಯ ರಾಜಸ್ಥಾನ. ಅದನ್ನು 1959 ಅಕ್ಟೋಬರ್-2 ರಂದು ರಾಜಸ್ಥಾನದ ನಾಗೂರಿನಲ್ಲಿ ಜವಾಹರಲಾಲ ನೆಹರು ಅವರು ಉದ್ಘಾಟಿಸಿದರು."
    },
    {
        q: "8. ಕರ್ನಾಟಕದಲ್ಲಿ ಪಂಚಾಯತ್ ರಾಜ್ ಕಾಯ್ದೆಯನ್ನು ಯಾವ ವರ್ಷದಲ್ಲಿ ಅಳವಡಿಸಿಕೊಳ್ಳಲಾಯಿತು?",
        options: ["A) 1959", "B) 1977", "C) 1983", "D) 1993"],
        correct: 2,
        exp: "ಕರ್ನಾಟಕದಲ್ಲಿ ಪಂಚಾಯತ ರಾಜ್ಯ ಅಳವಡಿಸಿಕೊಂಡಿದ್ದು 1983ರಲ್ಲಿ."
    },
    {
        q: "9. ಸಹಕಾರ ಸಂಘಗಳ ಸ್ಥಾಪನೆಗೆ ಸಂಬಂಧಿಸಿದ ವಿಧಿ ಯಾವುದು?",
        options: ["A) ವಿಧಿ 43ಎ", "B) ವಿಧಿ 43ಬಿ", "C) ವಿಧಿ 44", "D) ವಿಧಿ 45"],
        correct: 1,
        exp: "ವಿಧ-43ಬಿ ಸಹಕಾರ ಸಂಘಗಳ ಸ್ಥಾಪನೆಗೆ ಅವಕಾಶ ನೀಡುತ್ತದೆ (97ನೇ ತಿದ್ದುಪಡಿ 2011)."
    },
    {
        q: "10. ಏಕರೂಪ ನಾಗರಿಕ ಸಂಹಿತೆ (Uniform Civil Code) ಗೆ ಸಂಬಂಧಿಸಿದ ವಿಧಿ ಯಾವುದು?",
        options: ["A) ವಿಧಿ 40", "B) ವಿಧಿ 44", "C) ವಿಧಿ 48", "D) ವಿಧಿ 50"],
        correct: 1,
        exp: "ವಿಧ-44 ಏಕರೂಪ ನಾಗರಿಕ ಸಂಹಿತೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ."
    },
    {
        q: "11. ಸಾರಾಯಿ ನಿಷೇಧ ಹಾಗೂ ಸಾರ್ವಜನಿಕ ಆರೋಗ್ಯ ಸುಧಾರಣೆಗೆ ಸಂಬಂಧಿಸಿದ ವಿಧಿ ಯಾವುದು?",
        options: ["A) ವಿಧಿ 47", "B) ವಿಧಿ 48", "C) ವಿಧಿ 49", "D) ವಿಧಿ 51"],
        correct: 0,
        exp: "ವಿಧ-47 ಸಾರಾಯಿ ನಿಷೇಧ ಮತ್ತು ಪೌಷ್ಟಿಕತೆಯ ಮಟ್ಟವನ್ನು ಹೆಚ್ಚಿಸುವುದಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ."
    },
    {
        q: "12. ಪರಿಸರ ಸಂರಕ್ಷಣೆ ಮತ್ತು ಅರಣ್ಯ ಹಾಗೂ ವನ್ಯಜೀವಿಗಳ ರಕ್ಷಣೆಗೆ ಸಂಬಂಧಿಸಿದ ವಿಧಿ ಯಾವುದು?",
        options: ["A) ವಿಧಿ 46", "B) ವಿಧಿ 48ಎ", "C) ವಿಧಿ 50", "D) ವಿಧಿ 51"],
        correct: 1,
        exp: "ವಿಧ-48ಎ ಪರಿಸರ ಸಂರಕ್ಷಣೆ ಮತ್ತು ಸುಧಾರಣೆಗೆ ಸಂಬಂಧಿಸಿದೆ."
    },
    {
        q: "13. ಯಾವ ಸಂವಿಧಾನಾತ್ಮಕ ತಿದ್ದುಪಡಿಯ ಮೂಲಕ 'ವಿಧಿ 48ಎ' (ಪರಿಸರ ಸಂರಕ್ಷಣೆ) ಯನ್ನು ಸೇರಿಸಲಾಯಿತು?",
        options: ["A) 1976ರ 42ನೇ ತಿದ್ದುಪಡಿ", "B) 1978ರ 44ನೇ ತಿದ್ದುಪಡಿ", "C) 2002ರ 86ನೇ ತಿದ್ದುಪಡಿ", "D) 1992ರ 73ನೇ ತಿದ್ದುಪಡಿ"],
        correct: 0,
        exp: "1976ರಲ್ಲಿ 42ನೆಯ ತಿದ್ದುಪಡಿ ಮಾಡುವ ಮೂಲಕ 48ಎ ಹೊಸದಾದ ವಿಧಿ ಮಾಡಿಕೊಂಡು ಪರಿಸರ ಸಂರಕ್ಷಣೆಯ ಬಗ್ಗೆ ಸೇರಿಸಲಾಯಿತು."
    }
];

let currentIndex = 0;
let userAnswers = Array(quizData.length).fill(null);
let score = 0;

function initQuiz() {
    renderPalette();
    loadQuestion(currentIndex);
}

function renderPalette() {
    const grid = document.getElementById('palette-grid');
    grid.innerHTML = '';
    quizData.forEach((_, index) => {
        const btn = document.createElement('div');
        btn.className = `palette-num ${index === currentIndex ? 'active' : ''}`;
        
        if (userAnswers[index] !== null) {
            if (userAnswers[index] === quizData[index].correct) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-wrong');
            }
        }
        
        btn.innerText = index + 1;
        btn.onclick = () => jumpToQuestion(index);
        grid.appendChild(btn);
    });
    
    // Update score
    score = userAnswers.reduce((acc, curr, idx) => curr === quizData[idx].correct ? acc + 1 : acc, 0);
    document.getElementById('score-display').innerText = score;
}

function loadQuestion(index) {
    currentIndex = index;
    const currentQ = quizData[index];
    document.getElementById('question-title').innerText = currentQ.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const expBox = document.getElementById('explanation-box');
    const expText = document.getElementById('explanation-text');

    currentQ.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (userAnswers[index] !== null) {
            btn.disabled = true;
            if (optIdx === currentQ.correct) {
                btn.classList.add('correct');
            }
            if (userAnswers[index] === optIdx && userAnswers[index] !== currentQ.correct) {
                btn.classList.add('wrong');
            }
        } else {
            btn.onclick = () => selectOption(optIdx);
        }

        optionsContainer.appendChild(btn);
    });

    if (userAnswers[index] !== null) {
        expBox.style.display = 'block';
        expText.innerText = currentQ.exp;
    } else {
        expBox.style.display = 'none';
    }

    renderPalette();
}

function selectOption(optIndex) {
    userAnswers[currentIndex] = optIndex;
    loadQuestion(currentIndex);
}

function nextQuestion() {
    if (currentIndex < quizData.length - 1) {
        loadQuestion(currentIndex + 1);
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        loadQuestion(currentIndex - 1);
    }
}

function jumpToQuestion(index) {
    loadQuestion(index);
}

function resetQuiz() {
    if (confirm("ನಿಮ್ಮ ಉತ್ತರಗಳನ್ನು ಅಳಿಸಿ ಮರುಪರೀಕ್ಷೆ ಪ್ರಾರಂಭಿಸಲು ಬಯಸುವಿರಾ? (Do you want to reset and retest?)")) {
        userAnswers = Array(quizData.length).fill(null);
        currentIndex = 0;
        initQuiz();
    }
}

// Start Quiz on load
initQuiz();
</script>

</body>
</html>
