<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Mock Test - Page 461</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: #1a237e; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    #timer { color: #ff5252; font-weight: bold; font-size: 1.1rem; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 4px; }
    .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; flex-wrap: wrap; }
    .quiz-card { flex: 3; min-width: 300px; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .question-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: #1a237e; }
    .options-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .option-btn { width: 100%; text-align: left; padding: 12px 15px; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
    .option-btn:hover:not([disabled]) { background-color: #e9ecef; }
    .option-btn.correct { background-color: #e8f5e9; border-color: #2e7d32; color: #2e7d32; font-weight: bold; box-shadow: 0 0 8px rgba(76, 175, 80, 0.6); }
    .option-btn.wrong { background-color: #ffebee; border-color: #c62828; color: #c62828; font-weight: bold; box-shadow: 0 0 8px rgba(244, 67, 54, 0.6); }
    .explanation-block { background: #eef2f7; border-left: 4px solid #1a237e; padding: 15px; border-radius: 0 6px 6px 0; margin-bottom: 20px; display: none; }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: auto; pt: 15px; border-top: 1px solid #eee; }
    .nav-btn { padding: 10px 20px; background: #1a237e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    .palette-panel { flex: 1; min-width: 250px; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; }
    .score-board { font-size: 1rem; font-weight: bold; text-align: center; padding: 10px; background: #f0f4f8; border-radius: 6px; color: #1a237e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; }
    .palette-btn { aspect-ratio: 1; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .palette-btn.active { border: 2px solid #1a237e; background: #e8eaf6; }
    .palette-btn.correct { background: #4caf50; color: white; border-color: #388e3c; box-shadow: 0 0 6px rgba(76, 175, 80, 0.7); }
    .palette-btn.wrong { background: #f44336; color: white; border-color: #d32f2f; box-shadow: 0 0 6px rgba(244, 67, 54, 0.7); }
    .action-btn-container { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
    .action-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .retest-all { background-color: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.7); }
    .test-wrong { background-color: #f44336; box-shadow: 0 0 10px rgba(244, 67, 54, 0.7); }
  </style>
</head>
<body>
  <header>
    <h1 id="test-title">ಕರ್ನಾಟಕದ ಮುಖ್ಯಮಂತ್ರಿಗಳು & ಅಡ್ವೊಕೇಟ್ ಜನರಲ್ - Standard Test</h1>
    <div id="timer">10:00</div>
  </header>
  <div class="main-container">
    <div class="quiz-card">
      <div class="question-title" id="question-text"></div>
      <div class="options-container" id="options-container"></div>
      <div class="explanation-block" id="explanation-block"></div>
      <div class="nav-buttons">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">Previous</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next</button>
      </div>
    </div>
    <div class="palette-panel">
      <div class="score-board" id="score-board">Score: 0 / 5</div>
      <div class="grid" id="palette-grid"></div>
      <div class="action-btn-container">
        <button class="action-btn retest-all" onclick="retestAll()">ಮರುಪರೀಕ್ಷೆ (Retest All)</button>
        <button class="action-btn test-wrong" onclick="testWrongAnswers()">Test Wrong Answers</button>
      </div>
    </div>
  </div>
  <script>
    const allQuestions = [
      { id: 19, question: "19. ಕರ್ನಾಟಕದ ಮೊದಲ ಮುಖ್ಯಮಂತ್ರಿ ಯಾರು?", options: ["ಕೆ.ಸಿ. ರೆಡ್ಡಿ", "ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ", "ದೇವರಾಜ ಅರಸ್", "ಎಸ್. ನಿಜಲಿಂಗಪ್ಪ"], correct: 0, exp: "ಕರ್ನಾಟಕದ (ಮೈಸೂರು ರಾಜ್ಯದ) ಪ್ರಥಮ ಮುಖ್ಯಮಂತ್ರಿ ಕೆ.ಸಿ. ರೆಡ್ಡಿ." },
      { id: 20, question: "20. ಕರ್ನಾಟಕದ ಮೊದಲ ಚುನಾಯಿತ ಮುಖ್ಯಮಂತ್ರಿ ಯಾರು?", options: ["ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ", "ಕೆ.ಸಿ. ರೆಡ್ಡಿ", "ದೇವರಾಜ ಅರಸ್", "ಬಿ.ಡಿ. ಜತ್ತಿ"], correct: 0, exp: "ಕರ್ನಾಟಕದ ಮೊದಲ ಚುನಾಯಿತ ಮುಖ್ಯಮಂತ್ರಿ ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ." },
      { id: 21, question: "21. ಕರ್ನಾಟಕದ ದೀರ್ಘಾವಧಿಯ ಮುಖ್ಯಮಂತ್ರಿ ಯಾರು?", options: ["ದೇವರಾಜ ಅರಸ್", "ಕೆ.ಸಿ. ರೆಡ್ಡಿ", "ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ", "ಎಸ್.ಆರ್. ಬೊಮ್ಮಾಯಿ"], correct: 0, exp: "ದೇವರಾಜ ಅರಸ್ ಅವರು ಕರ್ನಾಟಕದ ದೀರ್ಘಾವಧಿಯ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ." },
      { id: 22, question: "22. ಜೀತ ಪದ್ಧತಿ ನಿರ್ಮೂಲನಾ ಕಾಯ್ದೆ ಜಾರಿಗೆ ಬಂದ ವರ್ಷ ಯಾವುದು?", options: ["1976", "1948", "1956", "1961"], correct: 0, exp: "ಜೀತ ಪದ್ಧತಿ ನಿರ್ಮೂಲನಾ ಕಾಯ್ದೆಯನ್ನು 1976 ರಲ್ಲಿ ಜಾರಿಗೆ ತರಲಾಯಿತು." },
      { id: 23, question: "23. ಬಾಲಕಾರ್ಮಿಕ ನಿಷೇಧ ಕಾಯ್ದೆ ಜಾರಿಗೆ ಬಂದ ವರ್ಷ ಯಾವುದು?", options: ["1986", "1970", "1961", "1956"], correct: 0, exp: "ಬಾಲಕಾರ್ಮಿಕ (ನಿಷೇಧ ಮತ್ತು ನಿಯಂತ್ರಣ) ಕಾಯ್ದೆ 1986 ರಲ್ಲಿ ಜಾರಿಗೆ ಬಂದಿತು." }
    ];

    let currentQuestions = [...allQuestions];
    let currentIndex = 0;
    let userAnswers = {};
    let wrongTestCount = 1;
    let timerInterval;

    function startTimer(duration) {
      clearInterval(timerInterval);
      let timer = duration, minutes, seconds;
      timerInterval = setInterval(() => {
        minutes = parseInt(timer / 60, 10);
        seconds = parseInt(timer % 60, 10);
        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;
        document.getElementById('timer').textContent = minutes + ":" + seconds;
        if (--timer < 0) clearInterval(timerInterval);
      }, 1000);
    }

    function renderQuiz() {
      const q = currentQuestions[currentIndex];
      document.getElementById('question-text').textContent = q.question;
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      
      const answered = userAnswers.hasOwnProperty(q.id);
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        if (answered) {
          btn.disabled = true;
          if (idx === q.correct) btn.classList.add('correct');
          if (userAnswers[q.id] === idx && idx !== q.correct) btn.classList.add('wrong');
        } else {
          btn.onclick = () => selectOption(q.id, idx);
        }
        optsContainer.appendChild(btn);
      });

      const expBlock = document.getElementById('explanation-block');
      if (answered) {
        expBlock.style.display = 'block';
        expBlock.innerHTML = `<strong>ವಿವರಣೆ:</strong> ${q.exp}`;
      } else {
        expBlock.style.display = 'none';
      }

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === currentQuestions.length - 1;

      renderPalette();
      updateScore();
    }

    function selectOption(qId, selectedIdx) {
      userAnswers[qId] = selectedIdx;
      renderQuiz();
    }

    function renderPalette() {
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = q.id;
        if (idx === currentIndex) btn.classList.add('active');
        if (userAnswers.hasOwnProperty(q.id)) {
          if (userAnswers[q.id] === q.correct) btn.classList.add('correct');
          else btn.classList.add('wrong');
        }
        btn.onclick = () => { currentIndex = idx; renderQuiz(); };
        grid.appendChild(btn);
      });
    }

    function updateScore() {
      let correct = 0;
      Object.keys(userAnswers).forEach(qId => {
        const q = allQuestions.find(item => item.id == qId);
        if (q && userAnswers[qId] === q.correct) correct++;
      });
      document.getElementById('score-board').textContent = `Score: ${correct} / ${currentQuestions.length}`;
    }

    function navigate(dir) {
      if (currentIndex + dir >= 0 && currentIndex + dir < currentQuestions.length) {
        currentIndex += dir;
        renderQuiz();
      }
    }

    function retestAll() {
      userAnswers = {};
      currentQuestions = [...allQuestions];
      currentIndex = 0;
      wrongTestCount = 1;
      document.getElementById('test-title').textContent = "ಕರ್ನಾಟಕದ ಮುಖ್ಯಮಂತ್ರಿಗಳು & ಅಡ್ವೊಕೇಟ್ ಜನರಲ್ - Standard Test";
      startTimer(600);
      renderQuiz();
    }

    function testWrongAnswers() {
      const wrongList = currentQuestions.filter(q => userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.correct);
      if (wrongList.length === 0) {
        alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳಿಲ್ಲ! (No wrong answers found!)");
        return;
      }
      wrongList.forEach(q => delete userAnswers[q.id]);
      currentQuestions = wrongList;
      currentIndex = 0;
      document.getElementById('test-title').textContent = `Wrong Test-${wrongTestCount++}`;
      renderQuiz();
    }

    window.onload = () => {
      startTimer(600);
      renderQuiz();
    };
  </script>
</body>
</html>
