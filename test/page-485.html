                    "ಅನುಸೂಚಿ-8"
                ],
                correct: 1,
                explanation: "73ನೇ ತಿದ್ದುಪಡಿ ಮೂಲಕ ಸೇರಿಸಲಾದ ಅನುಸೂಚಿ-11 ಗ್ರಾಮೀಣ ಸ್ಥಳೀಯ ಸರ್ಕಾರಗಳಿಗೆ (ಪಂಚಾಯತ್‌ಗಳು) 29 ವಿಷಯಗಳನ್ನು ನೀಡುತ್ತದೆ."
            },
            {
                id: 39,
                question: "ಮುನಿಸಿಪಾಲಿಟಿಗಳ (ನಗರ ಸ್ಥಳೀಯ ಸಂಸ್ಥೆಗಳು) ಅಧಿಕಾರಗಳು ಮತ್ತು ಜವಾಬ್ದಾರಿಗಳನ್ನು ತಿಳಿಸುವ ಅನುಸೂಚಿ ಯಾವುದು?",
                options: [
                    "ಅನುಸೂಚಿ-10",
                    "ಅನುಸೂಚಿ-11",
                    "ಅನುಸೂಚಿ-12",
                    "ಅನುಸೂಚಿ-9"
                ],
                correct: 2,
                explanation: "74ನೇ ತಿದ್ದುಪಡಿ ಮೂಲಕ ಸೇರಿಸಲಾದ ಅನುಸೂಚಿ-12 ನಗರ ಸ್ಥಳೀಯ ಸಂಸ್ಥೆಗಳಿಗೆ (ಮುನಿಸಿಪಾಲಿಟಿಗಳು) 18 ವಿಷಯಗಳನ್ನು ನೀಡುತ್ತದೆ."
            },
            {
                id: 40,
                question: "ಪ್ರಸ್ತುತ ಸಂವಿಧಾನದ 'ಕೇಂದ್ರ ಪಟ್ಟಿಯಲ್ಲಿ' (Union List) ಸೇರಿರುವ ವಿಷಯಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?",
                options: [
                    "61",

                ],
                correct: 2,
                explanation: "ಕೇಂದ್ರ ಪಟ್ಟಿಯಲ್ಲಿ ರಕ್ಷಣೆ, ಅಣುಶಕ್ತಿ, ರೈಲ್ವೆ, ಬ್ಯಾಂಕಿಂಗ್ ಮುಂತಾದ 100 ವಿಷಯಗಳಿವೆ."
            },
            {
                id: 41,
                question: "ಪ್ರಸ್ತುತ ಸಂವಿಧಾನದ 'ರಾಜ್ಯ ಪಟ್ಟಿಯಲ್ಲಿ' (State List) ಸೇರಿರುವ ವಿಷಯಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?",
                options: [
                    "100",

                    "52",
                    "66"
                ],
                correct: 1,
                explanation: "ರಾಜ್ಯ ಪಟ್ಟಿಯಲ್ಲಿ ಪೊಲೀಸ್, ಸಾರ್ವಜನಿಕ ಆರೋಗ್ಯ, ಕೃಷಿ, ಜೈಲು ಮುಂತಾದ 61 ವಿಷಯಗಳಿವೆ."
            },
            {
                id: 42,
                question: "ಪ್ರಸ್ತುತ ಸಂವಿಧಾನದ 'ಸಮವರ್ತಿ ಪಟ್ಟಿಯಲ್ಲಿ' (Concurrent List) ಸೇರಿರುವ ವಿಷಯಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?",
                options: [
                    "52",
                    "61",
                    "100",
                    "47"
                ],
                correct: 0,
                explanation: "ಸಮವರ್ತಿ ಪಟ್ಟಿಯಲ್ಲಿ ಅಪರಾಧ ಕಾನೂನು, ಶಿಕ್ಷಣ, ಅರಣ್ಯ, ಮದುವೆ ಮತ್ತು ವಿಚ್ಛೇದನ ಮುಂತಾದ 52 ವಿಷಯಗಳಿವೆ."
            }
        ];

        // State Variables
        let activeQuestions = [...fullQuestionBank];
        let userAnswers = {}; // Map of qId -> selectedOptionIndex
        let currentIndex = 0;
        let wrongTestCount = 1;
        let timeRemaining = 30 * 60; // 30 minutes in seconds

        // DOM Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const paletteGrid = document.getElementById('palette-grid');
        const scoreDisplay = document.getElementById('score-display');
        const testTitle = document.getElementById('test-title');
        const timerDisplay = document.getElementById('timer');

        // Timer Functions
        function startTimer() {
            setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                    const secs = (timeRemaining % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${mins}:${secs}`;
                }
            }, 1000);
        }

        // Render Current Question
        function renderQuestion() {
            const q = activeQuestions[currentIndex];
            questionText.textContent = `Q${q.id}. ${q.question}`;
            optionsContainer.innerHTML = '';
            
            const hasAnswered = userAnswers.hasOwnProperty(q.id);
            const selectedOpt = userAnswers[q.id];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65 + idx)}) ${opt}`;

                if (hasAnswered) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (selectedOpt === idx && idx !== q.correct) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectOption(q.id, idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Visibility
            if (hasAnswered) {
                explanationText.textContent = q.explanation;
                explanationBox.style.display = 'block';
            } else {
                explanationBox.style.display = 'none';
            }

            // Navigation Buttons
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === activeQuestions.length - 1;

            updatePalette();
            updateScore();
        }

        // Option Selection Handler
        function selectOption(questionId, selectedIdx) {
            userAnswers[questionId] = selectedIdx;
            renderQuestion();
        }

        // Navigation
        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < activeQuestions.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        // Update Question Palette Grid
        function updatePalette() {
            paletteGrid.innerHTML = '';
            activeQuestions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = q.id; // Preserve original global question number

                if (index === currentIndex) {
                    btn.classList.add('active');
                }

                if (userAnswers.hasOwnProperty(q.id)) {
                    if (userAnswers[q.id] === q.correct) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('wrong');
                    }
                }

                btn.onclick = () => {
                    currentIndex = index;
                    renderQuestion();
                };

                paletteGrid.appendChild(btn);
            });
        }

        // Score Calculation
        function updateScore() {
            let correctCount = 0;
            Object.keys(userAnswers).forEach(qId => {
                const q = fullQuestionBank.find(item => item.id == qId);
                if (q && userAnswers[qId] === q.correct) {
                    correctCount++;
                }
            });
            scoreDisplay.textContent = `${correctCount} / ${activeQuestions.length}`;
        }

        // Retest All Questions Function
        function retestAll() {
            activeQuestions = [...fullQuestionBank];
            userAnswers = {};
            currentIndex = 0;
            wrongTestCount = 1;
            testTitle.textContent = "CBT Mock Test: Indian Constitution (Q28-42)";
            renderQuestion();
        }

        // Retest Wrong Answers Only Function
        function testWrongAnswers() {
            const wrongQuestions = activeQuestions.filter(q => {
                return userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.correct;
            });

            if (wrongQuestions.length === 0) {
                alert("ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳಿಲ್ಲ! (No incorrect answers found to retest!)");
                return;
            }

            // Remove previous answers for wrong questions only
            wrongQuestions.forEach(q => {
                delete userAnswers[q.id];
            });

            activeQuestions = wrongQuestions;
            currentIndex = 0;
            testTitle.textContent = `CBT Mock Test: Wrong Test-${wrongTestCount}`;
            wrongTestCount++;

            renderQuestion();
        }

        // Initial Load
        startTimer();
        renderQuestion();
    </script>
