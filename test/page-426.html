<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಸಂವಿಧಾನ - ಮೂಲಭೂತ ಹಕ್ಕುಗಳು ರಸಪ್ರಶ್ನೆ</title>
    <style>
        :root {
            --primary-blue: #0d47a1;
            --accent-blue: #1976d2;
            --correct-green: #2e7d32;
            --wrong-red: #c62828;
            --bg-light: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .main-quiz {
            flex: 1;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .sidebar {
            width: 280px;
            padding: 15px;
            background-color: #fafafa;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e3f2fd;
        }

        .option-btn.correct {
            background-color: #c8e6c9 !important;
            border-color: var(--correct-green) !important;
            color: var(--correct-green);
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #ffcdd2 !important;
            border-color: var(--wrong-red) !important;
            color: var(--wrong-red);
            font-weight: bold;
        }

        .explanation-box {
            display: none;
            padding: 12px;
            background-color: #fffde7;
            border-left: 4px solid #fbc02d;
            font-size: 13px;
            margin-bottom: 20px;
            color: #444;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-blue { background-color: var(--accent-blue); }
        .btn-red { background-color: var(--wrong-red); }

        .palette-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }

        .score-info {
            font-size: 12px;
            text-align: center;
            color: #666;
            margin-bottom: 15px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .palette-btn {
            padding: 6px 0;
            background-color: #fff;
            border: 1px solid #ccc;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            text-align: center;
        }

        .palette-btn.current { border: 2px solid var(--accent-blue); }
        .palette-btn.correct-bg { background-color: var(--correct-green); color: white; border-color: var(--correct-green); }
        .palette-btn.wrong-bg { background-color: var(--wrong-red); color: white; border-color: var(--wrong-red); }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: auto; border-top: 1px solid #ddd; }
            .palette-grid { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
</head>

    <script>

            { q: "1946 ರಲ್ಲಿ ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಸಲಹಾ ಸಮಿತಿ ರಚಿಸಲು ಶಿಫಾರಸ್ಸು ಮಾಡಿದ ಆಯೋಗ ಯಾವುದು?", options: ["ಎ) ಕ್ರಿಪ್ಸ್ ಆಯೋಗ", "ಬಿ) ಕ್ಯಾಬಿನೆಟ್ ಆಯೋಗ", "ಸಿ) ಸೈಮನ್ ಆಯೋಗ", "ಡಿ) ಹಂಟರ್ ಆಯೋಗ"], answer: 1, exp: "1946 ರಲ್ಲಿ ಕ್ಯಾಬಿನೆಟ್ ಆಯೋಗವು ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಸಲಹಾ ಸಮಿತಿ ರಚಿಸಲು ಶಿಫಾರಸ್ಸು ಮಾಡಿತು." },
            { q: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಸಲಹಾ ಸಮಿತಿಯ ಅಧ್ಯಕ್ಷರು ಯಾರಾಗಿದ್ದರು?", options: ["ಎ) ಡಾ|| ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್", "ಬಿ) ಜವಾಹರ್‌ಲಾಲ್ ನೆಹರೂ", "ಸಿ) ಸರ್ದಾರ್ ವಲ್ಲಭಬಾಯಿ ಪಟೇಲ್", "ಡಿ) ಡಾ|| ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್"], answer: 2, exp: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಸಲಹಾ ಸಮಿತಿಯ ಅಧ್ಯಕ್ಷರು ಸರ್ದಾರ್ ವಲ್ಲಭಬಾಯಿ ಪಟೇಲರು." },
            { q: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಉಪಸಮಿತಿಯ ಅಧ್ಯಕ್ಷರು ಯಾರಾಗಿದ್ದರು?", options: ["ಎ) ಜಿ.ಬಿ. ಕೃಪಾಲಾನಿ", "ಬಿ) ಕೆ.ಎಮ್. ಮುನ್ಷಿ", "ಸಿ) ಡಾ|| ಬಿ.ಆರ್. ಅಂಬೇಡ್ಕರ್", "ಡಿ) ಮೌಲಾನಾ ಆಜಾದ್"], answer: 0, exp: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಉಪಸಮಿತಿಯ ಅಧ್ಯಕ್ಷರು ಜಿ.ಬಿ. ಕೃಪಾಲಾನಿ." },
            { q: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಅಳವಡಿಕೆ ಕುರಿತು ಮೊದಲ ಸಭೆ ನಡೆದ ದಿನಾಂಕ ಯಾವುದು?", options: ["ಎ) 1947 ಜನವರಿ 26", "ಬಿ) 1947 ಫೆಬ್ರವರಿ 27", "ಸಿ) 1947 ಏಪ್ರಿಲ್ 16", "ಡಿ) 1947 ಆಗಸ್ಟ್ 15"], answer: 1, exp: "1947 ಫೆಬ್ರವರಿ 27 ರಂದು ಮೊದಲ ಸಭೆ ನಡೆಯಿತು." },
            { q: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿಗೆ ಸಂಬಂಧಿಸಿದಂತೆ ಒಟ್ಟು ಎಷ್ಟು ಬಾರಿ ಸಭೆ ಸೇರಲಾಯಿತು?", options: ["ಎ) 5 ಬಾರಿ", "ಬಿ) 8 ಬಾರಿ", "ಸಿ) 10 ಬಾರಿ", "ಡಿ) 12 ಬಾರಿ"], answer: 2, exp: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಹಾಗೆ 10 ಬಾರಿ ಸಭೆ ಸೇರಲಾಯಿತು." },
            { q: "ಸಂವಿಧಾನದ 3ನೇ ಭಾಗಕ್ಕೆ ಮೂಲಭೂತ ಹಕ್ಕುಗಳನ್ನು ಅಳವಡಿಸಿದ ವಿಧಿಗಳ ವ್ಯಾಪ್ತಿ ಎಷ್ಟು?", options: ["ಎ) 12 ರಿಂದ 35 ವಿಧಿ", "ಬಿ) 5 ರಿಂದ 11 ವಿಧಿ", "ಸಿ) 36 ರಿಂದ 51 ವಿಧಿ", "ಡಿ) 52 ರಿಂದ 78 ವಿಧಿ"], answer: 0, exp: "ಸಂವಿಧಾನದ 3ನೇ ಭಾಗದಲ್ಲಿ 12ನೇ ವಿಧಿಯಿಂದ 35 ವಿಧಿಯವರೆಗೂ ವಿವರಿಸುತ್ತದೆ." },
            { q: "ಸಂವಿಧಾನ ಜಾರಿಗೆ ಬಂದಾಗ ಒಟ್ಟು ಎಷ್ಟು ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿದ್ದವು?", options: ["ಎ) 5", "ಬಿ) 6", "ಸಿ) 7", "ಡಿ) 8"], answer: 2, exp: "ಸಂವಿಧಾನ ಜಾರಿಗೆ ಬಂದಾಗ ಒಟ್ಟು 7 ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿದ್ದವು." },
            { q: "ಆಸ್ತಿಯ ಹಕ್ಕನ್ನು ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಪಟ್ಟಿಯಿಂದ ರದ್ದುಪಡಿಸಿದ ತಿದ್ದುಪಡಿ ಯಾವುದು?", options: ["ಎ) 42ನೇ ತಿದ್ದುಪಡಿ", "ಬಿ) 44ನೇ ತಿದ್ದುಪಡಿ", "ಸಿ) 86ನೇ ತಿದ್ದುಪಡಿ", "ಡಿ) 61ನೇ ತಿದ್ದುಪಡಿ"], answer: 1, exp: "1978 ರಲ್ಲಿ 44ನೇ ತಿದ್ದುಪಡಿ ಮಾಡುವ ಮೂಲಕ ಆಸ್ತಿಯ ಹಕ್ಕನ್ನು ರದ್ದುಪಡಿಸಲಾಯಿತು." },
            { q: "ಪ್ರಸ್ತುತ ಆಸ್ತಿಯ ಹಕ್ಕು ಸಂವಿಧಾನದ ಯಾವ ವಿಧಿಯಲ್ಲಿದೆ?", options: ["ಎ) ವಿಧಿ 31", "ಬಿ) ವಿಧಿ 19(1)ಎಫ್", "ಸಿ) ವಿಧಿ 300 ಎ", "ಡಿ) ವಿಧಿ 32"], answer: 2, exp: "ಪ್ರಸ್ತುತ ಆಸ್ತಿಯ ಹಕ್ಕು 300 ಎ ವಿಧಿಯಲ್ಲಿ ಕಾನೂನಾತ್ಮಕ ಹಕ್ಕಾಗಿದೆ." },
            { q: "ಪ್ರಸ್ತುತ ಸಂವಿಧಾನದಲ್ಲಿರುವ ಮೂಲಭೂತ ಹಕ್ಕುಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?", options: ["ಎ) 5", "ಬಿ) 6", "ಸಿ) 7", "ಡಿ) 8"], answer: 1, exp: "ಪ್ರಸ್ತುತ 6 ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿವೆ." },
            { q: "ಸಂವಿಧಾನದ 12ನೇ ವಿಧಿಯು ಯಾವುದನ್ನು ಕುರಿತು ತಿಳಿಸುತ್ತದೆ?", options: ["ಎ) ವ್ಯಾಖ್ಯಾನ (ರಾಜ್ಯ)", "ಬಿ) ತಿದ್ದುಪಡಿ", "ಸಿ) ಸಮಾನತೆ", "ಡಿ) ಶಿಕ್ಷಣ"], answer: 0, exp: "ವಿಧಿ-12 ರಲ್ಲಿ ರಾಜ್ಯ ಎನ್ನುವ ಪದದ ವ್ಯಾಖ್ಯಾನ ತಿಳಿಸಲಾಗುತ್ತದೆ." },
            { q: "ಮೂಲಭೂತ ಹಕ್ಕುಗಳಿಗೆ ಭಂಗ ಬಾರದಂತೆ ತಿದ್ದುಪಡಿ ಮಾಡಲು ಅವಕಾಶ ನೀಡುವ ವಿಧಿ ಯಾವುದು?", options: ["ಎ) ವಿಧಿ 368", "ಬಿ) ವಿಧಿ 360", "ಸಿ) ವಿಧಿ 352", "ಡಿ) ವಿಧಿ 370"], answer: 0, exp: "368ನೇ ವಿಧಿಯ ಪ್ರಕಾರ ಮೂಲ ಅರ್ಥಕ್ಕೆ ಭಂಗಬಾರದ ಹಾಗೆ ತಿದ್ದುಪಡಿ ಮಾಡಬಹುದು." },
            { q: "ಸಮಾನತೆಯ ಹಕ್ಕಿನ ವಿಧಿಗಳ ವ್ಯಾಪ್ತಿ ಯಾವುದು?", options: ["ಎ) ವಿಧಿ 14-18", "ಬಿ) ವಿಧಿ 19-22", "ಸಿ) ವಿಧಿ 23-24", "ಡಿ) ವಿಧಿ 25-28"], answer: 0, exp: "ಸಮಾನತೆಯ ಹಕ್ಕು 14 ರಿಂದ 18ನೇ ವಿಧಿಯವರೆಗೆ ಇದೆ." },
            { q: "ಕಾನೂನಿನ ಮುಂದೆ ಎಲ್ಲರೂ ಸಮಾನರು ಎಂದು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ಎ) ವಿಧಿ 14", "ಬಿ) ವಿಧಿ 15", "ಸಿ) ವಿಧಿ 16", "ಡಿ) ವಿಧಿ 17"], answer: 0, exp: "ವಿಧಿ-14 ಕಾನೂನಿನ ಮುಂದೆ ಎಲ್ಲರೂ ಸಮಾನರು ಎಂದು ತಿಳಿಸುತ್ತದೆ." },
            { q: "361ನೇ ವಿಧಿಯನ್ವಯ ಕ್ರಿಮಿನಲ್ ಮೊಕದ್ದಮೆಯಿಂದ ವಿನಾಯಿತಿ ಪಡೆದವರು ಯಾರು?", options: ["ಎ) ಪ್ರಧಾನಿ ಮತ್ತು ಮಂತ್ರಿಗಳು", "ಬಿ) ರಾಷ್ಟ್ರಪತಿ ಮತ್ತು ರಾಜ್ಯಪಾಲರು", "ಸಿ) ನ್ಯಾಯಾಧೀಶರು", "ಡಿ) ಸಂಸದರು"], answer: 1, exp: "361ನೇ ವಿಧಿಯನ್ವಯ ರಾಷ್ಟ್ರಪತಿಯವರಿಗೆ ಮತ್ತು ರಾಜ್ಯಪಾಲರಿಗೆ ವಿಶೇಷ ವಿನಾಯಿತಿ ಇದೆ." },
            { q: "ರಾಜ್ಯವು ಜಾತಿ, ಲಿಂಗ, ಜನ್ಮಸ್ಥಳದ ಆಧಾರದ ಮೇಲೆ ತಾರತಮ್ಯ ಮಾಡುವಂತಿಲ್ಲ ಎಂದು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ಎ) ವಿಧಿ 14", "ಬಿ) ವಿಧಿ 15", "ಸಿ) ವಿಧಿ 16", "ಡಿ) ವಿಧಿ 17"], answer: 1, exp: "ವಿಧಿ-15 ರಾಜ್ಯ ತಾರತಮ್ಯ ಮಾಡುವಂತಿಲ್ಲ ಎಂದು ತಿಳಿಸುತ್ತದೆ." },
            { q: "ಸಾರ್ವಜನಿಕ ಉದ್ಯೋಗದಲ್ಲಿ ಸಮಾನ ಅವಕಾಶ ನೀಡುವುದು ಯಾವ ವಿಧಿ?", options: ["ಎ) ವಿಧಿ 15", "ಬಿ) ವಿಧಿ 16", "ಸಿ) ವಿಧಿ 17", "ಡಿ) ವಿಧಿ 18"], answer: 1, exp: "ವಿಧಿ-16 ನೌಕರಿಯಲ್ಲಿ ಸಮಾನತೆಯನ್ನು ನೀಡುತ್ತದೆ." },

            { q: "ಅಕ್ರಮ ಬಂಧನದಿಂದ ವ್ಯಕ್ತಿಯನ್ನು ಬಿಡುಗಡೆ ಮಾಡಲು ಹೊರಡಿಸುವ ರಿಟ್ ಯಾವುದು?", options: ["ಎ) ಮ್ಯಾಂಡಮಸ್", "ಬಿ) ಹೆಬಿಯಸ್ ಕಾರ್ಪಸ್", "ಸಿ) ಕೋ-ವಾರಂಟೊ", "ಡಿ) ಸರ್ಷಿಯೊರರಿ"], answer: 1, exp: "ಹೆಬಿಯಸ್ ಕಾರ್ಪಸ್ (ಬಂಧಿ ಪ್ರತ್ಯಕ್ಷೀಕರಣ) ಅಕ್ರಮ ಬಂಧನವನ್ನು ತಡೆಯುತ್ತದೆ." }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function initQuiz() {
            renderPalette();
            loadQuestion(0);
        }

        function renderPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            quizData.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.id = `palette-btn-${idx}`;
                btn.innerText = idx + 1;
                btn.onclick = () => loadQuestion(idx);
                grid.appendChild(btn);
            });
            updateScore();
        }

        function loadQuestion(index) {
            currentIndex = index;
            const data = quizData[index];
            
            document.getElementById('question-number').innerText = `Question ${index + 1} of ${quizData.length}`;
            document.getElementById('question-text').innerText = `${index + 1}. ${data.q}`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            data.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(optIdx);

                if (userAnswers[index] !== null) {
                    btn.disabled = true;
                    if (optIdx === data.answer) {
                        btn.classList.add('correct');
                    }
                    if (userAnswers[index] === optIdx && optIdx !== data.answer) {
                        btn.classList.add('wrong');
                    }
                }
                optionsContainer.appendChild(btn);
            });

            const expBox = document.getElementById('explanation');
            if (userAnswers[index] !== null) {
                expBox.style.display = 'block';
                expBox.innerHTML = `<strong>ಉತ್ತರ (Answer):</strong><br>${data.exp}`;
            } else {
                expBox.style.display = 'none';
            }

            document.querySelectorAll('.palette-btn').forEach((btn, idx) => {
                btn.classList.toggle('current', idx === index);
            });

            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === quizData.length - 1;
        }

        function selectAnswer(optIdx) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = optIdx;
            const isCorrect = optIdx === quizData[currentIndex].answer;

            const paletteBtn = document.getElementById(`palette-btn-${currentIndex}`);
            if (isCorrect) {
                paletteBtn.classList.add('correct-bg');
            } else {
                paletteBtn.classList.add('wrong-bg');
            }

            updateScore();
            loadQuestion(currentIndex);
        }

        function retestQuestion() {
            userAnswers[currentIndex] = null;
            const paletteBtn = document.getElementById(`palette-btn-${currentIndex}`);
            paletteBtn.classList.remove('correct-bg', 'wrong-bg');
            updateScore();
            loadQuestion(currentIndex);
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < quizData.length) {
                loadQuestion(newIndex);
            }
        }

        function updateScore() {
            let correctCount = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === quizData[idx].answer) {
                    correctCount++;
                }
            });
            document.getElementById('score-display').innerText = `Score: ${correctCount} / ${quizData.length}`;
        }

        window.onload = initQuiz;
    </script>
