    { q: "1978 ರಲ್ಲಿ ಜಂಟಿ ಅಧಿವೇಶನ ನಡೆಸಲಾದ ಮಸೂದೆ ಯಾವುದು?", options: ["ಬ್ಯಾಂಕಿಂಗ್ ಸೇವಾ ಆಯೋಗ ಮಸೂದೆ", "ವರದಕ್ಷಿಣೆ ಕಾಯ್ದೆ", "ಪೋಟಾ ಕಾಯ್ದೆ", "ಬಜೆಟ್ ಮಸೂದೆ"], answer: 0, exp: "1978 ರಲ್ಲಿ ಬ್ಯಾಂಕಿಂಗ್ ಸೇವಾ ಆಯೋಗ ಮಸೂದೆಗಾಗಿ ಅಧಿವೇಶನ ಕರೆಯಲಾಗಿತ್ತು." },
    { q: "2002 ರಲ್ಲಿ ಜಂಟಿ ಅಧಿವೇಶನದ ಮೂಲಕ ಅಂಗೀಕಾರಗೊಂಡ ಕಾಯ್ದೆ ಯಾವುದು?", options: ["ವರದಕ್ಷಿಣೆ ನಿಷೇಧ", "ಪೋಟಾ (POTA) ಕಾಯ್ದೆ", "ಬ್ಯಾಂಕಿಂಗ್ ಕಾಯ್ದೆ", "ಶಿಕ್ಷಣ ಕಾಯ್ದೆ"], answer: 1, exp: "2002 ರಲ್ಲಿ POTA ಮಸೂದೆಗೆ ಜಂಟಿ ಅಧಿವೇಶನ ನಡೆಯಿತು." },
    { q: "ರಾಷ್ಟ್ರಪತಿಗಳ ಸುಗ್ರೀವಾಜ್ಞೆ (Ordinance) ಹೊರಡಿಸುವ ಅಧಿಕಾರವನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 72", "ವಿಧಿ 110", "ವಿಧಿ 123", "ವಿಧಿ 213"], answer: 2, exp: "ವಿಧಿ-123 ರ ಅನ್ವಯ ಸುಗ್ರೀವಾಜ್ಞೆ ಹೊರಡಿಸಬಹುದು." },

    { q: "ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ನೇಮಕ ಮಾಡಲು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 75", "ವಿಧಿ 76", "ವಿಧಿ 148", "ವಿಧಿ 155"], answer: 1, exp: "ವಿಧಿ-76 ರ ಅನ್ವಯ ಅಟಾರ್ನಿ ಜನರಲ್ ನೇಮಕ." },
    { q: "ದೇಶದ ಅತ್ಯುನ್ನತ ಕಾನೂನು ಅಧಿಕಾರಿಯನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["ಅಡ್ವೋಕೇಟ್ ಜನರಲ್", "ಸಾಲಿಸಿಟರ್ ಜನರಲ್", "ಅಟಾರ್ನಿ ಜನರಲ್", "ಮುಖ್ಯ ನ್ಯಾಯಾಧೀಶರು"], answer: 2, exp: "ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ದೇಶದ ಉನ್ನತ ಕಾನೂನಾಧಿಕಾರಿ ಎನ್ನಲಾಗುತ್ತದೆ." },
    { q: "ಅಟಾರ್ನಿ ಜನರಲ್ ತಮ್ಮ ರಾಜೀನಾಮೆಯನ್ನು ಯಾರಿಗೆ ಸಲ್ಲಿಸುತ್ತಾರೆ?", options: ["ಪ್ರಧಾನ ಮಂತ್ರಿ", "ರಾಷ್ಟ್ರಪತಿ", "ಸುಪ್ರೀಂ ಕೋರ್ಟ್", "ಕಾನೂನು ಸಚಿವರು"], answer: 1, exp: "ರಾಷ್ಟ್ರಪತಿಗಳಿಗೆ ರಾಜೀನಾಮೆ ಸಲ್ಲಿಸುತ್ತಾರೆ." },
    { q: "ರಾಜ್ಯಗಳ ರಾಜ್ಯಪಾಲರನ್ನು ನೇಮಕ ಮಾಡುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 153", "ವಿಧಿ 155", "ವಿಧಿ 161", "ವಿಧಿ 165"], answer: 1, exp: "ವಿಧಿ-155 ರ ಪ್ರಕಾರ ರಾಜ್ಯಪಾಲರ ನೇಮಕ." },
    { q: "CAG (ಕಂಟ್ರೋಲರ್ ಮತ್ತು ಆಡಿಟರ್ ಜನರಲ್) ನೇಮಕಾತಿಯನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 148", "ವಿಧಿ 280", "ವಿಧಿ 324", "ವಿಧಿ 315"], answer: 0, exp: "ವಿಧಿ-148 ರ ಅನ್ವಯ CAG ನೇಮಕ." },
    { q: "ರಾಷ್ಟ್ರಪತಿಯವರ ಕ್ಷಮಾಧಾನ (Pardon) ಅಧಿಕಾರವನ್ನು ತಿಳಿಸುವ ವಿಧಿ ಯಾವುದು?", options: ["ವಿಧಿ 61", "ವಿಧಿ 72", "ವಿಧಿ 123", "ವಿಧಿ 161"], answer: 1, exp: "ವಿಧಿ-72 ರ ಪ್ರಕಾರ ಕ್ಷಮಾಧಾನ ನೀಡುವ ಅಧಿಕಾರ." },
    { q: "ಸಂವಿಧಾನದ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಉಪಬಂಧಗಳನ್ನು ಯಾವ ದೇಶದಿಂದ ಎರವಲು ಪಡೆಯಲಾಗಿದೆ?", options: ["ಅಮೆರಿಕ", "ಬ್ರಿಟನ್", "ಜರ್ಮನಿ", "ರಷ್ಯಾ"], answer: 2, exp: "ಜರ್ಮನಿ ದೇಶದಿಂದ ಎರವಲಾಗಿ ಪಡೆಯಲಾಗಿದೆ." },
    { q: "1962 ರ ಭಾರತ-ಚೀನಾ ಯುದ್ಧದ ಸಮಯದಲ್ಲಿ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಘೋಷಿಸಿದ ದಿನಾಂಕ ಯಾವುದು?", options: ["1962 ಅಕ್ಟೋಬರ್ 26", "1962 ನವೆಂಬರ್ 15", "1965 ಆಗಸ್ಟ್ 15", "1971 ಡಿಸೆಂಬರ್ 3"], answer: 0, exp: "1962 ಅಕ್ಟೋಬರ್ 26 ರಂದು ಮೊದಲ ಬಾರಿ ಘೋಷಿಸಲಾಯಿತು." },
    { q: "ಮೊದಲ ಬಾರಿಗೆ ರಾಜ್ಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿ जಾರಿಯಾದ ರಾಜ್ಯ ಯಾವುದು?", options: ["ಕರ್ನಾಟಕ", "ಪಂಜಾಬ್", "ಕೇರಳ", "ತಮಿಳುನಾಡು"], answer: 1, exp: "1951 ರಲ್ಲಿ ಪಂಜಾಬ್‌ನಲ್ಲಿ ಮೊದಲ ಬಾರಿ ಜಾರಿಗೊಳಿಸಲಾಯಿತು." },
    { q: "ಕರ್ನಾಟಕದಲ್ಲಿ ಇದುವರೆಗೆ ಎಷ್ಟು ಬಾರಿ ರಾಜ್ಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಘೋಷಿಸಲಾಗಿದೆ?", options: ["4 ಬಾರಿ", "5 ಬಾರಿ", "6 ಬಾರಿ", "8 ಬಾರಿ"], answer: 2, exp: "ಕರ್ನಾಟಕದಲ್ಲಿ 6 ಬಾರಿ ಘೋಷಿಸಲಾಗಿದೆ." },
    { q: "ಒಂದು ಮಸೂದೆಯನ್ನು ತಮ್ಮಲ್ಲಿಯೇ ಇಟ್ಟುಕೊಳ್ಳುವ ರಾಷ್ಟ್ರಪತಿಯವರ ಅಧಿಕಾರ ಯಾವುದು?", options: ["ಪಾಕೆಟ್ ವೀಟೋ", "ಸೂಪರ್ ವೀಟೋ", "ನಿರಂಕುಶ ವೀಟೋ", "ಯಾವುದೂ ಅಲ್ಲ"], answer: 0, exp: "ಮಸೂದೆಯನ್ನು ತಮ್ಮಲ್ಲೇ ಇಟ್ಟುಕೊಳ್ಳುವುದು ಪಾಕೆಟ್ ವೀಟೋ." },
    { q: "ಮಸೂದೆಯನ್ನು ಮರು ಪರಿಶೀಲನೆಗೆ ಕಳುಹಿಸುವ ಅಧಿಕಾರ ಯಾವುದು?", options: ["ಪಾಕೆಟ್ ವೀಟೋ", "ಸೂಪರ್ ವೀಟೋ", "ನಿರಂಕುಶ ವೀಟೋ", "ವಿಶೇಷ ವೀಟೋ"], answer: 1, exp: "ಮರು ಪರಿಶೀಲನೆಗೆ ಕಳುಹಿಸುವುದು ಸೂಪರ್ ವೀಟೋ." },
    { q: "ಮಸೂದೆಗೆ ಕಡ್ಡಾಯವಾಗಿ ಒಪ್ಪಿಗೆ ನೀಡುವ ಅಧಿಕಾರ ಯಾವುದು?", options: ["ಪಾಕೆಟ್ ವೀಟೋ", "ಸೂಪರ್ ವೀಟೋ", "ನಿರಂಕುಶ ವೀಟೋ", "ಅನಂತ ವೀಟೋ"], answer: 2, exp: "ಕಡ್ಡಾಯ ಒಪ್ಪಿಗೆ ನೀಡುವಿಕೆ ನಿರಂಕುಶ ವೀಟೋ." },
    { q: "ಡಾ. ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್ ಅವರ ಜನ್ಮಸ್ಥಳ 'ಜಿರಾದೇಯಿ' ಯಾವ ರಾಜ್ಯದಲ್ಲಿದೆ?", options: ["ಉತ್ತರ ಪ್ರದೇಶ", "ಬಿಹಾರ", "ಮಧ್ಯಪ್ರದೇಶ", "ಒಡಿಶಾ"], answer: 1, exp: "ಜಿರಾದೇಯಿ ಬಿಹಾರದಲ್ಲಿದೆ." },

    { q: "ಭಾರತದ ಮೊದಲ ರಾಷ್ಟ್ರಪತಿ ಯಾರು?", options: ["ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್", "ಡಾ. ಬಾಬು ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ಜಾಕೀರ್ ಹುಸೇನ್", "ವಿ.ವಿ. ಗಿರಿ"], answer: 1, exp: "ಡಾ|| ಬಾಬುರಾಜೇಂದ್ರ ಪ್ರಸಾದ್." },
    { q: "ಡಾ. ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್ ಅವರ ಮೂಲ ರಾಜ್ಯ ಯಾವುದು?", options: ["ಆಂಧ್ರಪ್ರದೇಶ", "ತಮಿಳುನಾಡು (ತಿರುಚಾನಪಳ್ಳಿ)", "ಕರ್ನಾಟಕ", "ಕೇರಳ"], answer: 1, exp: "ತಿರುಚಾನಪಳ್ಳಿ (ತಮಿಳುನಾಡು)." },
    { q: "ಸೆಪ್ಟೆಂಬರ್ 5 ರಂದು ಶಿಕ್ಷಕರ ದಿನಾಚರಣೆಯನ್ನು ಯಾರ ಜನ್ಮದಿನದ ಅಂಗವಾಗಿ ಆಚರಿಸಲಾಗುತ್ತದೆ?", options: ["ಡಾ. ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್", "ಅಬ್ದುಲ್ ಕಲಾಂ", "ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ನೆಹರೂ"], answer: 0, exp: "ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್ ಜನ್ಮದಿನ." },
    { q: "1962 ರ ಚೀನಾ ಯುದ್ಧದ ಸಮಯದಲ್ಲಿ ರಾಷ್ಟ್ರಪತಿಯಾಗಿದ್ದವರು ಯಾರು?", options: ["ರಾಜೇಂದ್ರ ಪ್ರಸಾದ್", "ಡಾ. ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್", "ಜಾಕೀರ್ ಹುಸೇನ್", "ವಿ.ವಿ. ಗಿರಿ"], answer: 1, exp: "ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್ ಅಧಿಕಾರಾವಧಿಯಲ್ಲಿ ತುರ್ತು ಪರಿಸ್ಥಿತಿ ಹೇರಲಾಗಿತ್ತು." },

let currentIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion() {
    const qData = quizData[currentIndex];
    document.getElementById("question-text").innerText = `${currentIndex + 1}. ${qData.q}`;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.style.display = "none";
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${String.fromCharCode(65 + index)}) ${opt}`;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
    });

    if (userAnswers[currentIndex] !== null) {
        showResult(userAnswers[currentIndex]);
    }

    document.getElementById("prev-btn").disabled = currentIndex === 0;
    document.getElementById("next-btn").disabled = currentIndex === quizData.length - 1;
    
    updatePalette();
}

function selectOption(selectedIndex) {
    if (userAnswers[currentIndex] !== null) return;
    
    userAnswers[currentIndex] = selectedIndex;
    showResult(selectedIndex);
    updateScore();
    updatePalette();
}

function showResult(selectedIndex) {
    const qData = quizData[currentIndex];
    const optionBtns = document.querySelectorAll(".option-btn");
    const feedbackBox = document.getElementById("feedback-box");

    optionBtns.forEach((btn, index) => {
        btn.disabled = true;
        if (index === qData.answer) {
            btn.classList.add("selected-correct");
        }
        if (index === selectedIndex && selectedIndex !== qData.answer) {
            btn.classList.add("selected-wrong");
        }
    });

    feedbackBox.style.display = "block";
    if (selectedIndex === qData.answer) {
        feedbackBox.className = "feedback-box correct";
        feedbackBox.innerHTML = `<b>ಸರಿ! (Correct)</b><br>${qData.exp}`;
    } else {
        feedbackBox.className = "feedback-box wrong";
        feedbackBox.innerHTML = `<b>ತಪ್ಪು! (Incorrect)</b><br>ಸರಿಯಾದ ಉತ್ತರ: <b>${qData.options[qData.answer]}</b>.<br>${qData.exp}`;
    }
}

function changeQuestion(direction) {
    currentIndex += direction;
    loadQuestion();
}

function initPalette() {
    const gridContainer = document.getElementById("grid-container");
    gridContainer.innerHTML = "";
    quizData.forEach((_, index) => {
        const item = document.createElement("div");
        item.className = "grid-item";
        item.innerText = index + 1;
        item.onclick = () => {
            currentIndex = index;
            loadQuestion();
        };
        gridContainer.appendChild(item);
    });
}

function updatePalette() {
    const items = document.querySelectorAll(".grid-item");
    items.forEach((item, index) => {
        item.className = "grid-item";
        if (index === currentIndex) {
            item.classList.add("active");
        }
        if (userAnswers[index] !== null) {
            if (userAnswers[index] === quizData[index].answer) {
                item.classList.add("answered-correct");
            } else {
                item.classList.add("answered-wrong");
            }
        }
    });
}

function updateScore() {
    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].answer) score++;
    });
    document.getElementById("score-display").innerText = `ಅಂಕಗಳು: ${score} / ${quizData.length}`;
}

function resetQuiz() {
    userAnswers = new Array(quizData.length).fill(null);
    currentIndex = 0;
    updateScore();
    loadQuestion();
}

initPalette();
loadQuestion();
</script>
