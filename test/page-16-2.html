<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Mock Test - ರಾಜ್ಯದ ಪ್ರಮುಖ ಜಲಪಾತಗಳು</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header { background-color: #1a237e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.2rem; }
    .timer { color: #ff5252; font-weight: bold; font-size: 1.2rem; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 4px; }
    .main-container { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; max-width: 1200px; margin: 0 auto; }
    .quiz-card { flex: 2; min-width: 300px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .question-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }
    .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .option-btn { padding: 12px 15px; border: 1px solid #ccc; background-color: #fff; border-radius: 5px; text-align: left; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .option-btn:hover:not([disabled]) { background-color: #e8eaf6; }
    .option-btn:disabled { cursor: not-allowed; }
    .explanation { background-color: #e8f5e9; border-left: 5px solid #4caf50; padding: 15px; border-radius: 4px; margin-top: 15px; display: none; }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
    .nav-btn { padding: 10px 20px; background-color: #1a237e; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .nav-btn:disabled { background-color: #c5cae9; cursor: not-allowed; }
    .palette-card { flex: 1; min-width: 250px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .score-board { font-size: 1rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
    .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .palette-btn { padding: 10px; border: 1px solid #ccc; background-color: #f5f5f5; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; }
    .palette-btn.active { border: 2px solid #1a237e; background-color: #e8eaf6; }
    .palette-btn.correct { background-color: #c8e6c9; border-color: #4caf50; color: #1b5e20; }
    .palette-btn.wrong { background-color: #ffcdd2; border-color: #f44336; color: #b71c1c; }
    .action-btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; }
    .retest-btn { background-color: #f57c00; }
    .test-wrong-btn { background-color: #d32f2f; }
  </style>
</head>
<body>
  <header>
    <h1 id="test-title">CBT Mock Test: ರಾಜ್ಯದ ಪ್ರಮುಖ ಜಲಪಾತಗಳು</h1>
    <div class="timer" id="timer">Time Left: 15:00</div>
  </header>
  <div class="main-container">
    <div class="quiz-card">
      <div class="question-title" id="q-text">Loading question...</div>
      <div class="options-container" id="options-box"></div>
      <div class="explanation" id="explanation-box"></div>
      <div class="nav-buttons">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">Previous</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next</button>
      </div>
    </div>
    <div class="palette-card">
      <div class="score-board" id="score-text">Score: 0 / 0</div>
      <div class="palette-grid" id="palette-grid"></div>
      <button class="action-btn retest-btn" onclick="retest()">ಮರುಪರೀಕ್ಷೆ (Retest)</button>
      <button class="action-btn test-wrong-btn" onclick="testWrongAnswers()">Test Wrong Answers</button>
    </div>
  </div>

  <script>
    const originalQuestions = [
      { id: 1, question: "1) ಜೋಗ ಜಲಪಾತ ಯಾವ ನದಿಯ ಮೇಲಿದೆ ಮತ್ತು ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಘಟಪ್ರಭಾ - ಬೆಳಗಾವಿ", "ಶರಾವತಿ - ಶಿವಮೊಗ್ಗ", "ನೇತ್ರಾವತಿ - ದಕ್ಷಿಣ ಕನ್ನಡ", "ಕಾವೇರಿ - ಮಂಡ್ಯ"], correct: 1, explanation: "ಜೋಗ ಜಲಪಾತ ಶರಾವತಿ ನದಿಗೆ ಸೇರಿದ್ದು, ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
      { id: 2, question: "2) ಗೋಕಾಕ್ ಜಲಪಾತವು ಯಾವ ನದಿಯಲ್ಲಿದೆ?", options: ["ಘಟಪ್ರಭಾ ನದಿ", "ದೋಣಿ ನದಿ", "ಅಘನಾಶಿನಿ ನದಿ", "ಬೇಡ್ತಿ ನದಿ"], correct: 0, explanation: "ಗೋಕಾಕ್ ಜಲಪಾತ ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ಘಟಪ್ರಭಾ ನದಿಯಲ್ಲಿದೆ." },
      { id: 3, question: "3) ಛಾಯಾ ಭಗವತಿ ಜಲಪಾತ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಉತ್ತರ ಕನ್ನಡ", "ರಾಯಚೂರು", "ಮೈಸೂರು", "ಚಾಮರಾಜನಗರ"], correct: 1, explanation: "ಛಾಯಾ ಭಗವತಿ ಜಲಪಾತ ದೋಣಿ ನದಿಯಲ್ಲಿದ್ದು, ರಾಯಚೂರು ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
      { id: 4, question: "4) ಬಂಡಾಜೆ ಜಲಪಾತ ಯಾವ ನದಿ ಹಾಗೂ ಜಿಲ್ಲೆಗೆ ಸೇರಿದೆ?", options: ["ನೇತ್ರಾವತಿ - ದಕ್ಷಿಣ ಕನ್ನಡ", "ಕಾವೇರಿ - ಮಂಡ್ಯ", "ಶರಾವತಿ - ಶಿವಮೊಗ್ಗ", "ಅಘನಾಶಿನಿ - ಉತ್ತರ ಕನ್ನಡ"], correct: 0, explanation: "ಬಂಡಾಜೆ ಜಲಪಾತ ದಕ್ಷಿಣ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ನೇತ್ರಾವತಿ ನದಿಯಲ್ಲಿದೆ." },
      { id: 5, question: "5) ಉಂಚಳ್ಳಿ ಜಲಪಾತ ಯಾವ ನದಿಯಿಂದ ರೂಪುಗೊಂಡಿದೆ?", options: ["ಬೇಡ್ತಿ ನದಿ", "ಅಘನಾಶಿನಿ ನದಿ", "ಕಾವೇರಿ ನದಿ", "ಘಟಪ್ರಭಾ ನದಿ"], correct: 1, explanation: "ಉಂಚಳ್ಳಿ ಜಲಪಾತವು ಉತ್ತರ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಅಘನಾಶಿನಿ ನದಿಯಲ್ಲಿದೆ." },
      { id: 6, question: "6) ಚುಂಚನಕಟ್ಟೆ ಜಲಪಾತ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಮಂಡ್ಯ", "ಚಾಮರಾಜನಗರ", "ಮೈಸೂರು", "ಬೆಳಗಾವಿ"], correct: 2, explanation: "ಚುಂಚನಕಟ್ಟೆ ಜಲಪಾತ ಮೈಸೂರು ಜಿಲ್ಲೆಯ ಕಾವೇರಿ ನದಿಯಲ್ಲಿದೆ." },
      { id: 7, question: "7) ಶಿಂಷಾ ಜಲಪಾತ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಮಂಡ್ಯ", "ಶಿವಮೊಗ್ಗ", "ದಕ್ಷಿಣ ಕನ್ನಡ", "ರಾಯಚೂರು"], correct: 0, explanation: "ಶಿಂಷಾ ಜಲಪಾತ ಮಂಡ್ಯ ಜಿಲ್ಲೆಯ ಕಾವೇರಿ/ಶಿಂಷಾ ನದಿಗೆ ಸಂಬಂಧಿಸಿದೆ." },
      { id: 8, question: "8) ಗಗನ ಚುಕ್ಕಿ ಜಲಪಾತ ಎಲ್ಲಿದೆ?", options: ["ಮಂಡ್ಯ", "ಚಾಮರಾಜನಗರ", "ಮೈಸೂರು", "ಬೆಳಗಾವಿ"], correct: 1, explanation: "ಗಗನ ಚುಕ್ಕಿ ಜಲಪಾತ ಚಾಮರಾಜನಗರ ಜಿಲ್ಲೆಯ ಕಾವೇರಿ ನದಿಯಲ್ಲಿದೆ." },
      { id: 9, question: "9) ಭರಚುಕ್ಕಿ ಜಲಪಾತ ಯಾವ ನದಿ ಮೇಲಿದೆ?", options: ["ಶರಾವತಿ ನದಿ", "ಕಾವೇರಿ ನದಿ", "ನೇತ್ರಾವತಿ ನದಿ", "ದೋಣಿ ನದಿ"], correct: 1, explanation: "ಭರಚುಕ್ಕಿ ಜಲಪಾತವು ಚಾಮರಾಜನಗರ ಜಿಲ್ಲೆಯ ಕಾವೇರಿ ನದಿಯಲ್ಲಿದೆ." },
      { id: 10, question: "10) ಮಾಗೋಡು ಜಲಪಾತ ಯಾವ ನದಿ ಮತ್ತು ಜಿಲ್ಲೆಗೆ ಸೇರಿದೆ?", options: ["ಬೇಡ್ತಿ - ಉತ್ತರ ಕನ್ನಡ", "ಘಟಪ್ರಭಾ - ಬೆಳಗಾವಿ", "ಕಾವೇರಿ - ಮಂಡ್ಯ", "ಅಘನಾಶಿನಿ - ಉತ್ತರ ಕನ್ನಡ"], correct: 0, explanation: "ಮಾಗೋಡು ಜಲಪಾತ ಉತ್ತರ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಬೇಡ್ತಿ ನದಿಯಲ್ಲಿದೆ." }
    ];

    let currentQuestions = [...originalQuestions];
    let currentIndex = 0;
    let userAnswers = {};
    let wrongTestCounter = 1;
    let timeLeft = 900;

    function startTimer() {
      setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          let m = Math.floor(timeLeft / 60);
          let s = timeLeft % 60;
          document.getElementById('timer').innerText = `Time Left: ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }
      }, 1000);
    }

    function renderQuestion() {
      if (currentQuestions.length === 0) return;
      const q = currentQuestions[currentIndex];
      document.getElementById('q-text').innerText = q.question;
      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      const isAnswered = userAnswers[q.id] !== undefined;

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        
        if (isAnswered) {
          btn.disabled = true;
          if (idx === q.correct) btn.style.backgroundColor = '#c8e6c9';
          if (idx === userAnswers[q.id] && idx !== q.correct) btn.style.backgroundColor = '#ffcdd2';
        } else {
          btn.onclick = () => selectOption(idx);
        }
        optionsBox.appendChild(btn);
      });

      const expBox = document.getElementById('explanation-box');
      if (isAnswered) {
        expBox.style.display = 'block';
        expBox.innerHTML = `<strong>ವಿವರಣೆ:</strong> ${q.explanation}`;
      } else {
        expBox.style.display = 'none';
      }

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === currentQuestions.length - 1;
      renderPalette();
      updateScore();
    }

    function selectOption(index) {
      const q = currentQuestions[currentIndex];
      userAnswers[q.id] = index;
      renderQuestion();
    }

    function navigate(direction) {
      currentIndex += direction;
      renderQuestion();
    }

    function renderPalette() {
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.innerText = q.id;
        
        if (idx === currentIndex) btn.classList.add('active');
        if (userAnswers[q.id] !== undefined) {
          if (userAnswers[q.id] === q.correct) btn.classList.add('correct');
          else btn.classList.add('wrong');
        }
        btn.onclick = () => { currentIndex = idx; renderQuestion(); };
        grid.appendChild(btn);
      });
    }

    function updateScore() {
      let score = 0;
      Object.keys(userAnswers).forEach(qId => {
        const q = originalQuestions.find(item => item.id == qId);
        if (q && userAnswers[qId] === q.correct) score++;
      });
      document.getElementById('score-text').innerText = `Score: ${score} / ${currentQuestions.length}`;
    }

    function retest() {
      userAnswers = {};
      currentQuestions = [...originalQuestions];
      currentIndex = 0;
      wrongTestCounter = 1;
      document.getElementById('test-title').innerText = "CBT Mock Test: ರಾಜ್ಯದ ಪ್ರಮುಖ ಜಲಪಾತಗಳು";
      renderQuestion();
    }

    function testWrongAnswers() {
      const wrongList = currentQuestions.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.correct);
      if (wrongList.length === 0) {
        alert("ಯಾವುದೇ ತಪ್ಪು ಉತ್ತರಗಳಿಲ್ಲ! (No wrong answers found!)");
        return;
      }
      wrongList.forEach(q => delete userAnswers[q.id]);
      currentQuestions = wrongList;
      currentIndex = 0;
      document.getElementById('test-title').innerText = `CBT Mock Test: Wrong Test-${wrongTestCounter++}`;
      renderQuestion();
    }

    window.onload = () => {
      startTimer();
      renderQuestion();
    };
  </script>
</body>
</html>
