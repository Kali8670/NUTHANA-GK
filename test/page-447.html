                options: [
                    "ರಾಷ್ಟ್ರಪತಿಗಳಿಗೆ",
                    "ಪ್ರಧಾನಮಂತ್ರಿಗೆ",
                    "ಲೋಕಸಭೆಯ ಸಭಾಪತಿಗೆ (Speaker)",
                    "ಸುಪ್ರೀಂ ಕೋರ್ಟ್ ಮುಖ್ಯ ನ್ಯಾಯಾಧೀಶರಿಗೆ"
                ],
                correct: 2,
                explanation: "ಲೋಕಸಭೆಯ ಸದಸ್ಯರು ತಮ್ಮ ರಾಜೀನಾಮೆ ಪತ್ರವನ್ನು ಲೋಕಸಭೆಯ ಸಭಾಪತಿಯವರಿಗೆ (Speaker) ಸಲ್ಲಿಸುತ್ತಾರೆ."
            }
        ];

        let currentActiveQuestions = [...allQuestions];
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let wrongTestCounter = 1;
        let timerInterval;
        let totalSeconds = 1800; // 30 Minutes

        function initQuiz() {
            startTimer();
            renderQuiz();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').innerText = "Time Up!";
                    return;
                }
                totalSeconds--;
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                document.getElementById('timer').innerText = `Time: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function renderQuiz() {
            if (currentActiveQuestions.length === 0) return;

            const q = currentActiveQuestions[currentQuestionIndex];
            document.getElementById('questionHeader').innerText = `Question Number: ${q.id}`;
            document.getElementById('questionText').innerText = q.question;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const isAnswered = userAnswers.hasOwnProperty(q.id);
            const selectedOption = userAnswers[q.id];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;

                if (isAnswered) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (idx === selectedOption && idx !== q.correct) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectOption(q.id, idx);
                }

                optionsContainer.appendChild(btn);
            });

            const expBlock = document.getElementById('explanationBlock');
            if (isAnswered) {
                expBlock.style.display = 'block';
                expBlock.innerHTML = `<strong>ವಿವರಣೆ (Explanation):</strong> ${q.explanation}`;
            } else {
                expBlock.style.display = 'none';
            }

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = currentQuestionIndex === currentActiveQuestions.length - 1;

            updatePaletteAndScore();
        }

        function selectOption(qId, optionIdx) {
            userAnswers[qId] = optionIdx;
            renderQuiz();
        }

        function navigateQuestion(direction) {
            const newIndex = currentQuestionIndex + direction;
            if (newIndex >= 0 && newIndex < currentActiveQuestions.length) {
                currentQuestionIndex = newIndex;
                renderQuiz();
            }
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = index;
            renderQuiz();
        }

        function updatePaletteAndScore() {
            const paletteGrid = document.getElementById('paletteGrid');
            paletteGrid.innerHTML = '';

            let score = 0;

            currentActiveQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.innerText = q.id;

                if (idx === currentQuestionIndex) {
                    btn.classList.add('active');
                }

                if (userAnswers.hasOwnProperty(q.id)) {
                    if (userAnswers[q.id] === q.correct) {
                        btn.classList.add('correct-btn');
                        score++;
                    } else {
                        btn.classList.add('wrong-btn');
                    }
                }

                btn.onclick = () => jumpToQuestion(idx);
                paletteGrid.appendChild(btn);
            });

            document.getElementById('scoreDisplay').innerText = `Score: ${score} / ${currentActiveQuestions.length}`;
        }

        function resetFullTest() {
            currentActiveQuestions = [...allQuestions];
            userAnswers = {};
            currentQuestionIndex = 0;
            wrongTestCounter = 1;
            document.getElementById('testHeaderTitle').innerText = "Mock Test - Indian Constitution (Q43-Q73)";
            totalSeconds = 1800;
            startTimer();
            renderQuiz();
        }

        function startWrongTest() {
            const wrongQuestions = currentActiveQuestions.filter(q => {
                return userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.correct;
            });

            if (wrongQuestions.length === 0) {
                alert("No wrong answers found to re-test!");
                return;
            }

            wrongQuestions.forEach(q => {
                delete userAnswers[q.id];
            });

            currentActiveQuestions = wrongQuestions;
            currentQuestionIndex = 0;
            
            document.getElementById('testHeaderTitle').innerText = `Wrong Test-${wrongTestCounter}`;
            wrongTestCounter++;

            renderQuiz();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
