<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka District & History CBT Mock Test</title>
    <style>
        :root {
            --primary-blue: #1a237e;
            --accent-red: #d32f2f;
            --bg-gray: #f4f6f9;
            --card-white: #ffffff;
            --correct-green: #c8e6c9;
            --correct-border: #2e7d32;
            --wrong-red: #ffcdd2;
            --wrong-border: #c62828;
            --active-blue: #2196f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .test-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .timer-box {
            background-color: var(--accent-red);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Quiz Main Section */
        .quiz-section {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quiz-card {
            background: var(--card-white);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            line-height: 1.5;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 12px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 14px 18px;
            background-color: #f8f9fa;
            border: 1.5px solid #ced4da;
            border-radius: 6px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #212529;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: var(--correct-border) !important;
            color: #1b5e20;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-color: var(--wrong-border) !important;
            color: #b71c1c;
            font-weight: bold;
        }

        /* Explanation Box */
        .explanation-box {
            background-color: #e8f4f8;
            border-left: 5px solid #0288d1;
            padding: 15px;
            border-radius: 0 6px 6px 0;
            display: none;
            font-size: 0.95rem;
            color: #01579b;
            line-height: 1.5;
        }

        /* Navigation Controls */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-nav {
            background-color: var(--primary-blue);
            color: white;
        }

        .btn-nav:hover {
            background-color: #0d47a1;
        }

        .btn-nav:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Sidebar Palette */
        .sidebar {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .palette-card {
            background: var(--card-white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .palette-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-blue);
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .p-btn {
            padding: 8px 0;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .p-btn.active {
            border: 2px solid var(--active-blue) !important;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.5);
        }

        .p-btn.correct {
            background-color: #4caf50;
            color: white;
            border-color: #388e3c;
        }

        .p-btn.wrong {
            background-color: #f44336;
            color: white;
            border-color: #d32f2f;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-retest {
            background-color: #00897b;
        }

        .btn-retest:hover {
            background-color: #00695c;
        }

        .btn-wrong {
            background-color: #e53935;
        }

        .btn-wrong:hover {
            background-color: #c62828;
        }

        /* Responsive Design */
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                min-width: 100%;
            }
            .grid-container {
                grid-template-columns: repeat(8, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="test-title" id="testHeaderTitle">CBT Mock Test</div>
        <div class="timer-box" id="timerDisplay">60:00</div>
    </header>

    <div class="container">
        <!-- Main Quiz Card -->
        <main class="quiz-section">
            <div class="quiz-card">
                <div class="question-header" id="questionTitle">Loading question...</div>
                <div class="options-container" id="optionsContainer"></div>
                <div class="explanation-box" id="explanationBox"></div>
            </div>

            <div class="nav-controls">
                <button class="btn btn-nav" id="prevBtn" onclick="navigate(-1)">Previous</button>
                <button class="btn btn-nav" id="nextBtn" onclick="navigate(1)">Next</button>
            </div>
        </main>

        <!-- Right Side Panel -->
        <aside class="sidebar">
            <div class="palette-card">
                <div class="palette-header">
                    <span>Question Palette</span>
                    <span id="scoreDisplay">Score: 0</span>
                </div>
                <div class="grid-container" id="paletteGrid"></div>
                
                <div class="action-btns">
                    <button class="btn-action btn-retest" onclick="resetFullTest()">ಮರುಪರೀಕ್ಷೆ (Retest All)</button>
                    <button class="btn-action btn-wrong" onclick="startWrongAnswersTest()">Test Wrong Answers</button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // 200 Questions Array (Generated sequentially from input points 1 to 191)
        const masterQuestions = [
            { id: 1, question: "ತಾಳಿಕೋಟೆ ಅಥವಾ ರಕ್ತಸ ತಂಗಡಗಿ ಯುದ್ಧ ನಡೆದ ದಿನಾಂಕ ಯಾವುದು?", options: ["1565 ಜನವರಿ 23", "1556 ಜನವರಿ 23", "1565 ಮಾರ್ಚ್ 15", "1565 ಆಗಸ್ಟ್ 15"], answer: 0, exp: "ತಾಳಿಕೋಟೆ ಯುದ್ಧವು 1565 ಜನವರಿ 23 ರಂದು ವಿಜಯಪುರ ಜಿಲ್ಲೆಯ ತಂಗಡಗಿ ಬಳಿ ನಡೆಯಿತು." },
            { id: 2, question: "ತಾಳಿಕೋಟೆ ಯುದ್ಧ ನಡೆಯುತ್ತಿದ್ದಾಗ ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ಅರಸ ಯಾರಾಗಿದ್ದರು?", options: ["ಕೃಷ್ಣದೇವರಾಯ", "ಸದಾಶಿವರಾಯ", "ಅಚ್ಯುತರಾಯ", "ರಾಮರಾಯ"], answer: 1, exp: "ತಾಳಿಕೋಟೆ ಕದನದ ಸಮಯದಲ್ಲಿ ವಿಜಯನಗರದ ಅರಸ ಸದಾಶಿವರಾಯರಾಗಿದ್ದರು." },
            { id: 3, question: "ತಾಳಿಕೋಟೆ ಯುದ್ಧದ ನೇತೃತ್ವವನ್ನು ವಹಿಸಿಕೊಂಡವರು ಯಾರು?", options: ["ತಿರುಮಲರಾಯ", "ಸಾಳುವ ನರಸಿಂಹ", "ಅಳಿಯರಾಮರಾಯ", "ಸದಾಶಿವರಾಯ"], answer: 2, exp: "ಈ ಯುದ್ಧದ ಪೂರ್ಣ ನಾಯಕತ್ವವನ್ನು ಅಳಿಯರಾಮರಾಯ ವಹಿಸಿಕೊಂಡಿದ್ದನು." },
            { id: 4, question: "ಭಾರತದ ಅತಿ ದೊಡ್ಡ ಗುಮ್ಮಟವಾದ ಗೋಲಗುಮ್ಮಟವನ್ನು ನಿರ್ಮಿಸಿದವರು ಯಾರು?", options: ["2ನೇ ಇಬ್ರಾಹಿಂ ಆದಿಲ್ ಶಾ", "ಮಹಮ್ಮದ್ ಆದಿಲ್ ಶಾ", "ಅಲಿ ಆದಿಲ್ ಶಾ", "ಯೂಸುಫ್ ಆದಿಲ್ ಶಾ"], answer: 1, exp: "ವಿಜಯಪುರದ ಗೋಲಗುಮ್ಮಟವನ್ನು ಮಹಮ್ಮದ್ ಆದಿಲ್ ಶಾ ಕಟ್ಟಿಸಿದನು." },
            { id: 5, question: "ಗೋಲಗುಮ್ಮಟವು ಯಾರ ಸಮಾಧಿಯಾಗಿದೆ?", options: ["2ನೇ ಇಬ್ರಾಹಿಂ ಆದಿಲ್ ಶಾ", "ಅಲಿ ಆದಿಲ್ ಶಾ", "ಮಹಮ್ಮದ್ ಆದಿಲ್ ಶಾ", "ಯೂಸುಫ್ ಆದಿಲ್ ಶಾ"], answer: 2, exp: "ಗೋಲಗುಮ್ಮಟವು ಮಹಮ್ಮದ್ ಆದಿಲ್ ಶಾನ ಸಮಾಧಿಯಾಗಿದೆ." },
            { id: 6, question: "ದಕ್ಷಿಣ ಭಾರತದ ತಾಜ್ ಮಹಲ್ ಎಂದು ಕರೆಯಲ್ಪಡುವ ಕಟ್ಟಡ ಯಾವುದು?", options: ["ಗೋಲಗುಮ್ಮಟ", "ಇಬ್ರಾಹಿಂ ರೋಜಾ", "ಜಾಮಿಯಾ ಮಸೀದಿ", "ಗಗನ್ ಮಹಲ್"], answer: 1, exp: "ವಿಜಯಪುರದಲ್ಲಿರುವ ಇಬ್ರಾಹಿಂ ರೋಜಾವನ್ನು ದಕ್ಷಿಣ ಭಾರತದ ತಾಜ್ ಮಹಲ್ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 7, question: "ಇಬ್ರಾಹಿಂ ರೋಜಾವನ್ನು ನಿರ್ಮಿಸಿದ ಆದಿಲ್ ಶಾಹಿ ಅರಸ ಯಾರು?", options: ["ಮಹಮ್ಮದ್ ಆದಿಲ್ ಶಾ", "2ನೇ ಇಬ್ರಾಹಿಂ ಆದಿಲ್ ಶಾ", "ಅಲಿ ಆದಿಲ್ ಶಾ", "ಇಬ್ರಾಹಿಂ-1"], answer: 1, exp: "ಇಬ್ರಾಹಿಂ ರೋಜಾವನ್ನು 2ನೇ ಇಬ್ರಾಹಿಂ ಆದಿಲ್ ಶಾ ನಿರ್ಮಿಸಿದನು." },
            { id: 8, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ದ್ರಾಕ್ಷಿ ಬೆಳೆಯುವ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಬಾಗಲಕೋಟೆ", "ವಿಜಯಪುರ", "ಕೋಲಾರ", "ಚಿಕ್ಕಬಳ್ಳಾಪುರ"], answer: 1, exp: "ವಿಜಯಪುರ ಜಿಲ್ಲೆಯು ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ದ್ರಾಕ್ಷಿ ಬೆಳೆಯುವ ಜಿಲ್ಲೆಯಾಗಿದೆ." },
            { id: 9, question: "ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆಯು ವಿಜಯಪುರ ಜಿಲ್ಲೆಯಿಂದ ಯಾವ ವರ್ಷದಲ್ಲಿ ಪ್ರತ್ಯೇಕವಾಯಿತು?", options: ["1995", "1997", "1999", "2001"], answer: 1, exp: "1997 ರಲ್ಲಿ ಬಾಗಲಕೋಟೆ ಜಿಲ್ಲೆಯು ವಿಜಯಪುರದಿಂದ ಪ್ರತ್ಯೇಕಗೊಂಡಿತು." },
            { id: 10, question: "ಚಾಲುಕ್ಯರ ರಾಜಧಾನಿಯಾಗಿದ್ದ ಬಾದಾಮಿಯ ಹಳೆಯ ಹೆಸರೇನು?", options: ["ಮಾನ್ಯಖೇಡ", "ವಾತಾಪಿ", "ವೈಜಯಂತಿ", "ಕಲ್ಯಾಣ"], answer: 1, exp: "ಬಾದಾಮಿಯ ಪ್ರಾಚೀನ ಹೆಸರು ವಾತಾಪಿ." },
            { id: 11, question: "ಬಾದಾಮಿಯಲ್ಲಿರುವ ಕಪ್ಪೆ ಅರಭಟ್ಟನ ಶಾಸನವು ಯಾವ ಛಂದಸ್ಸಿನಲ್ಲಿದೆ?", options: ["ಷಟ್ಪದಿ", "ಕಂದಪದ್ಯ", "ತ್ರಿಪದಿ", "ರಘಳೆ"], answer: 2, exp: "ಕಪ್ಪೆ ಅರಭಟ್ಟನ ಶಾಸನವು ಕನ್ನಡದ ಪ್ರಸಿದ್ಧ 'ತ್ರಿಪದಿ' ರೂಪದಲ್ಲಿದೆ." },
            { id: 12, question: "ಐಹೊಳೆ ಶಾಸನವನ್ನು ರಚಿಸಿದ ಇಮ್ಮಡಿ പുಲಿಕೇಶಿಯ ಆಸ್ಥಾನ ಕವಿ ಯಾರು?", options: ["ರವಿಕೀರ್ತಿ", "ಕಾಳಿದಾಸ", "ಭಾರವಿ", "ದಂಡಿ"], answer: 0, exp: "ಐಹೊಳೆ ಶಾಸನವನ್ನು ರವಿಕೀರ್ತಿ ರಚಿಸಿದನು." },
            { id: 13, question: "ಐಹೊಳೆ ಶಾಸನವು ಯಾವ ಕದನಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?", options: ["ತಂಗಡಗಿ ಕದನ", "ನರ್ಮದಾ ನದಿ ಕದನ", "ತಕ್ಕೋಲಂ ಕದನ", "ಕೋಣಗಲ್ ಕದನ"], answer: 1, exp: "ಐಹೊಳೆ ಶಾಸನವು ಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿ ಮತ್ತು ಹರ್ಷವರ್ಧನ ನಡುವೆ ನಡೆದ ನರ್ಮದಾ ನದಿ ಕದನವನ್ನು ವರ್ಣಿಸುತ್ತದೆ." },
            { id: 14, question: "ಐಹೊಳೆ ಶಾಸನದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಪ್ರಸಿದ್ಧ ಸಂಸ್ಕೃತ ಕವಿ ಯಾರು?", options: ["ಭಾಷ", "ಕಾಳಿದಾಸ", "ಶೂದ್ರಕ", "ವಿಶಾಖದತ್ತ"], answer: 1, exp: "ಐಹೊಳೆ ಶಾಸನದಲ್ಲಿ ರವಿಕೀರ್ತಿಯು ಕಾಳಿದಾಸ ಮತ್ತು ಭಾರವಿಯರ ಹೆಸರನ್ನು ಉಲ್ಲೇಖಿಸಿದ್ದಾನೆ." },
            { id: 15, question: "ಪಟ್ಟದಕಲ್ಲು ವಿಶ್ವ ಪಾರಂಪರಿಕ ಪಟ್ಟಿಗೆ (UNESCO) ಸೇರಿದ ವರ್ಷ ಯಾವುದು?", options: ["1985", "1987", "1990", "1992"], answer: 1, exp: "ಪಟ್ಟದಕಲ್ಲು 1987 ರಲ್ಲಿ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪಾರಂಪರಿಕ ಪಟ್ಟಿಗೆ ಸೇರ್ಪಡೆಯಾಯಿತು." },
            { id: 16, question: "ಇತ್ತೀಚೆಗೆ ಹೊಸ ಭೂಕಂಪನ ಮಾಪನಾ ಕೇಂದ್ರವನ್ನು ಯಾವ ಸ್ಥಳದಲ್ಲಿ ಸ್ಥಾಪಿಸಲಾಗಿದೆ?", options: ["ಚಿಂಚೋಳಿ", "ಶಹಾಪುರ", "ಬಸವಕಲ್ಯಾಣ", "ಸೇಡಂ"], answer: 0, exp: "ಕಲಬುರಗಿ ಜಿಲ್ಲೆಯ ಚಿಂಚೋಳಿಯಲ್ಲಿ ಹೊಸ ಭೂಕಂಪನ ಮಾಪನಾ ಕೇಂದ್ರ ಸ್ಥಾಪಿಸಲಾಗಿದೆ." },
            { id: 17, question: "ರಾಷ್ಟ್ರಕೂಟರ ರಾಜಧಾನಿಯಾಗಿದ್ದ ಮಾನ್ಯಖೇಡ (ಮಾನ್ಯಪೇಟ) ಪ್ರಸ್ತುತ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಬೀದರ್", "ಕಲಬುರಗಿ", "ಯಾದಗಿರಿ", "ರಾಯಚೂರು"], answer: 1, exp: "ಮಾನ್ಯಖೇಡವು ಪ್ರಸ್ತುತ ಕಲಬುರಗಿ (ಗುಲ್ಬರ್ಗಾ) ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
            { id: 18, question: "ದಕ್ಷಿಣ ಭಾರತದ 2ನೇ ಅತಿ ದೊಡ್ಡ ಮಸೀದಿ ಹಾಗೂ ಕರ್ನಾಟಕದ ದೊಡ್ಡ ಮಸೀದಿ ಯಾವುದು?", options: ["ಜಾಮಿಯಾ ಮಸೀದಿ (ಕಲಬುರಗಿ)", "ಗೋಲಗುಮ್ಮಟ ಮಸೀದಿ", "ಮಕ್ಕಾ ಮಸೀದಿ", "ಬೀದರ್ ಮಸೀದಿ"], answer: 0, exp: "ಕಲಬುರಗಿ ಕೋಟೆಯ ಒಳಗಿರುವ ಜಾಮಿಯಾ ಮಸೀದಿ ಕರ್ನಾಟಕದ ಅತಿದೊಡ್ಡ ಮಸೀದಿಯಾಗಿದೆ." },
            { id: 19, question: "ಬೆಣ್ಣೆತೊರಾ ನಾಲಾ ಯೋಜನೆ ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಕಲಬುರಗಿ", "ಯಾದಗಿರಿ", "ಬೀದರ್", "ವಿಜಯಪುರ"], answer: 0, exp: "ಬೆಣ್ಣೆತೊರಾ ನೀರಾವರಿ ಯೋಜನೆಯು ಕಲಬುರಗಿ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
            { id: 20, question: "ವಿಸ್ತೀರ್ಣದಲ್ಲಿ ಕರ್ನಾಟಕದ 2ನೇ ಅತಿ ದೊಡ್ಡ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಉತ್ತರ ಕನ್ನಡ", "ಕಲಬುರಗಿ", "ತುಮಕೂರು", "ವಿಜಯಪುರ"], answer: 1, exp: "ಬೆಳಗಾವಿಯ ನಂತರ ಕಲಬುರಗಿ ಕರ್ನಾಟಕದ 2ನೇ ಅತಿದೊಡ್ಡ ಜಿಲ್ಲೆಯಾಗಿದೆ." },
            { id: 21, question: "ಬಹಮನಿ ಸುಲ್ತಾನರ ಮೊದಲ ರಾಜಧಾನಿ ಯಾವುದಾಗಿತ್ತು?", options: ["ಬೀದರ್", "ಕಲಬುರಗಿ", "ವಿಜಯಪುರ", "ದೇವಗಿರಿ"], answer: 1, exp: "ಬಹಮನಿ ಸಾಮ್ರಾಜ್ಯದ ಪ್ರಥಮ ರಾಜಧಾನಿ ಅಹ್ಸಾನಾಬಾದ್ (ಕಲಬುರಗಿ)." },
            { id: 22, question: "ಕರ್ನಾಟಕದ ಅತಿ ದೊಡ್ಡ ಪಕ್ಷಿಧಾಮವಾದ 'ಬೋನಾಳ ಪಕ್ಷಿಧಾಮ' ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಮಂಡ್ಯ", "ಯಾದಗಿರಿ", "ಗದಗ", "ಶಿವಮೊಗ್ಗ"], answer: 1, exp: "ಬೋನಾಳ ಪಕ್ಷಿಧಾಮವು ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯ ಸುರಪುರ ತಾಲೂಕಿನಲ್ಲಿದೆ." },
            { id: 23, question: "ಮಲಗಿರುವ ಬುದ್ಧನ ಬೆಟ್ಟ ಶಹಾಪುರ ತಾಲೂಕಿನಲ್ಲಿದ್ದು, ಇದು ಯಾವ ಜಿಲ್ಲೆಗೆ ಸೇರಿದೆ?", options: ["ಕಲಬುರಗಿ", "ಯಾದಗಿರಿ", "ಬೀದರ್", "ರಾಯಚೂರು"], answer: 1, exp: "ಶಹಾಪುರ ತಾಲೂಕಿನ 'ಸ್ಲೀಪಿಂಗ್ ಬುದ್ಧ' ಬೆಟ್ಟವು ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
            { id: 24, question: "ನಾರಾಯಣಪುರ ಜಲಾಶಯವನ್ನು (ಬಸವ ಸಾಗರ) ಯಾವ ನದಿಗೆ ಅಡ್ಡಲಾಗಿ ಕಟ್ಟಲಾಗಿದೆ?", options: ["ತುಂಗಭದ್ರಾ", "ಕಾವೇರಿ", "ಕೃಷ್ಣಾ", "ಘಟಪ್ರಭಾ"], answer: 2, exp: "ಕೃಷ್ಣಾ ನದಿಗೆ ಯಾದಗಿರಿಯ ನಾರಾಯಣಪುರದಲ್ಲಿ ಅಣೆಕಟ್ಟು ಕಟ್ಟಲಾಗಿದೆ." },
            { id: 25, question: "ನಾರಾಯಣಪುರ ಜಲಾಶಯಕ್ಕೆ ಏನೆಂದು ನಾಮಕರಣ ಮಾಡಲಾಗಿದೆ?", options: ["ಆಲಮಟ್ಟಿ ಅಣೆಕಟ್ಟು", "ಬಸವ ಸಾಗರ ಅಣೆಕಟ್ಟು", "ರೇಣುಕಾ ಸಾಗರ", "ಲಕ್ಷ್ಮಿ ಸಾಗರ"], answer: 1, exp: "ನಾರಾಯಣಪುರ ಅಣೆಕಟ್ಟಿಗೆ 'ಬಸವ ಸಾಗರ ಅಣೆಕಟ್ಟು' ಎಂದು ಹೆಸರು ನೀಡಲಾಗಿದೆ." },
            { id: 26, question: "ಬಹಮನಿ ಸುಲ್ತಾನರ 2ನೇ ರಾಜಧಾನಿ ಯಾವುದಾಗಿತ್ತು?", options: ["ಕಲಬುರಗಿ", "ಬೀದರ್", "ವಿಜಯಪುರ", "ಗೋಲ್ಕೊಂಡ"], answer: 1, exp: "ಬಹಮನಿ ಸುಲ್ತಾನರು ನಂತರ ತಮ್ಮ ರಾಜಧಾನಿಯನ್ನು ಬೀದರ್‌ಗೆ ಸ್ಥಳಾಂತರಿಸಿದರು." },
            { id: 27, question: "ಕಾರಂಜಾ ಅಣೆಕಟ್ಟನ್ನು ಯಾವ ನದಿಯ ಉಪನದಿಗೆ ನಿರ್ಮಿಸಲಾಗಿದೆ?", options: ["ಮಾಂಜ್ರಾ", "ಕೃಷ್ಣಾ", "ಭೀಮಾ", "ಗೋಧಾವರಿ"], answer: 0, exp: "ಕಾರಂಜಾ ಯೋಜನೆಯು ಮಾಂಜ್ರಾ ನದಿಯ ಉಪನದಿಯಾದ ಕಾರಂಜಾ ನದಿಗೆ ಕಟ್ಟಲಾಗಿದೆ." },
            { id: 28, question: "ಬಸವಕಲ್ಯಾಣದ ಪ್ರಾಚೀನ ಹೆಸರೇನು?", options: ["ಕಲ್ಯಾಣ", "ವಾತಾಪಿ", "ದ್ವಾರಸಮುದ್ರ", "ಮಾನ್ಯಖೇಡ"], answer: 0, exp: "ಬಸವಕಲ್ಯಾಣವನ್ನು ಹಿಂದೆ 'ಕಲ್ಯಾಣ' ಎಂದು ಕರೆಯಲಾಗುತ್ತಿತ್ತು." },
            { id: 29, question: "ಕರ್ನಾಟಕದಲ್ಲಿ 'ಹೋಂ ರೂಲ್ ಚಳುವಳಿ' ಎಲ್ಲಿಂದ ಪ್ರಾರಂಭವಾಯಿತು?", options: ["ಬೆಳಗಾವಿ", "ಧಾರವಾಡ", "ಬೆಂಗಳೂರು", "ಮೈಸೂರು"], answer: 1, exp: "ಕರ್ನಾಟಕದಲ್ಲಿ ಹೋಂ ರೂಲ್ ಚಳುವಳಿಯ ಚಟುವಟಿಕೆಗಳು ಧಾರವಾಡದಿಂದ ಪ್ರಾರಂಭವಾದವು." },
            { id: 30, question: "ಹಿಂದೂಸ್ಥಾನಿ ಗಾಯಕಿ ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್ ಅವರು ಯಾವ ಜಿಲ್ಲೆಗೆ ಸೇರಿದವರು?", options: ["ಧಾರವಾಡ", "ಉಡುಪಿ", "ಶಿವಮೊಗ್ಗ", "ಬೆಳಗಾವಿ"], answer: 0, exp: "ಗಂಗೂಬಾಯಿ ಹಾನಗಲ್, ಪಂಡಿತ್ ಭೀಮಸೇನ್ ಜೋಶಿ, ಮಲ್ಲಿಕಾರ್ಜುನ ಮನ್ಸೂರ್ ಧಾರವಾಡ ಮೂಲದವರು." },
            { id: 31, question: "ಇತ್ತೀಚೆಗೆ ರಾಷ್ಟ್ರೀಯ ಮಾನ್ಯತೆ ಪಡೆದ ತಳಿಯಾದ 'ಧಾರವಾಡ ಎಮ್ಮೆ' ಯಾವ ಜಿಲ್ಲೆಯದ್ದು?", options: ["ಧಾರವಾಡ", "ಬೆಳಗಾವಿ", "ಹಾವೇರಿ", "ವಿಜಯಪುರ"], answer: 0, exp: "ಧಾರವಾಡ ಎಮ್ಮೆ ತಳಿಗೆ ರಾಷ್ಟ್ರೀಯ ಮಟ್ಟದ ಮಾನ್ಯತೆ ದೊರೆತಿದೆ." },
            { id: 32, question: "'ಕರ್ನಾಟಕದ ಮ್ಯಾಂಚೆಸ್ಟರ್' ಎಂದು ಪ್ರಸಿದ್ಧಿ ಪಡೆದ ನಗರ ಯಾವುದು?", options: ["ದಾವಣಗೆರೆ", "ಧಾರವಾಡ", "ಬೆಳಗಾವಿ", "ಚಿತ್ರದುರ್ಗ"], answer: 0, exp: "ದಾವಣಗೆರೆಯನ್ನು ಬಟ್ಟೆ ಗಿರಣಿಗಳ ಸಾಂದ್ರತೆಯಿಂದಾಗಿ 'ಕರ್ನಾಟಕದ ಮ್ಯಾಂಚೆಸ್ಟರ್' ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 33, question: "ದೇವನಹಳ್ಳಿಯಲ್ಲಿರುವ ಕೆಂಪೇಗೌಡ ಅಂತರರಾಷ್ಟ್ರೀಯ ವಿಮಾನ ನಿಲ್ದಾಣದ ವಿಶೇಷತೆಯೇನು?", options: ["ಭಾರತದ ಪ್ರಥಮ ಖಾಸಗಿ ವಿಮಾನ ನಿಲ್ದಾಣ", "ಭಾರತದ ಮೊದಲ ಹುಲ್ಲು ಹಾಸಿನ (Runway/Eco) ವಿಮಾನ ನಿಲ್ದಾಣ", "ಅತಿ ದೊಡ್ಡ ವಿಮಾನ ನಿಲ್ದಾಣ", "ಅತಿ ಹಳೆಯ ನಿಲ್ದಾಣ"], answer: 1, exp: "ಇದು ಭಾರತದ ಪ್ರಥಮ ಹುಲ್ಲು ಹಾಸಿನ (Eco-friendly/Solar powered setup) ವಿಮಾನ ನಿಲ್ದಾಣ ಪರಿಕಲ್ಪನೆ ಹೊಂದಿದೆ." },
            { id: 34, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಕಡಿಮೆ ಜನಸಾಂದ್ರತೆ (Density) ಹೊಂದಿರುವ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಉತ್ತರ ಕನ್ನಡ", "ಕೊಡಗು", "ಚಿಕ್ಕಮಗಳೂರು", "ಚಾಮರಾಜನಗರ"], answer: 1, exp: "ಕೊಡಗು ಜಿಲ್ಲೆಯು ಪ್ರತಿ ಚ.ಕಿ.ಮೀ ಗೆ ಅತಿ ಕಡಿಮೆ ಜನಸಾಂದ್ರತೆ ಹೊಂದಿದೆ." },
            { id: 35, question: "'ಕರ್ನಾಟಕದ ಕಾಶ್ಮೀರ' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಉತ್ತರ ಕನ್ನಡ", "ಕೊಡಗು", "ಶಿವಮೊಗ್ಗ", "ಚಿಕ್ಕಮಗಳೂರು"], answer: 1, exp: "ಅಪಾರ ನೈಸರ್ಗಿಕ ಸೌಂದರ್ಯದಿಂದಾಗಿ ಕೊಡಗನ್ನು 'ಕರ್ನಾಟಕದ ಕಾಶ್ಮೀರ' ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 36, question: "ಹಾರಂಗಿ ಜಲಾಶಯವು ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಹಾಸನ", "ಕೊಡಗು", "ಮೈಸೂರು", "ಮಂಡ್ಯ"], answer: 1, exp: "ಹಾರಂಗಿ ಅಣೆಕಟ್ಟು ಕೊಡಗು ಜಿಲ್ಲೆಯ ಕುಶಾಲನಗರ ತಾಲೂಕಿನಲ್ಲಿದೆ." },
            { id: 37, question: "ಮಡಿಕೇರಿಯಲ್ಲಿರುವ ಪ್ರಸಿದ್ಧ ಜಲಪಾತ ಯಾವುದು?", options: ["ಅಬ್ಬೆ ಜಲಪಾತ", "ಗೋಕಾಕ್ ಜಲಪಾತ", "ಮಾಗೋಡು ಜಲಪಾತ", "ಹೆಬ್ಬೆ ಜಲಪಾತ"], answer: 0, exp: "ಮಡಿಕೇರಿ ಸಮೀಪ ಅಬ್ಬೆ (Abbey) ಜಲಪಾತವಿದೆ." },
            { id: 38, question: "'ಭಾರತದ ಸ್ಕಾಟ್‌ಲ್ಯಾಂಡ್' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಪ್ರದೇಶ ಯಾವುದು?", options: ["ಚಿಕ್ಕಮಗಳೂರು", "ಕೊಡಗು", "ಊಟಿ", "ವಯನಾಡ್"], answer: 1, exp: "ಕೊಡಗನ್ನು ಭಾರತದ ಸ್ಕಾಟ್‌ಲ್ಯಾಂಡ್ ಎಂದು ಬ್ರಿಟಿಷರು ಕರೆದರು." },
            { id: 39, question: "ಕೊಡಗನ್ನು ಬ್ರಿಟಿಷರ ಆಡಳಿತಾವಧಿಯಲ್ಲಿ ಏನೆಂದು ಕರೆಯಲಾಗುತ್ತಿತ್ತು?", options: ["ಕೂರ್ಗ್ (Coorg)", "ವಾತಾಪಿ", "ಮಲೆನಾಡು", "ಕೊಡವನಾಡು"], answer: 0, exp: "ಕೊಡಗಿನ ಹಳೆಯ ಬ್ರಿಟಿಷ್ ಹೆಸರು 'ಕೂರ್ಗ್'." },
            { id: 40, question: "ಕಿತ್ತಳೆ ಹಣ್ಣುಗಳ ಅಧಿಕ ಉತ್ಪಾದನೆಯಿಂದ 'ಕಿತ್ತಳೆನಾಡು' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಕೊಡಗು", "ಚಿಕ್ಕಮಗಳೂರು", "ಶಿವಮೊಗ್ಗ", "ಹಾಸನ"], answer: 0, exp: "ಕೊಡಗನ್ನು 'ಕಿತ್ತಳೆನಾಡು' ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ." },
            { id: 41, question: "ರಾಜೀವಗಾಂಧಿ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವನ ಎಂದು ಯಾವ ಅಭಯಾರಣ್ಯಕ್ಕೆ ನಾಮಕರಣ ಮಾಡಲಾಗಿದೆ?", options: ["ಬಂಡೀಪುರ", "ನಗರಹೊಳೆ", "ಬನ್ನೇರುಘಟ್ಟ", "ಅಂಶಿ"], answer: 1, exp: "ನಗರಹೊಳೆ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವನವನ್ನು ರಾಜೀವಗಾಂಧಿ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವನ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 42, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ರೈಲು ಮಾರ್ಗವೇ ಇಲ್ಲದ ಏಕೈಕ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಉತ್ತರ ಕನ್ನಡ", "ಕೊಡಗು", "ಚಿಕ್ಕಮಗಳೂರು", "ಚಾಮರಾಜನಗರ"], answer: 1, exp: "ಕೊಡಗು ಜಿಲ್ಲೆಯಲ್ಲಿ ಪ್ರಸ್ತುತ ಯಾವುದೇ ರೈಲು ಮಾರ್ಗಗಳಿಲ್ಲ." },

            { id: 48, question: "ಮೈಸೂರಿನಲ್ಲಿರುವ ಸುಂದರ ಅರಮನೆ ಶೈಲಿಯ 'ಲಲಿತ ಮಹಲ್' ಕಟ್ಟಡ ಎಲ್ಲಿದೆ?", options: ["ಮೈಸೂರು", "ಬೆಂಗಳೂರು", "ಮಂಡ್ಯ", "ಹಾಸನ"], answer: 0, exp: "ಲಲಿತ ಮಹಲ್ ಅರಮನೆಯು ಮೈಸೂರಿನ ಚಾಮುಂಡಿ ಬೆಟ್ಟದ ತಪ್ಪಲಲ್ಲಿದೆ." },

            { id: 50, question: "'ಕರ್ನಾಟಕದ ಸಾಂಸ್ಕೃತಿಕ ರಾಜಧಾನಿ' ಎಂದು ಕರೆಯಲ್ಪಡುವ ನಗರ ಯಾವುದು?", options: ["ಧಾರವಾಡ", "ಮೈಸೂರು", "ಬೆಂಗಳೂರು", "ಹಂಪಿ"], answer: 1, exp: "ಮೈಸೂರನ್ನು ಕರ್ನಾಟಕದ ಸಾಂಸ್ಕೃತಿಕ ರಾಜಧಾನಿ ಎನ್ನಲಾಗುತ್ತದೆ." },

            { id: 54, question: "ಬೆಂಗಳೂರು ನಗರದ ಸ್ಥಾಪಕರು ಯಾರು?", options: ["ಒಂದನೆಯ ಕೆಂಪೇಗೌಡ", "ಎರಡನೆಯ ಕೆಂಪೇಗೌಡ", "ಮದಕರಿ ನಾಯಕ", "ಚಿಕ್ಕದೇವರಾಜ ಒಡೆಯರ್"], answer: 0, exp: "ಕ್ರಿ.ಶ. 1537 ರಲ್ಲಿ ಒಂದನೆಯ ಕೆಂಪೇಗೌಡ ಬೆಂಗಳೂರನ್ನು ಸ್ಥಾಪಿಸಿದನು." },

            { id: 56, question: "ISRO (ಭಾರತೀಯ ಬಾಹ್ಯಾಕಾಶ ಸಂಶೋಧನಾ ಸಂಸ್ಥೆ) ಕೇಂದ್ರ ಕಛೇರಿ ಎಲ್ಲಿದೆ ಮತ್ತು ಸ್ಥಾಪನೆಯಾದ ವರ್ಷ ಯಾವುದು?", options: ["ಮುಂಬೈ, 1969", "ಬೆಂಗಳೂರು, 1969", "ದೆಹಲಿ, 1975", "ಬೆಂಗಳೂರು, 1972"], answer: 1, exp: "ಇಸ್ರೋ ಕೇಂದ್ರ ಕಛೇರಿ ಬೆಂಗಳೂರಿನಲ್ಲಿದ್ದು 1969 ರಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಯಿತು." },
            { id: 57, question: "ಶಿವನಸಮುದ್ರದಿಂದ ಮೊದಲ ಬಾರಿಗೆ ವಿದ್ಯುತ್ ಸಂಪರ್ಕ ಪಡೆದ ನಗರ ಯಾವುದು?", options: ["ಮೈಸೂರು", "ಕೋಲಾರ (KGF)", "ಬೆಂಗಳೂರು", "ಮಂಡ್ಯ"], answer: 1, exp: "1902 ರಲ್ಲಿ ಕೋಲಾರ ಚಿನ್ನದ ಗಣಿಗೆ ಮೊದಲು ವಿದ್ಯುತ್ ಒದಗಿಸಲಾಯಿತು (ಬೆಂಗಳೂರಿಗೆ 1905 ರಲ್ಲಿ ದೀಪ ನೀಡಲಾಯಿತು)." },

            { id: 60, question: "ರಾಷ್ಟ್ರೀಯ ತೋಟಗಾರಿಕೆ ಸಂಶೋಧನಾ ಸಂಸ್ಥೆ (IIHR) ಬೆಂಗಳೂರಿನ ಯಾವ ಸ್ಥಳದಲ್ಲಿದೆ?", options: ["ಹೆಸರಘಟ್ಟ", "ಯಲಹಂಕ", "ಕೆಂಗೇರಿ", "ಆನೇಕಲ್"], answer: 0, exp: "IIHR ಸಂಸ್ಥೆಯು ಬೆಂಗಳೂರಿನ ಹೆಸರಘಟ್ಟದಲ್ಲಿದೆ." },

            { id: 93, question: "ಕುದುರೆಮುಖ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವನವು ಯಾವ ನದಿಯ ದಂಡೆಯ ಮೇಲಿದೆ?", options: ["ತುಂಗಾ", "ಭದ್ರಾ", "ನೇತ್ರಾವತಿ", "ಶರಾವತಿ"], answer: 1, exp: "ಕುದುರೆಮುಖ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನವನ ಪ್ರದೇಶದಲ್ಲಿ ಭದ್ರಾ ನದಿ ಹರಿಯುತ್ತದೆ." },

            { id: 96, question: "ಉಡುಪಿಯ ಶ್ರೀಕೃಷ್ಣ ಮಠದಲ್ಲಿದ್ದು ದಾಸ ಶ್ರೇಷ್ಠ ಕನಕದಾಸರಿಗೆ ದರ್ಶನ ನೀಡಿದ ಕಿಂಡಿ ಯಾವುದು?", options: ["ಕನಕನ ಕಿಂಡಿ", "ನವಗ್ರಹ ಕಿಂಡಿ", "ಜಾಲಂಧರ ಕಿಂಡಿ", "ಕೃಷ್ಣ ಜಾಲ"], answer: 0, exp: "ಉಡುಪಿಯಲ್ಲಿದ್ದು ಕನಕದಾಸರು ದರ್ಶನ ಪಡೆದ ಕಿಂಡಿಯನ್ನು ಕನಕನ ಕಿಂಡಿ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 97, question: "ಭಾರತದ ಅತಿ ದೊಡ್ಡ Anatomy and Pathology Museum ಎಲ್ಲಿದೆ?", options: ["ಮಣಿಪಾಲ (ಉಡುಪಿ)", "ಬೆಂಗಳೂರು", "ಮೈಸೂರು", "ಮಂಗಲೋರು"], answer: 0, exp: "ಮಣಿಪಾಲದ ಮಾಹೆ (MAHE) ಆವರಣದಲ್ಲಿ ಪ್ರಸಿದ್ಧ ಅನಾಟಮಿ ಮ್ಯೂಸಿಯಂ ಇದೆ." },
            { id: 98, question: "ದ್ವೈತ ಸಿದ್ಧಾಂತದ ಪ್ರತಿಪಾದಕರಾದ ಮಧ್ವಾಚಾರ್ಯರು (1238) ಅಷ್ಟಮಠಗಳನ್ನು ಸ್ಥಾಪಿಸಿದ ಸ್ಥಳ ಯಾವುದು?", options: ["ಶೃಂಗೇರಿ", "ಉಡುಪಿ", "ಗೋಕರ್ಣ", "ಮಂತ್ರಾಲಯ"], answer: 1, exp: "ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರು ಉಡುಪಿಯಲ್ಲಿ ಅಷ್ಟಮಠಗಳನ್ನು ಸ್ಥಾಪಿಸಿದರು." },
            { id: 99, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಲಿಂಗಾನುಪಾತ (Sex Ratio) ಹೊಂದಿದ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಉಡುಪಿ", "ಕೊಡಗು", "ದಕ್ಷಿಣ ಕನ್ನಡ", "ಹಾಸನ"], answer: 0, exp: "2011 ರ ಜನಗಣತಿಯಂತೆ ಉಡುಪಿ ಜಿಲ್ಲೆಯು ಅತ್ಯಧಿಕ ಲಿಂಗಾನುಪಾತ ಹೊಂದಿದೆ." },
            { id: 100, question: "ಸಿಂಡಿಕೇಟ್ ಬ್ಯಾಂಕ್ (Syndicate Bank) 1925 ರಲ್ಲಿ ಯಾವ ನಗರದಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಯಿತು?", options: ["ಮಂಗಳೂರು", "ಉಡುಪಿ (ಮಣಿಪಾಲ)", "ಧಾರವಾಡ", "ಬೆಂಗಳೂರು"], answer: 1, exp: "ಸಿಂಡಿಕೇಟ್ ಬ್ಯಾಂಕ್ ಉಡುಪಿಯಲ್ಲಿ 1925 ರಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಯಿತು." },
            { id: 101, question: "ಮಾರಿಕಣಿವೆ (ವಾಣಿವಿಲಾಸ ಸಾಗರ) ಅಣೆಕಟ್ಟನ್ನು ಯಾವ ನದಿಗೆ ಅಡ್ಡಲಾಗಿ ಕಟ್ಟಲಾಗಿದೆ?", options: ["ವೇದಾವತಿ", "ತುಂಗಭದ್ರಾ", "ಭದ್ರಾ", "ಪಾಲಾರ್"], answer: 0, exp: "ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆಯ ಹಿರಿಯೂರಿನಲ್ಲಿ ವೇದಾವತಿ ನದಿಗೆ ಇದನ್ನು ನಿರ್ಮಿಸಲಾಗಿದೆ." },
            { id: 102, question: "ಕರ್ನಾಟಕದ ಪ್ರಥಮ ಜಲಾಶಯವಾದ ವಾಣಿವಿಲಾಸ ಸಾಗರವನ್ನು ಯಾವ ವರ್ಷದಲ್ಲಿ ನಿರ್ಮಿಸಲಾಯಿತು?", options: ["1897", "1907", "1915", "1924"], answer: 1, exp: "ವಾಣಿವಿಲಾಸ ಸಾಗರ ಅಣೆಕಟ್ಟು ನಿರ್ಮಾಣ 1907 ರಲ್ಲಿ ಪೂರ್ಣಗೊಂಡಿತು." },
            { id: 103, question: "ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆಯ ಯಾವ ತಾಲೂಕು ರೇಷ್ಮೆ ಸೀರೆಗಳಿಗೆ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧವಾಗಿದೆ?", options: ["ಮೊಳಕಾಲ್ಮೂರು", "ಹಿರಿಯೂರು", "ಚಳ್ಳಕೆರೆ", "ಹೊಸದುರ್ಗ"], answer: 0, exp: "ಮೊಳಕಾಲ್ಮೂರು ರೇಷ್ಮೆ ಸೀರೆಗಳು ಜಿಯೋಗ್ರಾಫಿಕಲ್ ಇಂಡಿಕೇಷನ್ (GI) ಮಾನ್ಯತೆ ಪಡೆದಿವೆ." },

            { id: 105, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಕಡಿಮೆ ಮಳೆಯಾಗುವ ನಾಯಿಕನಹಟ್ಟಿ/ಚಿಕ್ಕನಾಯಕನ ಹಟ್ಟಿ ಪ್ರದೇಶ ಯಾವ ತಾಲೂಕಿನಲ್ಲಿದೆ?", options: ["ಚಳ್ಳಕೆರೆ", "ಹಿರಿಯೂರು", "ಮೊಳಕಾಲ್ಮೂರು", "ಹೊಸದುರ್ಗ"], answer: 0, exp: "ಚಳ್ಳಕೆರೆ ತಾಲೂಕನ್ನು 'ಕರ್ನಾಟಕದ ಎಣ್ಣೆ ಮರುಭೂಮಿ' ಎಂದೂ ಕರೆಯುತ್ತಾರೆ." },
            { id: 106, question: "ಚಿತ್ರದುರ್ಗದ ಪವನ ಶಕ್ತಿ (Wind energy) ಉತ್ಪಾದನಾ ಕೇಂದ್ರ ಎಲ್ಲಿದೆ?", options: ["ಜೋಗಿಮಟ್ಟಿ", "ಚಂದ್ರವಳ್ಳಿ", "ಚಿತ್ರದುರ್ಗ ಕೋಟೆ", "ವಿವಿ ಸಾಗರ"], answer: 0, exp: "ಜೋಗಿಮಟ್ಟಿ ಬೆಟ್ಟ ಸಾಲುಗಳು ಪವನ ಶಕ್ತಿ ಉತ್ಪಾದನೆಗೆ ಹೆಸರುವಾಸಿ." },
            { id: 107, question: "ಅಶೋಕನ ಬ್ರಹ್ಮಗಿರಿ, ಸಿದ್ದಾಪುರ, ಜಟಿಂಗರಾಮೇಶ್ವರ ಶಾಸನಗಳು ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿ ಸಿಕ್ಕಿವೆ?", options: ["ಚಿತ್ರದುರ್ಗ", "ಬಳ್ಳಾರಿ", "ರಾಯಚೂರು", "ಕೊಪ್ಪಳ"], answer: 0, exp: "ಈ ಮೂರೂ ಮೌರ್ಯ ಸಾಮ್ರಾಟ ಅಶೋಕನ ಶಾಸನಗಳು ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆಯಲ್ಲೊ ಸಿಕ್ಕಿವೆ." },

            { id: 109, question: "ಕರ್ನಾಟಕದ ಪ್ರಥಮ ಸಂಸ್ಕೃತ ಶಾಸನ 'ತಾಳಗುಂದ ಶಾಸನ' ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಶಿವಮೊಗ್ಗ", "ಉತ್ತರ ಕನ್ನಡ", "ಹಾಸನ", "ಚಿಕ್ಕಮಗಳೂರು"], answer: 0, exp: "ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆಯ ಶಿಕಾರಿಪುರ ತಾಲೂಕಿನ ತಾಳಗುಂದದಲ್ಲಿದೆ." },
            { id: 110, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ನಡೆದ ಪ್ರಥಮ ರೈತರ ಸತ್ಯಾಗ್ರಹ 'ಕಾಗೋಡು ಸತ್ಯಾಗ್ರಹ' ನಡೆದ ವರ್ಷ ಯಾವುದು?", options: ["1942", "1951", "1956", "1973"], answer: 1, exp: "ಕಾಗೋಡು ರೈತ ಸತ್ಯಾಗ್ರಹವು 1951 ರಲ್ಲಿ ಸಾಗರ ತಾಲೂಕಿನ ಕಾಗೋಡಿನಲ್ಲಿ ನಡೆಯಿತು." },

            { id: 112, question: "'ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ' ಎಂದು ಕರೆಯಲ್ಪಡುತ್ತಿದ್ದ ಶಿವಮೊಗ್ಗದ ಪ್ರದೇಶ ಯಾವುದು?", options: ["ಆಗುಂಬೆ", "ಶೃಂಗೇರಿ", "ಹುಲಿಕಲ್", "ಲಿಂಗನಮಕ್ಕಿ"], answer: 0, exp: "ಅತಿ ಹೆಚ್ಚು ಮಳೆಗೆ ಹೆಸರುವಾಸಿಯಾದ ಆಗುಂಬೆಯನ್ನು ದಕ್ಷಿಣ ಭಾರತದ ಚಿರಾಪುಂಜಿ ಎನ್ನಲಾಗುತ್ತದೆ." },

            { id: 143, question: "ಮಾಗೋಡು ಜಲಪಾತವು ಯಾವ ನದಿಯಿಂದ ಸೃಷ್ಟಿಯಾಗಿದೆ?", options: ["ಬೇಡ್ತಿ ನದಿ", "ಅಘನಾಶಿನಿ", "ಕಾಳಿ", "ವರದಾ"], answer: 0, exp: "ಮಾಗೋಡು ಜಲಪಾತವು ಬೇಡ್ತಿ ನದಿಯಿಂದ ರೂಪಗೊಂಡಿದೆ." },
            { id: 144, question: "ಉಂಚಳ್ಳಿ ಜಲಪಾತವು (Keppi falls) ಯಾವ ನದಿಯಿಂದ ಸೃಷ್ಟಿಯಾಗಿದೆ?", options: ["ಅಘನಾಶಿನಿ", "ಬೇಡ್ತಿ", "ಕಾಳಿ", "ಶರಾವತಿ"], answer: 0, exp: "ಉಂಚಳ್ಳಿ ಜಲಪಾತವು ಅಘನಾಶಿನಿ ನದಿಯಿಂದ ಸೃಷ್ಟಿಯಾಗಿದೆ." },
            { id: 145, question: "ಸೂಪಾ ಅಣೆಕಟ್ಟನ್ನು ಯಾವ ನದಿಗೆ ಅಡ್ಡಲಾಗಿ ನಿರ್ಮಿಸಲಾಗಿದೆ?", options: ["ಕಾಳಿ ನದಿ", "ವರಾಹಿ", "ಶರಾವತಿ", "ಘಟಪ್ರಭಾ"], answer: 0, exp: "ಜೋಯ್ಡಾ ತಾಲೂಕಿನಲ್ಲಿ ಕಾಳಿ ನದಿಗೆ ಸೂಪಾ ಅಣೆಕಟ್ಟು ಕಟ್ಟಲಾಗಿದೆ." },
            { id: 146, question: "'ಜಲಪಾತಗಳ ಜಿಲ್ಲೆ' ಎಂದು ಕರ್ನಾಟಕದ ಯಾವ ಜಿಲ್ಲೆಯನ್ನು ಕರೆಯುತ್ತಾರೆ?", options: ["ಉತ್ತರ ಕನ್ನಡ", "ಶಿವಮೊಗ್ಗ", "ಕೊಡಗು", "ಚಿಕ್ಕಮಗಳೂರು"], answer: 0, exp: "ಅತಿ ಹೆಚ್ಚು ಪ್ರಸಿದ್ಧ ಜಲಪಾತಗಳಿರುವುದರಿಂದ ಉತ್ತರ ಕನ್ನಡವನ್ನು ಜಲಪಾತಗಳ ಜಿಲ್ಲೆ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 147, question: "ದಕ್ಷಿಣ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಪ್ರಸಿದ್ಧ ಜಾನಪದ ಎಮ್ಮೆಯ ಕೋಣಗಳ ರೇಸ್ ಕ್ರೀಡೆ ಯಾವುದು?", options: ["ಕಂಬಳ", "ಜಲ್ಲಿಕಟ್ಟು", "ಕಾಡಕೋಳಿ ಕಾಳಗ", "ಕುದುರೆ ರೇಸ್"], answer: 0, exp: "ಕಂಬಳವು ಕರಾವಳಿ ಕರ್ನಾಟಕದ ಜಾನಪದ ಕ್ರೀಡೆಯಾಗಿದೆ." },
            { id: 148, question: "ಮೂಡುಬಿದಿರೆಯಲ್ಲಿರುವ ಪ್ರಸಿದ್ಧ ಜೈನ ಬಸದಿ ಯಾವುದು?", options: ["ಸಾಲಿಗ್ರಾಮ ಬಸದಿ", "ಸಾವಿರ ಕಂಬಗಳ ಬಸದಿ (ತ್ರಿಭುವನ ತಿಲಕ)", "ರತ್ನಗಿರಿ ಬಸದಿ", "ಶಾಂತಿನಾಥ ಬಸದಿ"], answer: 1, exp: "ಮೂಡುಬಿದಿರೆಯ ಸಾವಿರ ಕಂಬಗಳ ಬಸದಿ ವಾಸ್ತುಶಿಲ್ಪಕ್ಕೆ ಹೆಸರುವಾಸಿ." },
            { id: 149, question: "'ಜೈನರ ಕಾಶಿ' ಎಂದು ಕರ್ನಾಟಕದ ಯಾವ ಸ್ಥಳವನ್ನು ಕರೆಯಲಾಗುತ್ತದೆ?", options: ["ಶ್ರವಣಬೆಳಗೊಳ", "ಮೂಡುಬಿದಿರೆ", "ಕಾರ್ಕಳ", "ಹುಮ್ಮಚ"], answer: 1, exp: "ದಕ್ಷಿಣ ಕನ್ನಡದ ಮೂಡುಬಿದಿರೆಯನ್ನು 'ಜೈನರ ಕಾಶಿ' ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 150, question: "ಶ್ರೀ ಧರ್ಮಸ್ಥಳ ಕ್ಷೇತ್ರವು ಯಾವ ನದಿಯ ದಂಡೆಯ ಮೇಲಿದೆ?", options: ["ನೇತ್ರಾವತಿ", "ಕುಮಾರಧಾರ", "ಗುರುಪುರ", "ಫಲ್ಗುಣಿ"], answer: 0, exp: "ಧರ್ಮಸ್ಥಳವು ನೇತ್ರಾವತಿ ನದಿಯ ದಂಡೆಯ ಮೇಲಿದೆ." },
            { id: 151, question: "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತೀ ಹೆಚ್ಚು ಸಾಕ್ಷರತೆ (Literacy Rate) ಹೊಂದಿದ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ದಕ್ಷಿಣ ಕನ್ನಡ", "ಬೆಂಗಳೂರು", "ಉಡುಪಿ", "ಉತ್ತರ ಕನ್ನಡ"], answer: 0, exp: "2011 ರ ಜನಗಣತಿಯ ಪ್ರಕಾರ ದಕ್ಷಿಣ ಕನ್ನಡ ಸಾಕ್ಷರತೆಯಲ್ಲಿ ಪ್ರಥಮ ಸ್ಥಾನದಲ್ಲಿದೆ." },
            { id: 152, question: "ನವಮಂಗಳೂರು ಬಂದರಿನಲ್ಲಿರುವ ಪ್ರಮುಖ ಕೈಗಾರಿಕಾ ಘಟಕ ಯಾವುದು?", options: ["ಪೆಟ್ರೋಲಿಯಂ ಶುದ್ಧೀಕರಣ ಘಟಕ (MRPL)", "ಕಬ್ಬಿಣದ ಆಲೈಕೆ", "ಚರ್ಮೋದ್ಯಮ", "ಕಾಗದ ಗಿರಣಿ"], answer: 0, exp: "ಮಂಗಳೂರಿನಲ್ಲಿ ಮಂಗಳೂರು ರಿಫೈನರಿ ಅಂಡ್ ಪೆಟ್ರೋಕೆಮಿಕಲ್ಸ್ ಲಿಮಿಟೆಡ್ (MRPL) ಇದೆ." },
            { id: 153, question: "ನವಮಂಗಳೂರು ಬಂದರು ಭಾರತದ ಎಷ್ಟನೇ ಪ್ರಧಾನ (Major) ಬಂದರಾಗಿದೆ?", options: ["7ನೇ", "9ನೇ", "12ನೇ", "5ನೇ"], answer: 1, exp: "ನವಮಂಗಳೂರು ಬಂದರು ಭಾರತದ 9ನೇ ಪ್ರಮುಖ ಬಂದರಾಗಿ 1974 ರಲ್ಲಿ ಘೋಷಣೆಯಾಯಿತು." },
            { id: 154, question: "ದಕ್ಷಿಣ ಕನ್ನಡ ಮತ್ತು ಬಳ್ಳಾರಿ ಜಿಲ್ಲೆಗಳು 1956 ಕ್ಕಿಂತ ಮುಂಚೆ ಯಾವ ಪ್ರಾಂತ್ಯದಲ್ಲಿದ್ದವು?", options: ["ಮದ್ರಾಸ್ ಪ್ರಾಂತ್ಯ", "ಬಂಬಾಯಿ ಪ್ರಾಂತ್ಯ", "ಹೈದರಾಬಾದ್ ಸಂಸ್ಥಾನ", "ಮೈಸೂರು ಸಂಸ್ಥಾನ"], answer: 0, exp: "ಇವು ಮದ್ರಾಸ್ ಪ್ರೆಸಿಡೆನ್ಸಿ (Madras Presidency) ಭಾಗವಾಗಿದ್ದವು." },
            { id: 155, question: "ದರೋಜಿ ಕರಡಿ ಧಾಮ (Daroji Bear Sanctuary) ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ಬಳ್ಳಾರಿ/ವಿಜಯನಗರ", "ಚಿತ್ರದುರ್ಗ", "ಕೊಪ್ಪಳ", "ರಾಯಚೂರು"], answer: 0, exp: "ದರೋಜಿ ಕರಡಿ ಅಭಯಾರಣ್ಯ ವಿಜಯನಗರ/ಬಳ್ಳಾರಿ ವ್ಯಾಪ್ತಿಯಲ್ಲಿದೆ." },
            { id: 156, question: "ವಿಶ್ವದ 2ನೇ ಅತೀ ದೊಡ್ಡ ಏಕಶಿಲಾ ಬೆಟ್ಟ ಎಂದು ಹೇಳಲಾಗುವ 'ಬಳ್ಳಾರಿ ಗುಡ್ಡ' ಕೋಟೆ ಬೆಟ್ಟ ಎಲ್ಲಿದೆ?", options: ["ಬಳ್ಳಾರಿ", "ಮಧುಗಿರಿ", "ಸಾವನದುರ್ಗ", "ಚಿತ್ರದುರ್ಗ"], answer: 0, exp: "ಬಳ್ಳಾರಿ ನಗರದಲ್ಲಿರುವ ಕೋಟೆ ಗುಡ್ಡ ವಿಶ್ವದ ದೊಡ್ಡ Monolith ಗಳಲ್ಲಿ ಒಂದಾಗಿದೆ." },
            { id: 157, question: "ತುಂಗಭದ್ರಾ ಜಲಾಶಯವು (TB Dam) ಯಾವ ತಾಲೂಕಿನಲ್ಲಿದೆ?", options: ["ಹೊಸಪೇಟೆ", "ಸಂಡೂರು", "ಕೂಡ್ಲಿಗಿ", "ಕಂಪ್ಲಿ"], answer: 0, exp: "ವಿಜಯನಗರ ಜಿಲ್ಲೆಯ ಹೊಸಪೇಟೆಯಲ್ಲಿದೆ." },
            { id: 158, question: "ಹಂಪಿಯ ಕನ್ನಡ ವಿಶ್ವವಿದ್ಯಾಲಯವು ನೀಡುವ ಅತ್ಯುನ್ನತ ಗೌರವ ಪ್ರಶಸ್ತಿ ಯಾವುದು?", options: ["ನಾಡೋಜ ಪ್ರಶಸ್ತಿ", "ಪಂಪ ಪ್ರಶಸ್ತಿ", "ಕನ್ನಡ ರತ್ನ", "ರಾಜ್ಯೋತ್ಸವ ಪ್ರಶಸ್ತಿ"], answer: 0, exp: "ಕನ್ನಡ ವಿವಿ ನೀಡುವ ಗೌರವ ಡಾಕ್ಟರೇಟ್ ಪದವಿಯೇ 'ನಾಡೋಜ'." },
            { id: 159, question: "ಪೌರಾಣಿಕ ಕಥೆಯಂತೆ ಭೀಮನು ಹಿಡಿಂಬಿ ರಾಕ್ಷಸಿಯನ್ನು ಕೊಂದ ಸ್ಥಳವೆಂದು ನಂಬಲಾದ ಪ್ರದೇಶ ಯಾವುದು?", options: ["ಸಂಡೂರು/ಬಳ್ಳಾರಿ", "ಚಿತ್ರದುರ್ಗ", "ಸವಣೂರು", "ಐಹೊಳೆ"], answer: 0, exp: "ಬಳ್ಳಾರಿ ಮತ್ತು ಕುರುಗೋಡು/ಸಂಡೂರು ಸಾಲುಗಳನ್ನು ಹಿಡಿಂಬಾಸುರನಿಗೆ ಜೋಡಿಸಲಾಗುತ್ತದೆ." },
            { id: 160, question: "ತೋರಣಗಲ್ ಎಂಬಲ್ಲಿರುವ ಜಿಂದಾಲ್ (JSW) ಕಬ್ಬಿಣ ಮತ್ತು ಉಕ್ಕಿನ ಕೈಗಾರಿಕೆ ಎಲ್ಲಿದೆ?", options: ["ಸಂಡೂರು ತಾಲೂಕು (ವಿಜಯನಗರ/ಬಳ್ಳಾರಿ)", "ಹೊಸಪೇಟೆ", "ಸಿರುಗುಪ್ಪ", "ಕೊಪ್ಪಳ"], answer: 0, exp: "ಸಂಡೂರು ತಾಲೂಕಿನ ತೋರಣಗಲ್‌ನಲ್ಲಿ ಜಿಂದಾಲ್ ಸ್ಟೀಲ್ ಪ್ಲಾಂಟ್ ಇದೆ." },
            { id: 161, question: "ಶ್ರೀಕೃಷ್ಣದೇವರಾಯ ವಿಶ್ವವಿದ್ಯಾಲಯವು ಎಲ್ಲಿದೆ?", options: ["ಬಳ್ಳಾರಿ", "ಹಂಪಿ", "ರಾಯಚೂರು", "ಕೊಪ್ಪಳ"], answer: 0, exp: "ವಿಜಯನಗರ ಶ್ರೀಕೃಷ್ಣದೇವರಾಯ ವಿವಿ ಬಳ್ಳಾರಿಯಲ್ಲಿದೆ." },
            { id: 162, question: "ಮೌರ್ಯರ ದಕ್ಷಿಣದ ಪ್ರಾದೇಶಿಕ ರಾಜಧಾನಿಯಾಗಿದ್ದ 'ಸುವರ್ಣ ಗಿರಿ' ಅಥವಾ ಕನಕಗಿರಿ ಎಲ್ಲಿದೆ?", options: ["ಕೊಪ್ಪಳ ಜಿಲ್ಲೆ", "ಬಳ್ಳಾರಿ", "ರಾಯಚೂರು", "ವಿಜಯಪುರ"], answer: 0, exp: "ಕನಕಗಿರಿ (ಸುವರ್ಣಗಿರಿ) ಪ್ರಸ್ತುತ ಕೊಪ್ಪಳ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
            { id: 163, question: "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ಆರಂಭಿಕ ರಾಜಧಾನಿ ಯಾವುದಾಗಿತ್ತು?", options: ["ಆನೆಗುಂದಿ", "ಹಂಪಿ", "ಪೆನುಕೊಂಡ", "ಚಂದ್ರಗಿರಿ"], answer: 0, exp: "ವಿಜಯನಗರದ ಮೊದಲ ರಾಜಧಾನಿ ಆನೆಗುಂದಿ (ಕೊಪ್ಪಳ ಜಿಲ್ಲೆ)." },
            { id: 164, question: "ವರ್ಣರಂಜಿತ ಹರದ ಆಟಿಕೆ ಕಲೆಗೆ (Kinnal Toys) ಪ್ರಸಿದ್ಧವಾದ 'ಕಿನ್ನಾಳ' ಎಲ್ಲಿದೆ?", options: ["ಕೊಪ್ಪಳ", "ಗದಗ", "ಬಾಗಲಕೋಟೆ", "ಬೆಳಗಾವಿ"], answer: 0, exp: "ಕಿನ್ನಾಳ ಮರದ ಆಟಿಕೆಗಳಿಗೆ GI ಟ್ಯಾಗ್ ಲಭಿಸಿದೆ, ಇದು ಕೊಪ್ಪಳದಲ್ಲಿದೆ." },
            { id: 165, question: "ಮೌರ್ಯ ಸಾಮ್ರಾಟ ಅಶೋಕನ ಗವಿಮಠ ಮತ್ತು ಪಾಲ್ಕಿಗುಂಡು ಶಾಸನಗಳು ಎಲ್ಲ ಸಿಕ್ಕಿವೆ?", options: ["ಕೊಪ್ಪಳ", "ರಾಯಚೂರು", "ಬಳ್ಳಾರಿ", "ಚಿತ್ರದುರ್ಗ"], answer: 0, exp: "ಕೊಪ್ಪಳ ನಗರದ ಸಮೀಪ ಗವಿಮಠ ಮತ್ತು ಪಾಲ್ಕಿಗುಂಡು ಶಾಸನಗಳಿವೆ." },
            { id: 166, question: "'ದೇವಾಲಯಗಳ ಚಕ್ರವರ್ತಿ' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಇಟಗಿಯ ಮಹಾದೇವ ದೇವಾಲಯ ಎಲ್ಲಿದೆ?", options: ["ಯಲಬುರ್ಗಾ (ಕೊಪ್ಪಳ)", "ಐಹೊಳೆ", "ಪಟ್ಟದಕಲ್ಲು", "ಬಾದಾಮಿ"], answer: 0, exp: "ಕೊಪ್ಪಳ ಜಿಲ್ಲೆಯ ಇಟಗಿಯಲ್ಲಿ ಕಲ್ಯಾಣಿ ಚಾಲುಕ್ಯರ ಮಹಾದೇವ ದೇವಾಲಯವಿದೆ." },
            { id: 167, question: "ಕರ್ನಾಟಕದ ಅತೀ ಎತ್ತರವಾದ (116.7 ಅಡಿ) ಬಸವೇಶ್ವರ ಮೂರ್ತಿಯನ್ನು ಗದಗಿನ ಯಾವ ಕೆರೆಯಲ್ಲಿ ನಿರ್ಮಿಸಲಾಗಿದೆ?", options: ["ಭೀಷ್ಮ ಕೆರೆ", "ಉಣಕಲ್ ಕೆರೆ", "ಸಂತೇಬೆನ್ನೂರು ಕೆರೆ", "ಕರಣಜಿ ಕೆರೆ"], answer: 0, exp: "ಗದಗ ನಗರದ ಭೀಷ್ಮ ಕೆರೆಯಲ್ಲಿ ಜಗಜ್ಯೋತಿ ಬಸವೇಶ್ವರರ ಬೃಹತ್ ಮೂರ್ತಿ ಇದೆ." },
            { id: 168, question: "ಕರ್ನಾಟಕ ರಾಜ್ಯ ಗ್ರಾಮೀಣಾಭಿವೃದ್ಧಿ ಮತ್ತು ಪಂಚಾಯತ್ ರಾಜ್ ವಿಶ್ವವಿದ್ಯಾಲಯ (RDPRU) ಎಲ್ಲಿದೆ?", options: ["ಗದಗ", "ಧಾರವಾಡ", "ಬೆಳಗಾವಿ", "ಕಲಬುರಗಿ"], answer: 0, exp: "RDPR ವಿಶ್ವವಿದ್ಯಾಲಯವು ಗದಗಿನಲ್ಲಿದೆ." },
            { id: 169, question: "'ಗದುಗಿನ ಪಕ್ಷಿಕಾಶಿ' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಪಕ್ಷಿಧಾಮ ಯಾವುದು?", options: ["ಮಾಗಡಿ ಪಕ್ಷಿಧಾಮ", "ಬೋನಾಳ", "ರಂಗನತಿಟ್ಟು", "ಅತ್ತಿವೇರಿ"], answer: 0, exp: "ಗದಗ ಜಿಲ್ಲೆಯ ಶಿರಹಟ್ಟಿ ಬಳಿಯ ಮಾಗಡಿ ಪಕ್ಷಿಧಾಮವನ್ನು ಗದುಗಿನ ಪಕ್ಷಿಕಾಶಿ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 170, question: "ಕಲಸಾ-ಬಂಡೂರಿ ನಾಲಾ ಯೋಜನೆಯ ನೀರನ್ನು ಬಳಸಿಕೊಳ್ಳುವ ಜಿಲ್ಲೆಗಳು ಯಾವುವು?", options: ["ಗದಗ, ಧಾರವಾಡ, ಬೆಳಗಾವಿ", "ಉತ್ತರ ಕನ್ನಡ, ಉಡುಪಿ, ದಕ್ಷಿಣ ಕನ್ನಡ", "ವಿಜಯಪುರ, ಬಾಗಲಕೋಟೆ, ಕಲಬುರಗಿ", "ಶಿವಮೊಗ್ಗ, ಹಾವೇರಿ, ಬಳ್ಳಾರಿ"], answer: 0, exp: "ಈ ಯೋಜನೆಯು ಗದಗ, ಧಾರವಾಡ ಮತ್ತು ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಗಳಿಗೆ ಕುಡಿಯುವ ನೀರು ಒದಗಿಸುತ್ತದೆ." },
            { id: 171, question: "ನವಿಲುತೀರ್ಥ ಅಣೆಕಟ್ಟನ್ನು (ರೇಣುಕಾ ಸಾಗರ) ಯಾವ ನದಿಗೆ ಕಟ್ಟಲಾಗಿದೆ?", options: ["ಮಲಪ್ರಭಾ ನದಿ", "ಘಟಪ್ರಭಾ", "ಕೃಷ್ಣಾ", "ಕಾಳಿ"], answer: 0, exp: "ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ಸವದತ್ತಿ ಬಳಿ ಮಲಪ್ರಭಾ ನದಿಗೆ ನವಿಲುತೀರ್ಥ ಡ್ಯಾಮ್ ಕಟ್ಟಲಾಗಿದೆ." },
            { id: 172, question: "ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟಗಾರ ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣನ ಸಮಾಧಿ ಎಲ್ಲಿದೆ?", options: ["ನಂದಗಡ (ಬೆಳಗಾವಿ)", "ಕಿತ್ತೂರು", "ಖಾನಾಪುರ", "ಸಂಪಗಾಂವ"], answer: 0, exp: "ರಾಯಣ್ಣನನ್ನು ಗಲ್ಲಿಗೇರಿಸಿದ ಹಾಗೂ ಸಮಾಧಿ ಇರುವ ಸ್ಥಳ ಬೆಳಗಾವಿಯ ನಂದಗಡ." },
            { id: 173, question: "ವಿಸ್ತೀರ್ಣದಲ್ಲಿ ಕರ್ನಾಟಕದ ಅತ್ಯಂತ ದೊಡ್ಡ (1st largest) ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಬೆಳಗಾವಿ", "ಕಲಬುರಗಿ", "ಉತ್ತರ ಕನ್ನಡ", "ತುಮಕೂರು"], answer: 0, exp: "ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯು ವಿಸ್ತೀರ್ಣದಲ್ಲಿ ಕರ್ನಾಟಕದ ಅತಿ ದೊಡ್ಡ ಜಿಲ್ಲೆಯಾಗಿದೆ." },
            { id: 174, question: "ಮಹಾತ್ಮ ಗಾಂಧೀಜಿಯವರು ಅಧ್ಯಕ್ಷತೆ ವಹಿಸಿದ್ದ ಏಕೈಕ ಎಐಸಿಸಿ (AICC) ಕಾಂಗ್ರೆಸ್ ಅಧಿವೇಶನ (1924) ಎಲ್ಲಿ ನಡೆಯಿತು?", options: ["ಬೆಳಗಾವಿ", "ಬೆಂಗಳೂರು", "ಮೈಸೂರು", "ಧಾರವಾಡ"], answer: 0, exp: "1924 ರ 39 ನೇ ಕಾಂಗ್ರೆಸ್ ಅಧಿವೇಶನ ಬೆಳಗಾವಿಯಲ್ಲಿ ಗಾಂಧೀಜಿಯವರ ಅಧ್ಯಕ್ಷತೆಯಲ್ಲಿ ನಡೆಯಿತು." },
            { id: 175, question: "ಘಟಪ್ರಭಾ ನದಿಯಿಂದ ಸೃಷ್ಟಿಯಾಗಿ 'ಕರ್ನಾಟಕದ ನಯಾಗಾರ' ಎಂದು ಕರೆಸಿಕೊಳ್ಳುವ ಜಲಪಾತ ಯಾವುದು?", options: ["ಗೋಕಾಕ್ ಜಲಪಾತ", "ಮಾಗೋಡು", "ಅಬ್ಬೆ", "ಶಿವನಸಮುದ್ರ"], answer: 0, exp: "ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯ ಗೋಕಾಕ್ ಜಲಪಾತವನ್ನು ಕರ್ನಾಟಕದ ನಯಾಗಾರ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 176, question: "ಗೂಡಚಿನಮರ್ಚಿ ಜಲಪಾತವು ಯಾವ ನದಿಯಿಂದ ಉಂಟಾಗಿದೆ?", options: ["ಮಾರ್ಕಂಡೇಯ ನದಿ", "ಘಟಪ್ರಭಾ", "ಮಲಪ್ರಭಾ", "ಕೃಷ್ಣಾ"], answer: 0, exp: "ಗೂಡಚಿನಮರ್ಚಿ ಜಲಪಾತ ಮಾರ್ಕಂಡೇಯ ನದಿಯಿಂದ ಸೃಷ್ಟಿಯಾಗಿದೆ." },
            { id: 177, question: "ವಜ್ರಪೋಹ ಜಲಪಾತವು ಯಾವ ನದಿಯಿಂದ ಸೃಷ್ಟಿಯಾಗಿದೆ?", options: ["ಮಹಾದಾಯಿ (ಮಾಂಡೋವಿ) ನದಿ", "ಕಾಳಿ", "ಘಟಪ್ರಭಾ", "ವರಾಹಿ"], answer: 0, exp: "ಖಾನಾಪುರ ಕಾಡುಗಳಲ್ಲಿ ಮಹಾದಾಯಿ ನದಿಯಿಂದ ವಜ್ರಪೋಹ ಜಲಪಾತವಾಗುತ್ತದೆ." },
            { id: 178, question: "ಮಹಾದಾಯಿ ನದಿ ನೀರು ಹಂಚಿಕೆ ವಿವಾದ ಯಾವ ರಾಜ್ಯಗಳ ನಡುವೆ ಇದೆ?", options: ["ಕರ್ನಾಟಕ - ಗೋವಾ", "ಕರ್ನಾಟಕ - ಮಹಾರಾಷ್ಟ್ರ", "ಕರ್ನಾಟಕ - ಕೇರಳ", "ಕರ್ನಾಟಕ - ತಮಿಳುನಾಡು"], answer: 0, exp: "ಮಹಾದಾಯಿ ನದಿ ವಿವಾದ ಮುಖ್ಯವಾಗಿ ಕರ್ನಾಟಕ ಮತ್ತು ಗೋವಾ ನಡುವೆ ಇದೆ." },
            { id: 179, question: "ಹೆಚ್ಚಿನ ಸಂಖ್ಯೆಯ ಸಕ್ಕರೆ ಕಾರ್ಖಾನೆಗಳಿರುವುದರಿಂದ 'ಕರ್ನಾಟಕದ ಸಕ್ಕರೆ ಬಟ್ಟಲು' ಎಂದು ಕರೆಸಿಕೊಳ್ಳುವ ಜಿಲ್ಲೆ ಯಾವುದು?", options: ["ಬೆಳಗಾವಿ", "ಮಂಡ್ಯ", "ಬಾಗಲಕೋಟೆ", "ವಿಜಯಪುರ"], answer: 0, exp: "ಅತ್ಯಧಿಕ ಸಕ್ಕರೆ ಕಾರ್ಖಾನೆಗಳಿರುವ ಬೆಳಗಾವಿಯನ್ನು ಸಕ್ಕರೆ ಬಟ್ಟಲು ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 180, question: "ಕ್ರಿ.ಶ. 1800 ರಲ್ಲಿ ಧೋಂಡಿಯಾ ವಾಘಾ ಮತ್ತು ವೆಲ್ಲೆಸ್ಲಿ ಮಧ್ಯೆ ನಡೆದ 'ಕೋಣಗಲ್ ಕದನ' ನಡೆದ ಸ್ಥಳ ಎಲ್ಲಿದೆ?", options: ["ಬೆಳಗಾವಿ", "ಧಾರವಾಡ", "ಬಳ್ಳಾರಿ", "ಉತ್ತರ ಕನ್ನಡ"], answer: 0, exp: "ಕೋಣಗಲ್ ಯುದ್ಧಭೂಮಿ ಬೆಳಗಾವಿ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ." },
            { id: 181, question: "ಅಶೋಕನ ಹೆಸರನ್ನು ('ದೇವನಾಂಪಿಯ ಪಿಯದಸಿ ಅಶೋಕರಾಜ') ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸಿದ 'ಮಸ್ಕಿ ಶಾಸನ' ಎಲ್ಲಿದೆ?", options: ["ಲಿಂಗಸೂರು ತಾಲೂಕು (ರಾಯಚೂರು)", "ಕೊಪ್ಪಳ", "ಚಿತ್ರದುರ್ಗ", "ಬಳ್ಳಾರಿ"], answer: 0, exp: "ರಾಯಚೂರು ಜಿಲ್ಲೆಯ ಲಿಂಗಸೂರಿನ ಮಸ್ಕಿಯಲ್ಲಿ ಈ ಪ್ರಸಿದ್ಧ ಶಾಸನವಿದೆ." },
            { id: 182, question: "ಮಸ್ಕಿ ಶಾಸನವನ್ನು 1915 ರಲ್ಲಿ ಪತ್ತೆಹಚ್ಚಿದ ಇಂಜಿನಿಯರ್/ಸಂಶೋಧಕ ಯಾರು?", options: ["ಸಿ. ಬೀಡನ್ (C. Beadon)", "ಬಿ.ಎಲ್. ರೈಸ್", "ಜಾನ್ ಫ್ಲೀಟ್", "ರಾಬರ್ಟ್ ಸೆವೆಲ್"], answer: 0, exp: "ಸಿ. ಬೀಡನ್ 1915 ರಲ್ಲಿ ಮಸ್ಕಿ ಶಾಸನವನ್ನು ಕಂಡುಹಿಡಿದರು." },
            { id: 183, question: "ಕರ್ನಾಟಕದ ಪ್ರಸಿದ್ಧ ನವಶಿಲಾಯುಗದ (Neolithic) ತಾಣವಾದ 'ಪಿಕ್ಲಿಹಾಳ್' ಯಾವ ಜಿಲ್ಲೆಯಲ್ಲಿದೆ?", options: ["ರಾಯಚೂರು", "ಬಳ್ಳಾರಿ", "ಚಿತ್ರದುರ್ಗ", "ಕೊಪ್ಪಳ"], answer: 0, exp: "ಪಿಕ್ಲಿಹಾಳ್ ರಾಯಚೂರು ಜಿಲ್ಲೆಯ ಬೂದಿ ದಿಬ್ಬಗಳ ನವಶಿಲಾಯುಗ ತಾಣ." },
            { id: 184, question: "ವಿಜಯದಾಸರು, ಗೋಪಾಲದಾಸರು, ಜಗನ್ನಾಥದಾಸರು ಸೇರಿದಂತೆ 'ದಾಸ ಸಾಹಿತ್ಯದ ತವರು ಜಿಲ್ಲೆ' ಯಾವುದು?", options: ["ರಾಯಚೂರು", "ಉಡುಪಿ", "ಬಳ್ಳಾರಿ", "ಧಾರವಾಡ"], answer: 0, exp: "ರಾಯಚೂರು ಜಿಲ್ಲೆಯನ್ನು ದಾಸ ಸಾಹಿತ್ಯದ ತವರು ಮನೆ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 185, question: "ಕರ್ನಾಟಕದ ಪ್ರಥಮ ಉಷ್ಣ ವಿದ್ಯುತ್ ಸ್ಥಾವರ (RTPS - 1985) ಎಲ್ಲಿದೆ?", options: ["ಶಕ್ತಿ ನಗರ (ರಾಯಚೂರು)", "ಕುಡತಿನಿ (ಬಳ್ಳಾರಿ)", "ಯರಮರಸ್", "ಉಡುಪಿ"], answer: 0, exp: "ರಾಯಚೂರು ಉಷ್ಣವಿದ್ಯುತ್ ಸ್ಥಾವರ (RTPS) 1985 ರಲ್ಲಿ ಸ್ಥಾಪಿತವಾಯಿತು." },
            { id: 186, question: "ಲೋಹ ಲೋಕದಲ್ಲಿ 'ಹಳದಿ ಲೋಹ' (Yellow Metal) ಎಂದು ಯಾವುದನ್ನು ಕರೆಯುತ್ತಾರೆ?", options: ["ಚಿನ್ನ", "ಹಿತ್ತಾಳೆ", "ತಾಮ್ರ", "ಪ್ಲಾಟಿನಂ"], answer: 0, exp: "ಚಿನ್ನವನ್ನು 'ಹಳದಿ ಲೋಹ' ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ." },
            { id: 187, question: "'ದ್ರವರೂಪದ ಚಿನ್ನ' (Liquid Gold) ಎಂದು ಯಾವುದಕ್ಕೆ ಕರೆಯಲಾಗುತ್ತದೆ?", options: ["ಪೆಟ್ರೋಲಿಯಂ", "ನೀರು", "ಹಾಲಿನ ಉತ್ಪನ್ನ", "ಕಚ್ಚಾ ಎಣ್ಣೆ"], answer: 0, exp: "ಆರ್ಥಿಕ ಮೌಲ್ಯದಿಂದಾಗಿ ಪೆಟ್ರೋಲಿಯಂ ಅನ್ನು ದ್ರವರೂಪದ ಚಿನ್ನ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 188, question: "ಮಸಾಲೆ ಪದಾರ್ಥಗಳಲ್ಲಿ 'ಕೆಂಪು ಚಿನ್ನ' (Red Gold) ಎಂದು ಯಾವುದನ್ನು ಕರೆಯುತ್ತಾರೆ?", options: ["ಕೇಸರಿ (Saffron)", "ಬ್ಯಾಡಗಿ ಮೆಣಸಿನಕಾಯಿ", "ಏಲಕ್ಕಿ", "ಲವಂಗ"], answer: 0, exp: "ಅತ್ಯಂತ ದುಬಾರಿ ಮಸಾಲೆ ವಸ್ತುವಾದ ಕೇಸರಿಯನ್ನು ಕೆಂಪು ಚಿನ್ನ ಎನ್ನಲಾಗುತ್ತದೆ." },
            { id: 189, question: "ಸಾಮಾನ್ಯವಾಗಿ 'ಕಾಗೆ ಬಂಗಾರ' ಎಂದು ಕರೆಯಲ್ಪಡುವ ಖನಿಜ ಯಾವುದು?", options: ["ಅಭ್ರಕ (Mica)", "ಪೈರೈಟ್", "ಬಾಕ್ಸೈಟ್", "ಸುಣ್ಣದ ಕಲ್ಲು"], answer: 0, exp: "ಹೊಳೆಯುವ ಅಭ್ರಕ (Mica) ಖನಿಜವನ್ನು ಕಾಗೆ ಬಂಗಾರ ಎನ್ನಲಾಗುತ್ತದೆ." },

            { id: 200, question: "ರಾಯಚೂರಿನ ಹಟ್ಟಿ ಚಿನ್ನದ ಗಣಿಯ ವಿಶೇಷತೆಯೇನು?", options: ["ಪ್ರಸ್ತುತ ಭಾರತದಲ್ಲಿ ಕಾರ್ಯಾಚರಣೆಯಲ್ಲಿರುವ ಪ್ರಮುಖ ಸಕ್ರಿಯ ಚಿನ್ನದ ಗಣಿ", "ಆಳವಾದ ಕಲ್ಲಿದ್ದಲು ಗಣಿ", "ಹಿತ್ತಾಳೆ ಗಣಿ", "ಬೆಳ್ಳಿ ಗಣಿ"], answer: 0, exp: "ಹಟ್ಟಿ ಚಿನ್ನದ ಗಣಿಯು ಭಾರತದ ಇಂದಿಗೂ ಸಕ್ರಿಯವಾಗಿ ಚಿನ್ನ ತೆಗೆಯುವ ಪ್ರಮುಖ ಗಣಿಯಾಗಿದೆ." }
        ];

        // State variables
        let currentQuestions = [...masterQuestions];
        let currentIndex = 0;
        let userAnswers = {}; // Map of question ID -> selected option index
        let timerInterval = null;
        let timeRemaining = 3600; // 60 minutes
        let wrongTestCounter = 0;

        // Initialize Test
        function initTest() {
            renderPalette();
            loadQuestion(0);
            startTimer();
        }

        // Timer
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Time's Up!");
                    return;
                }
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                document.getElementById("timerDisplay").innerText = 
                    `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // Load Question
        function loadQuestion(index) {
            currentIndex = index;
            const q = currentQuestions[currentIndex];

            // Set Title with Preserved Original Global ID
            document.getElementById("questionTitle").innerText = `Q${q.id}. ${q.question}`;

            // Render Options
            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            const hasAnswered = userAnswers.hasOwnProperty(q.id);
            const selectedOpt = userAnswers[q.id];

            q.options.forEach((optText, i) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = `${String.fromCharCode(65 + i)}. ${optText}`;

                if (hasAnswered) {
                    btn.disabled = true;
                    if (i === q.answer) {
                        btn.classList.add("correct");
                    }
                    if (i === selectedOpt && selectedOpt !== q.answer) {
                        btn.classList.add("wrong");
                    }
                } else {
                    btn.onclick = () => handleAnswer(q.id, i);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation
            const expBox = document.getElementById("explanationBox");
            if (hasAnswered) {
                expBox.style.display = "block";
                expBox.innerHTML = `<strong>ವಿವರಣೆ (Explanation):</strong> ${q.exp}`;
            } else {
                expBox.style.display = "none";
            }

            // Update Navigation Buttons
            document.getElementById("prevBtn").disabled = (currentIndex === 0);
            document.getElementById("nextBtn").disabled = (currentIndex === currentQuestions.length - 1);

            updatePaletteHighlights();
        }

        // Answer Option Handling
        function handleAnswer(qId, selectedIndex) {
            userAnswers[qId] = selectedIndex;
            calculateScore();
            loadQuestion(currentIndex);
            renderPalette();
        }

        // Navigation
        function navigate(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < currentQuestions.length) {
                loadQuestion(newIndex);
            }
        }

        // Render Palette Buttons (Preserves original global Q Numbers)
        function renderPalette() {
            const grid = document.getElementById("paletteGrid");
            grid.innerHTML = "";

            currentQuestions.forEach((q, idx) => {
                const btn = document.createElement("button");
                btn.className = "p-btn";
                btn.innerText = q.id; // PRESERVE ORIGINAL GLOBAL ID

                if (userAnswers.hasOwnProperty(q.id)) {
                    if (userAnswers[q.id] === q.answer) {
                        btn.classList.add("correct");
                    } else {
                        btn.classList.add("wrong");
                    }
                }

                if (idx === currentIndex) {
                    btn.classList.add("active");
                }

                btn.onclick = () => loadQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function updatePaletteHighlights() {
            const buttons = document.querySelectorAll(".p-btn");
            buttons.forEach((btn, idx) => {
                if (idx === currentIndex) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
        }

        // Calculate and Update Score
        function calculateScore() {
            let score = 0;
            Object.keys(userAnswers).forEach(qId => {
                const q = masterQuestions.find(item => item.id == qId);
                if (q && userAnswers[qId] === q.answer) {
                    score++;
                }
            });
            document.getElementById("scoreDisplay").innerText = `Score: ${score}`;
        }

        // Functional Requirement 4: Retest (ಮರುಪರೀಕ್ಷೆ)
        function resetFullTest() {
            currentQuestions = [...masterQuestions];
            userAnswers = {};
            currentIndex = 0;
            wrongTestCounter = 0;
            timeRemaining = 3600;

            document.getElementById("testHeaderTitle").innerText = "CBT Mock Test";
            calculateScore();
            renderPalette();
            loadQuestion(0);
            startTimer();
        }

        // Functional Requirement 5: Test Wrong Answers Button
        function startWrongAnswersTest() {
            // Find incorrectly answered questions from active session
            const wrongQuestions = currentQuestions.filter(q => {
                return userAnswers.hasOwnProperty(q.id) && userAnswers[q.id] !== q.answer;
            });

            if (wrongQuestions.length === 0) {
                alert("ಸಾಧನೆ ಅದ್ಭುತವಾಗಿದೆ! ಯಾವುದೇ ತಪ್ಪಾದ ಉತ್ತರಗಳಿಲ್ಲ. (No wrong answers found!)");
                return;
            }

            // Filter wrong questions
            currentQuestions = wrongQuestions;

            // Clear answers for those specific questions
            currentQuestions.forEach(q => {
                delete userAnswers[q.id];
            });

            wrongTestCounter++;
            document.getElementById("testHeaderTitle").innerText = `Wrong Test-${wrongTestCounter}`;

            currentIndex = 0;
            calculateScore();
            renderPalette();
            loadQuestion(0);
        }

        // Run Application
        window.onload = initTest;
    </script>
