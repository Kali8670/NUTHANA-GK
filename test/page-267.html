<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; color: #333; }
    
    /* Header */
    .header { background-color: #003366; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .timer-box { background-color: white; color: #d9534f; padding: 4px 10px; font-weight: bold; border-radius: 4px; font-size: 14px; border: 1px solid #d9534f; }
    
    /* Layout */
    .container { display: flex; flex-direction: row; height: calc(100vh - 45px); }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; background-color: #fff; }
    .sidebar { width: 320px; background-color: #f8f9fa; border-left: 1px solid #dee2e6; padding: 15px; overflow-y: auto; }

    .sub-header { font-size: 12px; color: #004085; font-weight: bold; border-bottom: 1px solid #cce5ff; padding-bottom: 5px; margin-bottom: 15px; }

    /* Question & Options */
    .question-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #222; line-height: 1.4; }
    .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-btn { display: flex; align-items: center; padding: 10px 15px; border: 1px solid #ced4da; border-radius: 6px; background-color: #fff; cursor: pointer; text-align: left; font-size: 14px; transition: 0.2s; }
    .option-btn:hover { background-color: #e9ecef; }
    
    /* Answer States */
    .option-btn.correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
    .option-btn.wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

    /* Explanation Box */
    .explanation-box { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-top: 15px; display: none; white-space: pre-line; }
    .explanation-box.correct-bg { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
    
    /* Controls */
    .controls { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 10px; border-top: 1px solid #eee; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-nav { background-color: #0056b3; color: white; }
    .btn-retest { background-color: #dc3545; color: white; }

    /* Sidebar Styling */
    .sidebar-title { font-size: 14px; text-align: center; margin-bottom: 5px; font-weight: bold; }
    .score-board { text-align: center; font-size: 13px; margin-bottom: 15px; color: #555; }
    .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .palette-btn { padding: 8px 0; background-color: #fff; border: 1px solid #ced4da; border-radius: 4px; text-align: center; font-size: 12px; cursor: pointer; font-weight: bold; }
    .palette-btn.active { border: 2px solid #0056b3; }
    .palette-btn.answered-correct { background-color: #28a745; color: white; border-color: #28a745; }
    .palette-btn.answered-wrong { background-color: #dc3545; color: white; border-color: #dc3545; }

    @media (max-width: 768px) {
        .container { flex-direction: column; }
        .sidebar { width: 100%; height: auto; border-left: none; border-top: 1px solid #ccc; }
    }

<script>
const quizData = [
    { q: "1. ಗೌತಮ ಬುದ್ಧನನ್ನು 'ಏಷ್ಯಾದ ಬೆಳಕು' (Light of Asia) ಎಂದು ಕರೆದವರು ಯಾರು?", options: ["A) ಶ್ರೀಮತಿ ರೈಸ್ ಡೇವಿಡ್ಸ್", "B) ಸರ್ ಎಡ್ವಿನ್ ಆರ್ನಾಲ್ಡ್", "C) ಮ್ಯಾಕ್ಸ್ ಮುಲ್ಲರ್", "D) ಲಾರ್ಡ್ ಕರ್ಜನ್"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಸರ್ ಎಡ್ವಿನ್ ಆರ್ನಾಲ್ಡ್.\nಬುದ್ಧನನ್ನು 'ಏಷ್ಯಾದ ಬೆಳಕು' ಎಂದು ಸರ್ ಎಡ್ವಿನ್ ಆರ್ನಾಲ್ಡ್ ಕರೆದರು." },
    { q: "2. ಬುದ್ಧನನ್ನು 'ಜಗತ್ತಿನ ಜ್ಞಾನ ಪ್ರದೀಪ' ಎಂದು ಕರೆದವರು ಯಾರು?", options: ["A) ಸರ್ ಎಡ್ವಿನ್ ಆರ್ನಾಲ್ಡ್", "B) ಶ್ರೀಮತಿ ರೈಸ್ ಡೇವಿಡ್ಸ್", "C) ಚಾರ್ಲ್ಸ್ ಮಸನ್", "D) ಜಾನ್ ಮಾರ್ಷಲ್"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಶ್ರೀಮತಿ ರೈಸ್ ಡೇವಿಡ್ಸ್.\nಬುದ್ಧನನ್ನು ಜಗತ್ತಿನ ಜ್ಞಾನ ಪ್ರದೀಪ ಎಂದು ಶ್ರೀಮತಿ ರೈಸ್ ಡೇವಿಡ್ಸ್ ಕರೆದರು." },
    { q: "3. 'ತಿದ್ದಲಾಗದ ಹೃದಯ ತಿದ್ದಿದ ಮಹಾನುಭಾವ' ಎಂದು ಯಾರನ್ನು ಕರೆಯುತ್ತಾರೆ?", options: ["A) ಮಹಾವೀರ", "B) ಗೌತಮ ಬುದ್ಧ", "C) ಶಂಕರಾಚಾರ್ಯ", "D) ಬಸವಣ್ಣ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಗೌತಮ ಬುದ್ಧ.\nಬುದ್ಧನನ್ನು ತಿದ್ದಲಾಗದ ಹೃದಯ ತಿದ್ದಿದ ಮಹಾನುಭಾವ ಎಂದು ಕರೆಯುತ್ತಾರೆ." },
    { q: "4. ಗೌತಮ ಬುದ್ಧನು ಜನಿಸಿದ 'ಲುಂಬಿನಿ' ಗ್ರಾಮವು ಪ್ರಸ್ತುತ ಯಾವ ದೇಶದಲ್ಲಿದೆ?", options: ["A) ಭಾರತ", "B) ನೇಪಾಳ", "C) ಭೂತಾನ್", "D) ಶ್ರೀಲಂಕಾ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ನೇಪಾಳ.\nಬುದ್ಧನು ನೇಪಾಳದ ಕಪಿಲವಸ್ತುವಿನ ಲುಂಬಿನಿ ಗ್ರಾಮದಲ್ಲಿ ಜನಿಸಿದನು." },
    { q: "5. ಗೌತಮ ಬುದ್ಧನ ತಂದೆ, ತಾಯಿ ಮತ್ತು ಸಾಕುತಾಯಿಯ ಹೆಸರುಗಳನ್ನು ಸರಿಯಾಗಿ ಗುರುತಿಸಿ:", options: ["A) ಶುದ್ಧೋದನ, ಮಾಯಾದೇವಿ, ಪ್ರಜಾಪತಿ ಗೌತಮಿ", "B) ಸಿದ್ಧಾರ್ಥ, ಯಶೋಧರೆ, ಗೌತಮಿ", "C) ಬಿಂಬಿಸಾರ, ತ್ರಿಶಲಾ, ಮಾಯಾದೇವಿ", "D) ಶುದ್ಧೋದನ, ಯಶೋಧರೆ, ಸುಭದ್ರಾ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಶುದ್ಧೋದನ, ಮಾಯಾದೇವಿ, ಪ್ರಜಾಪತಿ ಗೌತಮಿ.\nತಂದೆ: ಶುದ್ಧೋದನ, ತಾಯಿ: ಮಾಯಾದೇವಿ, ಸಾಕುತಾಯಿ: ಪ್ರಜಾಪತಿ ಗೌತಮಿ." },
    { q: "6. ಗೌತಮ ಬುದ್ಧನ ಮೂಲ ಹೆಸರು, ಪಂಗಡ ಮತ್ತು ಮಗನ ಹೆಸರು ಏನು?", options: ["A) ಬರ್ಧಮಾನ, ಜಾತ್ರಿಕ, ರಾಹುಲ", "B) ಸಿದ್ಧಾರ್ಥ, ಶಾಕ್ಯ, ರಾಹುಲ", "C) ಸಿದ್ಧಾರ್ಥ, ಮಲ್ಲ, ಚೆನ್ನ", "D) ಗೌತಮ, ಕುರು, ಆನಂದ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಸಿದ್ಧಾರ್ಥ, ಶಾಕ್ಯ, ರಾಹುಲ.\nಮೂಲ ಹೆಸರು: ಸಿದ್ಧಾರ್ಥ, ಪಂಗಡ: ಶಾಕ್ಯ ಪಂಗಡ, ಮಗ: ರಾಹುಲ." },
    { q: "7. ಸಿದ್ಧಾರ್ಥನ ಭವಿಷ್ಯ ನುಡಿದ ನೇಪಾಳದ ಸನ್ಯಾಸಿ ಯಾರು?", options: ["A) ಆಲಾರಕಲಾಮ", "B) ಅಸ್ಮಿತ", "C) ಉದ್ದಕರಾಮ", "D) ಸುಭದ್ರ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಅಸ್ಮಿತ.\nಬುದ್ಧನ ಭವಿಷ್ಯ ನುಡಿದ ನೇಪಾಳದ ಸನ್ಯಾಸಿ ಅಸ್ಮಿತ." },
    { q: "8. ಸಿದ್ಧಾರ್ಥನು ಸನ್ಯಾಸಿಯಾಗಲು ಕಾರಣವಾದ ನಾಲ್ಕು ದೃಶ್ಯಗಳನ್ನು (ಮಹಾದರ್ಶನಗಳು) ಕ್ರಮವಾಗಿ ಗುರುತಿಸಿ:", options: ["A) ಶವ, ರೋಗಿ, ವೃದ್ಧ, ಸನ್ಯಾಸಿ", "B) ವೃದ್ಧ, ರೋಗಿ, ಶವ, ಸನ್ಯಾಸಿ", "C) ರೋಗಿ, ವೃದ್ಧ, ಸನ್ಯಾಸಿ, ಶವ", "D) ಸನ್ಯಾಸಿ, ಶವ, ರೋಗಿ, ವೃದ್ಧ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ವೃದ್ಧ, ರೋಗಿ, ಶವ, ಸನ್ಯಾಸಿ.\nಈ ನಾಲ್ಕು ದೃಶ್ಯಗಳನ್ನು ಮಹಾದರ್ಶನಗಳೆಂದು ಕರೆಯುತ್ತಾರೆ." },
    { q: "9. ಸಿದ್ಧಾರ್ಥನು ಎಷ್ಟನೇ ವಯಸ್ಸಿನಲ್ಲಿ ಅರಮನೆಯನ್ನು ತ್ಯಜಿಸಿದನು ಮತ್ತು ಈ ಘಟನೆಯನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["A) 25ನೇ ವಯಸ್ಸು - ಧರ್ಮಚಕ್ರ ಪರಿವರ್ತನ", "B) 29ನೇ ವಯಸ್ಸು - ಮಹಾ ಪರಿತ್ಯಾಗ", "C) 35ನೇ ವಯಸ್ಸು - ಮಹಾಪರಿ ನಿರ್ವಾಣ", "D) 40ನೇ ವಯಸ್ಸು - ಕೇವಲ್ಯ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) 29ನೇ ವಯಸ್ಸು - ಮಹಾ ಪರಿತ್ಯಾಗ.\n29ನೇ ವಯಸ್ಸಿನಲ್ಲಿ ಅರಮನೆಯನ್ನು ತ್ಯಜಿಸಿದ್ದನ್ನು 'ಮಹಾ ಪರಿತ್ಯಾಗ' ಎನ್ನುತ್ತಾರೆ." },
    { q: "10. ಸಿದ್ಧಾರ್ಥನ ಮೊದಲ ಮತ್ತು ಎರಡನೆಯ ಗುರುಗಳು ಕ್ರಮವಾಗಿ ಯಾರು?", options: ["A) ಅಸ್ಮಿತ ಮತ್ತು ಆಲಾರಕಲಾಮ", "B) ಆಲಾರಕಲಾಮ ಮತ್ತು ಉದ್ದಕರಾಮ ಪುತ್ತ", "C) ಉದ್ದಕರಾಮ ಪುತ್ತ ಮತ್ತು ಕೊಂಡಣ್ಣ", "D) ಆನಂದ ಮತ್ತು ದೇವದತ್ತ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಆಲಾರಕಲಾಮ ಮತ್ತು ಉದ್ದಕರಾಮ ಪುತ್ತ.\nಮೊದಲ ಗುರು: ಆಲಾರಕಲಾಮ, ಎರಡನೆಯ ಗುರು: ಉದ್ದಕರಾಮ ಪುತ್ತ." },
    { q: "11. ಸಿದ್ಧಾರ್ಥನು 35ನೇ ವಯಸ್ಸಿನಲ್ಲಿ ಬಿಹಾರದ ಗಯಾದಲ್ಲಿ ಯಾವ ನದಿಯ ದಂಡೆಯ ಮೇಲಿನ ಅರಳಿ ಮರದ ಕೆಳಗೆ ಜ್ಞಾನೋದಯ ಪಡೆದನು?", options: ["A) ಗಂಗಾ ನದಿ", "B) ನಿರಂಜನ ನದಿ", "C) ಯಮುನಾ ನದಿ", "D) ಸರಯೂ ನದಿ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ನಿರಂಜನ ನದಿ.\nನಿರಂಜನ ನದಿಯ ದಂಡೆಯ ಮೇಲಿನ ಅರಳಿ ಮರದ ಕೆಳಗೆ ತಪಸ್ಸಿಗೆ ಕುಳಿತು 47ನೇ ದಿನಕ್ಕೆ ಜ್ಞಾನೋದಯ ಹೊಂದಿದನು. 'ಬುದ್ಧ' ಎಂದರೆ ಎಲ್ಲವನ್ನೂ ತಿಳಿದವ ಎಂದರ್ಥ." },
    { q: "12. ಬುದ್ಧನು ತನ್ನ ಪ್ರಥಮ ಉಪದೇಶವನ್ನು ಸಾರನಾಥದ ಜಿಂಕೆ ವನದಲ್ಲಿ ಎಷ್ಟು ಜನ ಶಿಷ್ಯರಿಗೆ ನೀಡಿದನು ಮತ್ತು ಈ ಘಟನೆಯ ಹೆಸರೇನು?", options: ["A) 4 ಜನ ಶಿಷ್ಯರು - ಮಹಾಪರಿನಿರ್ವಾಣ", "B) 5 ಜನ ಶಿಷ್ಯರು - ಧರ್ಮಚಕ್ರ ಪರಿವರ್ತನ", "C) 10 ಜನ ಶಿಷ್ಯರು - ಮಹಾಪರಿತ್ಯಾಗ", "D) 12 ಜನ ಶಿಷ್ಯರು - ಸಮ್ಮೇಳನ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) 5 ಜನ ಶಿಷ್ಯರು - ಧರ್ಮಚಕ್ರ ಪರಿವರ್ತನ.\nಕೊಂಡಣ್ಣ, ಯಪ್ಪು, ಅಸ್ಸಾಜಿ, ಭಪ್ಪಾಜಿ, ಮಹಾನಾಮ ಎಂಬ 5 ಶಿಷ್ಯರಿಗೆ ನೀಡಿದ ಉಪದೇಶವೇ ಧರ್ಮಚಕ್ರ ಪರಿವರ್ತನ." },
    { q: "13. ಬುದ್ಧನ ಚಿಕ್ಕಪ್ಪನ ಮಕ್ಕಳ ಹೆಸರುಗಳು ಯಾವುವು?", options: ["A) ಕೊಂಡಣ್ಣ ಮತ್ತು ಅಸ್ಸಾಜಿ", "B) ಆನಂದ ಮತ್ತು ದೇವದತ್ತ", "C) ಚೆನ್ನ ಮತ್ತು ಅಸ್ಮಿತ", "D) ಸುಭದ್ರ ಮತ್ತು ಚಂದ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಆನಂದ ಮತ್ತು ದೇವದತ್ತ.\nಬುದ್ಧನ ಚಿಕ್ಕಪ್ಪನ ಮಕ್ಕಳು ಆನಂದ ಮತ್ತು ದೇವದತ್ತ." },
    { q: "14. ಕ್ರಿ.ಮೂ. 483 ರಲ್ಲಿ ಗೌತಮ ಬುದ್ಧನು ಯು.ಪಿ.ಯ ಕುಶಿನಗರದಲ್ಲಿ ಮರಣ ಹೊಂದಿದ ಘಟನೆಯನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["A) ಧರ್ಮಚಕ್ರ ಪರಿವರ್ತನ", "B) ಮಹಾಪರಿ ನಿರ್ವಾಣ", "C) ಮಹಾ ಪರಿತ್ಯಾಗ", "D) ಚೈತ್ಯಾಲಯ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಮಹಾಪರಿ ನಿರ್ವಾಣ.\nಕುಶಿನಗರದಲ್ಲಿ ಬುದ್ಧ ಮರಣ ಹೊಂದಿದ್ದನ್ನು 'ಮಹಾಪರಿ ನಿರ್ವಾಣ' ಎನ್ನುತ್ತಾರೆ." },
    { q: "15. ಬುದ್ಧನ ಬೋಧನೆಗಳ ಪ್ರಕಾರ ಆಸೆಯನ್ನು ತೊರೆಯಲು ಯಾವುದನ್ನು ಅನುಸರಿಸಬೇಕು?", options: ["A) ತ್ರಿರತ್ನಗಳು", "B) ಅಷ್ಟಾಂಗ ಮಾರ್ಗಗಳು", "C) ಪಂಚಶೀಲಗಳು", "D) ದಶ ನಿಯಮಗಳು"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಅಷ್ಟಾಂಗ ಮಾರ್ಗಗಳು.\nಆಸೆಯನ್ನು ತೊರೆಯಲು ಅಷ್ಟಾಂಗ ಮಾರ್ಗಗಳನ್ನು ಅನುಸರಿಸಬೇಕು." },
    { q: "16. ಹೀನಾಯಾನ ಪಂಥದವರ ಪ್ರಮುಖ ಭಾಷೆ ಮತ್ತು ಬುದ್ಧನ ಬಗ್ಗೆ ಅವರ ಅಭಿಪ್ರಾಯವೇನು?", options: ["A) ಸಂಸ್ಕೃತ - ಬುದ್ಧನನ್ನು ದೇವರೆಂದರು", "B) ಪಾಲೀ - ಬುದ್ಧನನ್ನು ಶ್ರೇಷ್ಠ ವ್ಯಕ್ತಿ ಎಂದರು", "C) ಪ್ರಾಕೃತ - ಬುದ್ಧನನ್ನು ರಾಜ ಎಂದರು", "D) ಕನ್ನಡ - ಬುದ್ಧನನ್ನು ಗುರು ಎಂದರು"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಪಾಲೀ - ಬುದ್ಧನನ್ನು ಶ್ರೇಷ್ಠ ವ್ಯಕ್ತಿ ಎಂದರು.\nಹೀನಾಯಾನದ ಭಾಷೆ ಪಾಲೀ, ಇವರು ಬುದ್ಧನನ್ನು ಶ್ರೇಷ್ಠ ವ್ಯಕ್ತಿ ಎಂದರು." },
    { q: "17. ಮಹಾಯಾನ ಪಂಥದವರ ಭಾಷೆ ಮತ್ತು ಅವರ ಪೂಜಾ ವಿಧಾನ ಯಾವುದು?", options: ["A) ಪಾಲೀ - ಸಾಂಕೇತಿಕ ಪೂಜೆ", "B) ಸಂಸ್ಕೃತ - ಮೂರ್ತಿ ರೂಪದಲ್ಲಿ ಪೂಜೆ", "C) ಅರ್ಧಮಾಗಧಿ - ಪ್ರಕೃತಿ ಪೂಜೆ", "D) ತಮಿಳು - ಅಗ್ನಿ ಪೂಜೆ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಸಂಸ್ಕೃತ - ಮೂರ್ತಿ ರೂಪದಲ್ಲಿ ಪೂಜೆ.\nಮಹಾಯಾನದ ಭಾಷೆ ಸಂಸ್ಕೃತ. ಇವರು ಬುದ್ಧನನ್ನು ಮೂರ್ತಿ ರೂಪದಲ್ಲಿ ಪೂಜಿಸಿದರು." },
    { q: "18. ಹೀನಾಯಾನ ಮತ್ತು ಮಹಾಯಾನ ಎರಡೂ ಪಂಥದವರ ತತ್ವಗಳನ್ನು ಅನುಸರಿಸುವ ಪಂಥ ಯಾವುದು?", options: ["A) ವಜ್ರಾಯಾನ", "B) ಝೆನ್", "C) ಥೇರವಾದ", "D) ತಂತ್ರಯಾನ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ವಜ್ರಾಯಾನ.\nವಜ್ರಾಯಾನ ಪಂಥದವರು ಹೀನಾಯಾನ ಮತ್ತು ಮಹಾಯಾನ ಎರಡೂ ತತ್ವಗಳನ್ನು ಅನುಸರಿಸುತ್ತಾರೆ." },
    { q: "19. ಬೌದ್ಧಧರ್ಮದ ನಿಯಮಗಳನ್ನು ಒಳಗೊಂಡಿರುವ 'ತ್ರಿಪಿಟಕ'ದ ಭಾಗ ಯಾವುದು?", options: ["A) ಸುತ್ತ ಪಿಟಕ", "B) ವಿನಯ ಪಿಟಕ", "C) ಅಭಿಧಮ್ಮ ಪಿಟಕ", "D) ಮಹಾವಸ್ತು"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ವಿನಯ ಪಿಟಕ.\nವಿನಯ ಪಿಟಕ: ಧರ್ಮದ ನಿಯಮಗಳು, ಸುತ್ತ ಪಿಟಕ: ಬುದ್ಧನ ಬೋಧನೆಗಳು, ಅಭಿಧಮ್ಮ ಪಿಟಕ: ಸನ್ಯಾಸಿಗಳ ಸಾಮಾನ್ಯ ನಿಯಮಗಳು." },
    { q: "20. ಬುದ್ಧನ ಜೀವನ ಮತ್ತು ಬೋಧನೆಗಳನ್ನು ಒಳಗೊಂಡಿರುವ ಪಿಟಕ ಯಾವುದು?", options: ["A) ವಿನಯ ಪಿಟಕ", "B) ಸುತ್ತ ಪಿಟಕ", "C) ಅಭಿಧಮ್ಮ ಪಿಟಕ", "D) ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಸುತ್ತ ಪಿಟಕ.\nಸುತ್ತ ಪಿಟಕವು ಬುದ್ಧನ ಜೀವನ ಮತ್ತು ಬೋಧನೆಗಳನ್ನು ಒಳಗೊಂಡಿದೆ." },
    { q: "21. ಬೌದ್ಧ ಸನ್ಯಾಸಿಗಳ ಸಾಮಾನ್ಯ ನಿಯಮಗಳನ್ನು ಒಳಗೊಂಡಿರುವ ಪಿಟಕ ಯಾವುದು?", options: ["A) ವಿನಯ ಪಿಟಕ", "B) ಸುತ್ತ ಪಿಟಕ", "C) ಅಭಿಧಮ್ಮ ಪಿಟಕ", "D) ಲಲಿತ ವಿಸ್ತಾರ"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) ಅಭಿಧಮ್ಮ ಪಿಟಕ.\nಅಭಿಧಮ್ಮ ಪಿಟಕವು ಬೌದ್ಧ ಸನ್ಯಾಸಿಗಳ ಸಾಮಾನ್ಯ ನಿಯಮಗಳನ್ನು ಒಳಗೊಂಡಿದೆ." },
    { q: "22. 1ನೇ ಬೌದ್ಧ ಸಮ್ಮೇಳನದ ಸ್ಥಳ, ಅಧ್ಯಕ್ಷ ಮತ್ತು ಅರಸನನ್ನು ಸರಿಯಾಗಿ ಜೋಡಿಸಿ:", options: ["A) ರಾಜಗೃಹ - ಮಹಾಕಶ್ಯಪ - ಅಜಾತಶತ್ರು (ಕ್ರಿ.ಮೂ. 483)", "B) ವೈಶಾಲಿ - ಸಭಾಕಾಮಿ - ಕಾಲಾಶೋಕ", "C) ಪಾಟಲೀಪುತ್ರ - ತಿಸ್ಸಾ - ಅಶೋಕ", "D) ಕುಂಡಲವನ - ವಸುಮಿತ್ರ - ಕನಿಷ್ಠ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ರಾಜಗೃಹ - ಮಹಾಕಶ್ಯಪ - ಅಜಾತಶತ್ರು (ಕ್ರಿ.ಮೂ. 483)." },
    { q: "23. 2ನೇ ಬೌದ್ಧ ಸಮ್ಮೇಳನ ನಡೆದ ಸ್ಥಳ, ಅಧ್ಯಕ್ಷ ಮತ್ತು ಅರಸ ಯಾರು?", options: ["A) ವೈಶಾಲಿ - ಸಭಾಕಾಮಿ - ಕಾಲಾಶೋಕ (ಕ್ರಿ.ಮೂ. 383)", "B) ರಾಜಗೃಹ - ಮಹಾಕಶ್ಯಪ - ಅಜಾತಶತ್ರು", "C) ಪಾಟಲೀಪುತ್ರ - ತಿಸ್ಸಾ - ಅಶೋಕ", "D) ಕುಂಡಲವನ - ವಸುಮಿತ್ರ - ಕನಿಷ್ಠ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ವೈಶಾಲಿ - ಸಭಾಕಾಮಿ - ಕಾಲಾಶೋಕ (ಕ್ರಿ.ಮೂ. 383)." },
    { q: "24. 3ನೇ ಬೌದ್ಧ ಸಮ್ಮೇಳನ ನಡೆದ ಸ್ಥಳ, ಅಧ್ಯಕ್ಷ ಮತ್ತು ಅರಸ ಯಾರು?", options: ["A) ಪಾಟಲೀಪುತ್ರ - ತಿಸ್ಸಾ ಮೊಗ್ಗಲಿಪುತ್ತ - ಅಶೋಕ (ಕ್ರಿ.ಮೂ. 250)", "B) ವೈಶಾಲಿ - ಸಭಾಕಾಮಿ - ಕಾಲಾಶೋಕ", "C) ಕುಂಡಲವನ - ವಸುಮಿತ್ರ - ಕನಿಷ್ಠ", "D) ರಾಜಗೃಹ - ಮಹಾಕಶ್ಯಪ - ಅಜಾತಶತ್ರು"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಪಾಟಲೀಪುತ್ರ - ತಿಸ್ಸಾ ಮೊಗ್ಗಲಿಪುತ್ತ - ಅಶೋಕ (ಕ್ರಿ.ಮೂ. 250)." },
    { q: "25. 4ನೇ ಬೌದ್ಧ ಸಮ್ಮೇಳನದ ಸ್ಥಳ, ಅಧ್ಯಕ್ಷ, ಉಪಾಧ್ಯಕ್ಷ ಮತ್ತು ಅರಸ ಯಾರು?", options: ["A) ಕುಂಡಲವನ - ವಸುಮಿತ್ರ (ಅಧ್ಯಕ್ಷ) - ಅಶ್ವಘೋಷ (ಉಪಾಧ್ಯಕ್ಷ) - ಕನಿಷ್ಠ (ಕ್ರಿ.ಶ. 100/102)", "B) ಪಾಟಲೀಪುತ್ರ - ತಿಸ್ಸಾ - ಅಶೋಕ", "C) വൈಶಾಲಿ - ಸಭಾಕಾಮಿ - ಕಾಲಾಶೋಕ", "D) ರಾಜಗೃಹ - ಮಹಾಕಶ್ಯಪ - ಅಜಾತಶತ್ರು"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಕುಂಡಲವನ - ವಸುಮಿತ್ರ (ಅಧ್ಯಕ್ಷ) - ಅಶ್ವಘೋಷ (ಉಪಾಧ್ಯಕ್ಷ) - ಕನಿಷ್ಠ (ಕ್ರಿ.ಶ. 100/102)." },
    { q: "26. ಬುದ್ಧನ ಜೀವನದ ಘಟನೆಗಳು ಮತ್ತು ಸಾಂಕೇತಿಕ ಚಿಹ್ನೆಗಳನ್ನು ಸರಿಯಾಗಿ ಹೊಂದಿಸಿ:\n1. ಜನನ - A) ಕಮಲ\n2. ಮನೆ ತೊರೆದಿದ್ದು - B) ಕುದುರೆ\n3. ತಪಸ್ಸು - C) ಬೋಧಿ ವೃಕ್ಷ\n4. ಪ್ರಥಮ ಉಪದೇಶ - D) ಧರ್ಮ ಚಕ್ರ (8 ಕಡ್ಡಿಗಳು)\n5. ಮರಣ - E) ಸ್ತೂಪಗಳು", options: ["A) 1-A, 2-B, 3-C, 4-D, 5-E", "B) 1-B, 2-A, 3-D, 4-C, 5-E", "C) 1-C, 2-D, 3-A, 4-B, 5-E", "D) 1-E, 2-C, 3-B, 4-A, 5-D"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) 1-A, 2-B, 3-C, 4-D, 5-E." },
    { q: "27. ಬುದ್ಧನ ಮೊದಲ ಶಿಷ್ಯ ಮತ್ತು ಸೇವಕ ಕ್ರಮವಾಗಿ ಯಾರು?", options: ["A) ಆನಂದ ಮತ್ತು ಚೆನ್ನ", "B) ಚೆನ್ನ ಮತ್ತು ಆನಂದ", "C) ಸಿದ್ಧಾರ್ಥ ಮತ್ತು ಅಸ್ಮಿತ", "D) ಅನಾಥ ಪಿಂಡಕ ಮತ್ತು ಸುಜಾತ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಆನಂದ ಮತ್ತು ಚೆನ್ನ.\nಮೊದಲ ಶಿಷ್ಯ: ಆನಂದ, ಸೇವಕ: ಚೆನ್ನ." },
    { q: "28. ಬುದ್ಧನ ಕುದುರೆಯ ಹೆಸರೇನು?", options: ["A) ಚೇತಕ್", "B) ಕಂಥಕ", "C) ಹೈಗ್ರೀವ", "D) ರಾಮಚಂದ್ರ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಕಂಥಕ.\nಬುದ್ಧನ ಕುದುರೆಯ ಹೆಸರು ಕಂಥಕ." },
    { q: "29. ಬುದ್ಧನಿಂದ ಪರಿವರ್ತನೆಯಾದ ಪ್ರಸಿದ್ಧ ಕಳ್ಳ ಯಾರು?", options: ["A) ಅಂಗುಲೀಮಾಲ", "B) ರತ್ನಾಕರ", "C) ಕಾಯಂದ", "D) ಚಂದ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಅಂಗುಲೀಮಾಲ.\nಬುದ್ಧನಿಂದ ಪರಿವರ್ತನೆಯಾದ ಕಳ್ಳ ಅಂಗುಲೀಮಾಲ." },
    { q: "30. ಬುದ್ಧನಿಂದ ಪರಿವರ್ತನೆಯಾದ ವೇಶ್ಯ ಯಾರು?", options: ["A) ಅಮ್ರಪಾಲಿ", "B) ವಸಂತಸೇನಾ", "C) ವಿಶಾಖಿ", "D) ಸುಜಾತ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಅಮ್ರಪಾಲಿ.\nಬುದ್ಧನಿಂದ ಪರಿವರ್ತನೆಯಾದ ವೇಶ್ಯ ಅಮ್ರಪಾಲಿ." },
    { q: "31. ಬುದ್ಧನ ಪ್ರಸಿದ್ಧ ಶಿಷ್ಯ ಮತ್ತು ಶಿಷ್ಯೆ ಕ್ರಮವಾಗಿ ಯಾರು?", options: ["A) ಅನಾಥ ಪಿಂಡಕ ಮತ್ತು ವಿಶಾಖಿ", "B) ಆನಂದ ಮತ್ತು ಸುಜಾತ", "C) ಸುಭದ್ರ ಮತ್ತು ಅಮ್ರಪಾಲಿ", "D) ಜೀವಕ ಮತ್ತು ಗೌತಮಿ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಅನಾಥ ಪಿಂಡಕ ಮತ್ತು ವಿಶಾಖಿ.\nಪ್ರಸಿದ್ಧ ಶಿಷ್ಯ: ಅನಾಥ ಪಿಂಡಕ, ಪ್ರಸಿದ್ಧ ಶಿಷ್ಯೆ: ವಿಶಾಖಿ." },
    { q: "32. ಬುದ್ಧನಿಗೆ 'ಅಕ್ಷಯ ಪಾಯಸ' ಭಿಕ್ಷೆ ನೀಡಿದ ಮೊದಲ ಶಿಷ್ಯೆ ಯಾರು?", options: ["A) ಅಮ್ರಪಾಲಿ", "B) ವಿಶಾಖಿ", "C) ಸುಜಾತ", "D) ಗೌತಮಿ"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) ಸುಜಾತ.\nಬುದ್ಧನಿಗೆ ಅಕ್ಷಯ ಪಾಯಸ ನೀಡಿದ ಮೊದಲ ಶಿಷ್ಯೆ ಸುಜಾತ." },
    { q: "33. ಬುದ್ಧನ ಕೊನೆಯ ಉಪದೇಶ ಕೇಳಿದ ವ್ಯಕ್ತಿ ಯಾರು?", options: ["A) ಸುಭದ್ರ", "B) ಅನಾಥ ಪಿಂಡಕ", "C) ಚಂದ", "D) ಜೀವಕ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಸುಭದ್ರ.\nಬುದ್ಧನ ಕೊನೆಯ ಉಪದೇಶ ಕೇಳಿದ ವ್ಯಕ್ತಿ ಸುಭದ್ರ (ಅಷ್ಟಾಂಗ ಮಾರ್ಗಗಳ ಬಗ್ಗೆ ನಂಬಿಕೆ ಇಡು ಎಂದನು)." },
    { q: "34. ಬುದ್ಧನಿಗೆ ವಿಷಯುಕ್ತ ಹಂದಿ ಮಾಂಸವನ್ನು ತಿನ್ನಿಸಿದ ವ್ಯಕ್ತಿ ಯಾರು?", options: ["A) ಚಂದನ / ಚಂದ", "B) ಸುಭದ್ರ", "C) ಅಂಗುಲೀಮಾಲ", "D) ಜೀವಕ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಚಂದನ / ಚಂದ.\nಬುದ್ಧನಿಗೆ ವಿಷಯುಕ್ತ ಹಂದಿ ಮಾಂಸ ತಿನ್ನಿಸಿದವನು ಚಂದ." },
    { q: "35. ಬುದ್ಧನ ಕೊನೆಯ ದಿನಗಳಲ್ಲಿ ಚಿಕಿತ್ಸೆ ನೀಡಿದ ಪ್ರಸಿದ್ಧ ವೈದ್ಯ ಯಾರು?", options: ["A) ಧನ್ವಂತರಿ", "B) ಜೀವಕ", "C) ಚರಕ", "D) ಶುಶ್ರುತ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಜೀವಕ.\nಬುದ್ಧನ ಕೊನೆಯ ದಿನಗಳಲ್ಲಿ ಚಿಕಿತ್ಸೆ ನೀಡಿದ ವೈದ್ಯ ಜೀವಕ." },
    { q: "36. ಭಾರತದಲ್ಲಿ ಅತ್ಯಂತ ದೊಡ್ಡ ಚೈತ್ಯಾಲಯ ಎಲ್ಲಿದೆ?", options: ["A) ಕಾರ್ಲೆ (ಮಹಾರಾಷ್ಟ್ರ)", "B) ಅಜಂತಾ", "C) ಎಲ್ಲೋರಾ", "D) ಸಾಂಚಿ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಕಾರ್ಲೆ (ಮಹಾರಾಷ್ಟ್ರ).\nಭಾರತದಲ್ಲಿ ಅತೀ ದೊಡ್ಡ ಚೈತ್ಯಾಲಯ ಮಹಾರಾಷ್ಟ್ರದ ಕಾರ್ಲೆಯಲ್ಲಿದೆ." },
    { q: "37. ಬೌದ್ಧರ ಸಮಾಧಿಗಳನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["A) ವಿಹಾರಗಳು", "B) ಸ್ತೂಪಗಳು", "C) ಚೈತ್ಯಗಳು", "D) ಬಸದಿಗಳು"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಸ್ತೂಪಗಳು.\nಬೌದ್ಧರ ಸಮಾಧಿಗಳನ್ನು ಸ್ತೂಪಗಳು ಎಂದು ಕರೆಯುತ್ತಾರೆ." },
    { q: "38. ಭಾರತದಲ್ಲಿ ಅತಿ ದೊಡ್ಡ ಸ್ತೂಪ ಯಾವುದು?", options: ["A) ಅಮರಾವತಿ ಸ್ತೂಪ", "B) ಸಾಂಚಿ ಸ್ತೂಪ", "C) ಧಮೇಕ್ ಸ್ತೂಪ", "D) ಭಾರ್ಹುತ್ ಸ್ತೂಪ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಸಾಂಚಿ ಸ್ತೂಪ.\nಭಾರತದಲ್ಲಿ ಅತಿ ದೊಡ್ಡ ಸ್ತೂಪ ಸಾಂಚಿಸ್ತೂಪ." },
    { q: "39. ಬೌದ್ಧರ ವಸತಿ ಕೇಂದ್ರಗಳಿಗೆ ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["A) ವಿಹಾರಗಳು", "B) ಸ್ತೂಪಗಳು", "C) ಚೈತ್ಯಾಲಯ", "D) ಮಠಗಳು"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ವಿಹಾರಗಳು.\nಬೌದ್ಧರ ವಸತಿ ಕೇಂದ್ರಗಳಿಗೆ ವಿಹಾರಗಳು ಎನ್ನುತ್ತಾರೆ." },
    { q: "40. ದಕ್ಷಿಣ ಭಾರತದ ಅತಿ ದೊಡ್ಡ ಬೌದ್ಧ ವಿಹಾರ ಎಲ್ಲಿದೆ?", options: ["A) ಮೈಸೂರು", "B) ಕಲಬುರ್ಗಿ", "C) ಯಾದಗಿರಿ", "D) ಮುಂಡಗೋಡ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಕಲಬುರ್ಗಿ.\nದಕ್ಷಿಣ ಭಾರತದ ದೊಡ್ಡ ವಿಹಾರ ಕಲಬುರ್ಗಿಯ ಬೌದ್ಧವಿಹಾರ." },
    { q: "41. ಮಲಗಿರುವ ಭಂಗಿಯ ಬುದ್ಧನ ಮೂರ್ತಿ ಕರ್ನಾಟಕದ ಯಾವ ಜಿಲ್ಲೆಯ ಶಹಾಪುರದಲ್ಲಿದೆ?", options: ["A) ಕಲಬುರ್ಗಿ", "B) ಯಾದಗಿರಿ", "C) ಬಳ್ಳಾರಿ", "D) ರಾಯಚೂರು"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಯಾದಗಿರಿ.\nಮಲಗಿರುವ ಬುದ್ಧನ ಮೂರ್ತಿ ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯ ಶಹಾಪುರದಲ್ಲಿದೆ." },
    { q: "42. 'ಮಹಾಯಾನ' ಪಂಥದ ಮೊದಲ ಪುಸ್ತಕ ಯಾವುದು?", options: ["A) ಲಲಿತ ವಿಸ್ತಾರ", "B) ಮಹಾವಸ್ತು", "C) ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ", "D) ಬುದ್ಧಚರಿತ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಲಲಿತ ವಿಸ್ತಾರ.\nಮಹಾಯಾನ ಪಂಥದ ಮೊದಲ ಪುಸ್ತಕ ಲಲಿತ ವಿಸ್ತಾರ." },
    { q: "43. 'ಹೀನಾಯಾನ' ಪಂಥದ ಮೊದಲ ಪುಸ್ತಕ ಯಾವುದು?", options: ["A) ಲಲಿತ ವಿಸ್ತಾರ", "B) ಮಹಾವಸ್ತು", "C) ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ", "D) ದೀಪವಂಶ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಮಹಾವಸ್ತು.\nಹೀನಾಯಾನ ಪಂಥದ ಮೊದಲ ಪುಸ್ತಕ ಮಹಾವಸ್ತು." },
    { q: "44. 'ವಜ್ರಾಯಾನ' ಪಂಥದ ಮೊದಲ ಪುಸ್ತಕ ಯಾವುದು?", options: ["A) ಮಹಾವಸ್ತು", "B) ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ", "C) ಲಲಿತ ವಿಸ್ತಾರ", "D) ಮಹಾವಂಶ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ.\nವಜ್ರಾಯಾನ ಪಂಥದ ಮೊದಲ ಪುಸ್ತಕ ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ." },
    { q: "45. ಕರ್ನಾಟಕದಲ್ಲಿ ಬೌದ್ಧರ ಪ್ರಮುಖ ನಿರಾಶ್ರಿತರ ಕೇಂದ್ರಗಳು ಎಲ್ಲಿವೆ?", options: ["A) ಮುಂಡಗೋಡ (ಉ.ಕ.) ಮತ್ತು ಬೈಲಕುಪ್ಪೆ (ಮೈಸೂರು)", "B) ಶಹಾಪುರ ಮತ್ತು ಕಲಬುರ್ಗಿ", "C) ಸನ್ನತಿ ಮತ್ತು ಕನಗನಹಳ್ಳಿ", "D) ಬೀದರ್ ಮತ್ತು ಧಾರವಾಡ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಮುಂಡಗೋಡ (ಉ.ಕ.) ಮತ್ತು ಬೈಲಕುಪ್ಪೆ (ಮೈಸೂರು).\nಕರ್ನಾಟಕದಲ್ಲಿ ಬೌದ್ಧ ನಿರಾಶ್ರಿತರ ಕೇಂದ್ರಗಳು ಮುಂಡಗೋಡ ಹಾಗೂ ಬೈಲಕುಪ್ಪೆಯಲ್ಲಿವೆ." },
    { q: "46. ಸಿದ್ಧಾರ್ಥನ ಹೆಂಡತಿಯ ಹೆಸರುಗಳಲ್ಲದ ಒಂದನ್ನು ಗುರುತಿಸಿ (ಟಿಪ್ಪಣಿಯ ಪ್ರಕಾರ):", options: ["A) ಯಶೋಧರೆ", "B) ಬಿಂಬಾ / ಗೋಪಾ", "C) ಭದ್ದಕಚ್ಚನಾ / ಸುಭದ್ರಾ", "D) ತ್ರಿಶಲಾ"], correct: 3, exp: "ಸರಿಯಾದ ಉತ್ತರ: D) ತ್ರಿಶಲಾ.\nಬುದ್ಧನ ಹೆಂಡತಿಯ ಹೆಸರುಗಳು: ಯಶೋಧರೆ (ಬಿಂಬಾ, ಗೋಪಾ, ಭದ್ದಕಚ್ಚನಾ, ಸುಭದ್ರಾ). ತ್ರಿಶಲಾ ಮಹಾವೀರನ ತಾಯಿ." },
    { q: "47. ಗೌತಮ ಬುದ್ಧನ ಕುದುರೆಯ ಹೆಸರೇನು?", options: ["A) ಕಂಥಕ", "B) ಚೇತಕ್", "C) ಉಚ್ಚೈಶ್ರವಸ್", "D) ವಿಕ್ರಮ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಕಂಥಕ.\nಬುದ್ಧನ ಕುದುರೆಯ ಹೆಸರು ಕಂಥಕ." },
    { q: "48. ಪ್ರಥಮ ಬೌದ್ಧ ಉಪದೇಶ ಸಂಕೇತಿಸುವ 'ಧರ್ಮ ಚಕ್ರ'ದಲ್ಲಿ ಎಷ್ಟು ಕಡ್ಡಿಗಳು (Spokes) ಇವೆ?", options: ["A) 12", "B) 24", "C) 8", "D) 16"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) 8.\nಪ್ರಥಮ ಉಪದೇಶದ ಸಂಕೇತ ಧರ್ಮ ಚಕ್ರದಲ್ಲಿ 8 ಕಡ್ಡಿಗಳಿವೆ (ಅಷ್ಟಾಂಗ ಮಾರ್ಗದ ಸಂಕೇತ)." },
    { q: "49. ಬೌದ್ಧರ ಪ್ರಾರ್ಥನಾ ಮಂದಿರಗಳಿಗೆ ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["A) ವಿಹಾರ", "B) ಸ್ತೂಪ", "C) ಚೈತ್ಯಾಲಯ", "D) ಬಸದಿ"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) ಚೈತ್ಯಾಲಯ.\nಪ್ರಾರ್ಥನಾ ಕೇಂದ್ರಗಳಿಗೆ ಚೈತ್ಯಾಲಯ ಎನ್ನಲಾಗುತ್ತದೆ (ಉದಾ: ಕಾರ್ಲೆ)." }
];

let currentIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion(index) {
    currentIndex = index;
    const q = quizData[index];
    
    document.getElementById('sub-header').innerText = `Page ${index + 1} - Question ${index + 1} of ${quizData.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const expBox = document.getElementById('explanation-box');
    expBox.style.display = 'none';
    expBox.className = 'explanation-box';

    q.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (userAnswers[index] !== null) {
            btn.disabled = true;
            if (optIdx === q.correct) {
                btn.classList.add('correct');
            }
            if (userAnswers[index] === optIdx && optIdx !== q.correct) {
                btn.classList.add('wrong');
            }
        } else {
            btn.onclick = () => selectOption(optIdx);
        }

        optionsContainer.appendChild(btn);
    });

    if (userAnswers[index] !== null) {
        expBox.style.display = 'block';
        if (userAnswers[index] === q.correct) {
            expBox.classList.add('correct-bg');
            expBox.innerText = "ಸರಿ! (Correct)\n" + q.exp;
        } else {
            expBox.innerText = "ತಪ್ಪು! (Incorrect)\n" + q.exp;
        }
    }

    updatePalette();
}

function selectOption(optionIndex) {
    userAnswers[currentIndex] = optionIndex;
    loadQuestion(currentIndex);
    calculateScore();
}

function prevQuestion() {
    if (currentIndex > 0) loadQuestion(currentIndex - 1);
}

function nextQuestion() {
    if (currentIndex < quizData.length - 1) loadQuestion(currentIndex + 1);
}

function updatePalette() {
    const grid = document.getElementById('palette-grid');
    grid.innerHTML = '';

    quizData.forEach((_, idx) => {
        const btn = document.createElement('div');
        btn.className = 'palette-btn';
        btn.innerText = idx + 1;

        if (idx === currentIndex) btn.classList.add('active');

        if (userAnswers[idx] !== null) {
            if (userAnswers[idx] === quizData[idx].correct) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-wrong');
            }
        }

        btn.onclick = () => loadQuestion(idx);
        grid.appendChild(btn);
    });
}

function calculateScore() {
    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) score++;
    });
    document.getElementById('score').innerText = score;
}

function resetTest() {
    if (confirm("ನಿಮ್ಮ ಪರೀಕ್ಷೆಯನ್ನು ಮರುಪ್ರಾರಂಭಿಸಲು ನೀವು ಖಚಿತವಾಗಿದ್ದೀರಾ? (Are you sure you want to retest?)")) {
        userAnswers = new Array(quizData.length).fill(null);
        document.getElementById('score').innerText = "0";
        loadQuestion(0);
    }
}

// Timer setup
let totalSeconds = 45 * 60;
setInterval(() => {
    if (totalSeconds > 0) {
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }
}, 1000);

// Initial Load
loadQuestion(0);
</script>
