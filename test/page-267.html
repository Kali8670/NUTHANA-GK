<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Karnataka PC & SSC CBT Exam Mock Test (122 Questions)</title>
  <style>
    :root {
      --primary-blue: #0b4a92;
      --header-bg: #102a45;
      --light-gray: #f4f6f9;
      --correct-green: #2e7d32;
      --incorrect-red: #c62828;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, 'Tunga', 'Nudi', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--light-gray);
      color: #333;
    }

    /* Top Navigation Header */
    header {
      background-color: var(--header-bg);
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .timer-box {
      background-color: #d32f2f;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    /* Main Container */
    .container {
      display: flex;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 15px auto;
      gap: 15px;
      padding: 0 10px;
    }

    /* Quiz Area (Left) */
    .quiz-area {
      flex: 3;
      min-width: 300px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
    }

    .page-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .question-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .option-btn {
      background-color: #f8f9fa;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px 15px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background-color: #e3f2fd;
    }

    .option-btn.correct {
      background-color: #c8e6c9 !important;
      border-color: var(--correct-green) !important;
      color: #1b5e20;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #ffcdd2 !important;
      border-color: var(--incorrect-red) !important;
      color: #b71c1c;
    }

    .explanation-box {
      display: none;
      padding: 10px;
      background-color: #ffebee;
      border: 1px solid #ffcdd2;
      color: #c62828;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
    }

    .btn-prev { background-color: #1976d2; }
    .btn-next { background-color: #1976d2; }
    .btn-retest { background-color: #c62828; }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Palette Sidebar (Right) */
    .palette-area {
      flex: 1;
      min-width: 250px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 15px;
      height: fit-content;
    }

    .palette-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .score-tracker {
      font-size: 12px;
      color: #555;
      margin-bottom: 10px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-height: 450px;
      overflow-y: auto;
    }

    .q-grid-btn {
      padding: 6px;
      background-color: #e0e0e0;
      border: 1px solid #bbb;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }

    .q-grid-btn.active {
      border: 2px solid #000;
      font-weight: bold;
    }

    .q-grid-btn.answered-correct {
      background-color: #81c784;
      color: #fff;
    }

    .q-grid-btn.answered-incorrect {
      background-color: #e57373;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div>Karnataka PC & SSC CBT Exam Mock Test</div>
    <div class="timer-box" id="timer">Time Remaining: 90:00</div>
  </header>

  <div class="container">
    <!-- Quiz Section -->
    <div class="quiz-area">
      <div class="page-info" id="page-info">Question 1 of 122</div>
      <div class="question-title" id="question-text">Loading question...</div>
      
      <div class="options-container" id="options-container"></div>

      <div class="explanation-box" id="explanation-box"></div>

      <div class="controls">
        <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion()">Previous</button>
        <button class="btn btn-retest" onclick="retest()">Retest (ಮರುಪರೀಕ್ಷೆ)</button>
        <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Next</button>
      </div>
    </div>

    <!-- Question Palette -->
    <div class="palette-area">
      <div class="palette-title">Question Palette</div>
      <div class="score-tracker" id="score-display">Score: 0 / 122</div>
      <div class="palette-grid" id="palette-grid"></div>
    </div>
  </div>

  <script>
    const questionsData = [
      /* Vedic Period (Questions 1 to 58) */
      { q: "1. ಆರ್ಯರ ಮೂಲದ ಬಗ್ಗೆ ವಿಭಿನ್ನ ಅಭಿಪ್ರಾಯಗಳಿವೆ. ಅವುಗಳಲ್ಲಿ ಪ್ರಮುಖವಾದವುಗಳನ್ನು ಕೆಳಗೆ ಪರೀಕ್ಷಿಸಿ.", options: ["ಟಿಬೆಟ್, ಭಾರತ, ಮಧ್ಯ ಏಷ್ಯಾ", "ಆಫ್ರಿಕಾ, ಅಮೆರಿಕ", "ಚೀನಾ, ಜಪಾನ್", "ಆಸ್ಟ್ರೇಲಿಯಾ"], ans: 0 },
      { q: "1(a). ದಯಾನಂದ ಸರಸ್ವತಿ ಅವರ ಪ್ರಕಾರ ಆರ್ಯರ ಮೂಲ ಸ್ಥಳ ಯಾವುದು?", options: ["ಟಿಬೆಟ್", "ಭಾರತ", "ಮಧ್ಯ ಏಷ್ಯಾ", "ಯುರೋಪ್"], ans: 0 },
      { q: "1(b). ಸ್ವಾಮಿ ವಿವೇಕಾನಂದರ ಪ್ರಕಾರ ಆರ್ಯರ ಮೂಲ ಸ್ಥಳ ಯಾವುದು?", options: ["ಟಿಬೆಟ್", "ಭಾರತ", "ಮಧ್ಯ ಏಷ್ಯಾ", "ಆರ್ಕ್ಟಿಕ್"], ans: 1 },
      { q: "1(c). ಮ್ಯಾಕ್ಸ್ ಮುಲ್ಲರ್ ಅವರ ಪ್ರಕಾರ ಆರ್ಯರ ಮೂಲ ಸ್ಥಳ ಯಾವುದು?", options: ["ಟಿಬೆಟ್", "ಭಾರತ", "ಮಧ್ಯ ಏಷ್ಯಾ", "ಯುರೋಪ್"], ans: 2 },
      { q: "2. ಪೂರ್ವವೇದ ಅಥವಾ ಋಗ್ವೇದ ಕಾಲದ ಕಾಲಾವಧಿ ಯಾವುದು?", options: ["ಕ್ರಿ.ಪೂ. 1500–1000", "ಕ್ರಿ.ಪೂ. 1000–600", "ಕ್ರಿ.ಪೂ. 2000–1500", "ಕ್ರಿ.ಪೂ. 600–300"], ans: 0 },
      { q: "3. ಉತ್ತರವೇದ ಕಾಲದ ಕಾಲಾವಧಿ ಯಾವುದು?", options: ["ಕ್ರಿ.ಪೂ. 1500–1000", "ಕ್ರಿ.ಪೂ. 1000–600", "ಕ್ರಿ.ಪೂ. 2000–1500", "ಕ್ರಿ.ಪೂ. 500–200"], ans: 1 },
      { q: "4 (01). ವೇದಗಳ ಕಾಲದ ರಾಜಕೀಯ ಸಂಸ್ಥೆ 'ಸಭಾ' ಯಾವುದಾಗಿತ್ತು?", options: ["ಹಿರಿಯರ ಮತ್ತು ಗಣ್ಯರ ಸಭೆ", "ಸಾಮಾನ್ಯ ಜನರ ಸಭೆ", "ಯುದ್ಧ ಸಮಿತಿ", "ಧಾರ್ಮಿಕ ಸಭೆ"], ans: 0 },
      { q: "5 (02). 'ಸಮಿತಿ' ಎಂಬ ರಾಜಕೀಯ ಸಂಸ್ಥೆಯ ಪ್ರಮುಖ ಲಕ್ಷಣವೇನು?", options: ["ಸಾಮಾನ್ಯ ಪ್ರಜೆಗಳ ಸಭೆ", "ಕೇವಲ ಮಹಿಳೆಯರ ಸಭೆ", "ಕೇವಲ ಪುರೋಹಿತರ ಸಭೆ", "ನ್ಯಾಯಾಲಯ"], ans: 0 },
      { q: "5-Sub (1). ಸಮಿತಿಯ ಸದಸ್ಯರನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಿದ್ದರು?", options: ["ವಿಶಃ", "ಕುಲಪತಿ", "ವ್ಯಾಪ್ತಿ", "ಹೋತ್ರಿ"], ans: 0 },
      { q: "6 (03). ವೇದಗಳ ಕಾಲದ ಅತ್ಯಂತ ಪ್ರಾಚೀನ ಜನಪ್ರಿಯ ಸಂಸ್ಥೆ ಯಾವುದು?", options: ["ವಿಧಾತ್ರ", "ಸಭಾ", "ಸಮಿತಿ", "ಗ್ರಾಮ"], ans: 0 },
      { q: "7 (2). ವೇದಗಳ ಕಾಲದಲ್ಲಿ ಗ್ರಾಮಗಳ ಗುಂಪಿಗೆ ಏನೆಂದು ಕರೆಯುತ್ತಿದ್ದರು?", options: ["ವಿಷ್", "ಕುಲ", "ಗ್ರಾಮಣಿ", "ಸಭಾ"], ans: 0 },
      { q: "8 (3). ಕುಟುಂಬದ ಮುಖ್ಯಸ್ಥನನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಿದ್ದರು?", options: ["ಕುಲಪತಿ ಅಥವಾ ಗೃಹಪತಿ", "ವಿಶಃ", "ವ್ಯಾಪ್ತಿ", "ಗ್ರಾಮಣಿ"], ans: 0 },
      { q: "9 (4). ವೇದಗಳ ಕಾಲದ ಸಮಾಜದಲ್ಲಿ ಯಾವ ವ್ಯವಸ್ಥೆ ಜಾರಿಯಲ್ಲಿತ್ತು?", options: ["ವರ್ಣ ವ್ಯವಸ್ಥೆ", "ಜೀತ ಪದ್ಧತಿ", "ಜಮೀನ್ದಾರಿ ಪದ್ಧತಿ", "ಸತಿ ಪದ್ಧತಿ"], ans: 0 },
      { q: "10 (5). ಬ್ರಾಹ್ಮಣ, ಕ್ಷತ್ರಿಯ, ವೈಶ್ಯ, ಶೂದ್ರ ಎಂಬ ವರ್ಣಗಳ ಉಲ್ಲೇಖ ಋಗ್ವೇದದ ಯಾವ ಭಾಗದಲ್ಲಿದೆ?", options: ["10ನೇ ಮಂಡಲದ ಪುರುಷಸೂಕ್ತ", "3ನೇ ಮಂಡಲ", "7ನೇ ಮಂಡಲ", "9ನೇ ಮಂಡಲ"], ans: 0 },
      { q: "11 (6). ವೇದಗಳ ಕಾಲದ ಕುಟುಂಬ ವ್ಯವಸ್ಥೆಯಲ್ಲಿ ಬಹು ಪತ್ನಿತ್ವ ಪದ್ಧತಿ ಯಾರಿಗೆ ಮಾತ್ರ ಸೀಮಿತವಾಗಿತ್ತು?", options: ["ಅರಸು ಮನೆತನಕ್ಕೆ ಮಾತ್ರ", "ಎಲ್ಲಾ ಜನರಿಗೆ", "ಬ್ರಾಹ್ಮಣರಿಗೆ ಮಾತ್ರ", "ಯಾರಿಗೂ ಇರಲಿಲ್ಲ"], ans: 0 },
      { q: "12 (1). ವೇದಗಳ ಕಾಲದ ಪ್ರಮುಖ ವಿದುಷಿಯರು ಯಾರು?", options: ["ಅಪಾಲಾ, ಘೋಷಾಲಾ, ಗಾರ್ಗಿ, ಲೋಪಾಮುದ್ರಾ, ಮೈತ್ರೇಯಿ, ವಿಶ್ವವರ, ಕಾತ್ಯಾಯಿನಿ, ಮೃದಾಳಿನಿ", "ರಜಿಯಾ ಸುಲ್ತಾನ", "ಝಾನ್ಸಿ ರಾಣಿ", "ಚನ್ನಮ್ಮ"], ans: 0 },
      { q: "13 (2). ಋಗ್ವೇದದ ಕೆಲವು ಮಂತ್ರಗಳನ್ನು ರಚಿಸಿದ ಮಹಿಳಾ ವಿದ್ವಾಂಸಿ ಯಾರು?", options: ["ಘೋಷಾಲಾ", "ಅಪಾಲಾ", "ಗಾರ್ಗಿ", "ಮೈತ್ರೇಯಿ"], ans: 0 },
      { q: "14 (3). ಜನಕರಾಜನ ಆಸ್ಥಾನದಲ್ಲಿ ಯಜ್ಞವಲ್ಕ್ಯ ಋಷಿಯೊಂದಿಗೆ ವಾದ ಮಂಡಿಸಿದ ಮಹಿಳೆ ಯಾರು?", options: ["ಗಾರ್ಗಿ", "ಘೋಷಾಲಾ", "ಲೋಪಾಮುದ್ರಾ", "ಕಾತ್ಯಾಯಿನಿ"], ans: 0 },
      { q: "15 (4). ವೇದಗಳ ಕಾಲದಲ್ಲಿ ಸೇವಿಸುತ್ತಿದ್ದ ಎರಡು ಪ್ರಮುಖ ಪಾನೀಯಗಳು ಯಾವುವು?", options: ["ಸೋಮ ಮತ್ತು ಸುರ", "ಚಹಾ ಮತ್ತು ಕಾಫಿ", "ಅಮೃತ ಮತ್ತು ಮಧು", "ಹಾಲು ಮತ್ತು ಮೊಸರು"], ans: 0 },
      { q: "16 (5). ವೇದಗಳ ಕಾಲದಲ್ಲಿ ಜಾರಿಯಲ್ಲಿದ್ದ ಕುಟುಂಬ ಪದ್ಧತಿ ಯಾವುದು?", options: ["ನಿಯೋಗ ಪದ್ಧತಿ", "ದೇವದಾಸಿ ಪದ್ಧತಿ", "ಸತಿ ಪದ್ಧತಿ", "ಬಲ್ಯ ವಿವಾಹ"], ans: 0 },
      { q: "17 (6). ವೇದಗಳ ಕಾಲದಲ್ಲಿ ಕ್ಷೌರಿಕನನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಿದ್ದರು?", options: ["ವ್ಯಾಪ್ತಿ", "ವಿಶಃ", "ಹೋತ್ರಿ", "ಅಧ್ವರ್ಯು"], ans: 0 },
      { q: "18 (7). ಪೂರ್ವ ವೇದಕಾಲದ ಪ್ರಮುಖ ದೇವರು ಇಂದ್ರನನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["ಪುರಂದರ, ಕೋಟೆಗಳ ನಾಶಕ ಮತ್ತು ವಜ್ರಾಯುಧ ಹೊಂದಿದ ದೇವರು", "ಮಳೆಯ ದೇವರು", "ನಿಯಮಗಳ ಪಾಲಕ", "ಖಗೋಳ ದೇವರು"], ans: 0 },
      { q: "19 (8). ಇಂದ್ರನನ್ನು ಕುರಿತು ಋಗ್ವೇದದಲ್ಲಿ ಎಷ್ಟು ಶ್ಲೋಕಗಳಿವೆ?", options: ["250 ಶ್ಲೋಕಗಳು", "200 ಶ್ಲೋಕಗಳು", "150 ಶ್ಲೋಕಗಳು", "1028 ಶ್ಲೋಕಗಳು"], ans: 0 },
      { q: "20 (9). ಮಾನವ ಮತ್ತು ದೇವರ ಮಧ್ಯ ಸಂಪರ್ಕ ಏರ್ಪಡಿಸುವ ಎರಡನೇ ಪ್ರಮುಖ ದೇವರು ಯಾರು?", options: ["ಅಗ್ನಿ", "ಇಂದ್ರ", "ವರುಣ", "ರುದ್ರ"], ans: 0 },
      { q: "21 (10). ಅಗ್ನಿಯನ್ನು ಕುರಿತು ಋಗ್ವೇದದಲ್ಲಿ ಎಷ್ಟು ಶ್ಲೋಕಗಳಿವೆ?", options: ["200 ಶ್ಲೋಕಗಳು", "250 ಶ್ಲೋಕಗಳು", "150 ಶ್ಲೋಕಗಳು", "108 ಶ್ಲೋಕಗಳು"], ans: 0 },
      { q: "22 (11). ನಿಯಮಗಳ ಪಾಲಕ ಮತ್ತು ಋತುಗಳ ಪಾಲಕನೆಂದು ಕರೆಯಲ್ಪಡುವ ಮೂರನೇ ಪ್ರಮುಖ ದೇವರು ಯಾರು?", options: ["ವರುಣ (150 ಶ್ಲೋಕಗಳು)", "ಇಂದ್ರ", "ಅಗ್ನಿ", "ಸೋಮ"], ans: 0 },
      { q: "23 (12). ಮಳೆಯ ದೇವರು ಮತ್ತು ಮಿಂಚಿನ ದೇವರು ಯಾರು?", options: ["ಮಳೆಯ ದೇವರು – ಪರ್ಜನ್ಯ / ಮಿಂಚಿನ ದೇವರು – ರುದ್ರ", "ಮಳೆಯ ದೇವರು – ಇಂದ್ರ / ಮಿಂಚಿನ ದೇವರು – ಅಗ್ನಿ", "ಮಳೆಯ ದೇವರು – ವರುಣ / ಮಿಂಚಿನ ದೇವರು – ವಾಯು", "ಯಾವುದೂ ಅಲ್ಲ"], ans: 0 },
      { q: "24 (13). ಸೂರ್ಯ, ಪೂಷನ್, ಸೋಮ, ವಾಯು ಮತ್ತು ಅಶ್ವಿನ್ ದೇವತೆಗಳು ಕ್ರಮವಾಗಿ ಯಾವುದರ ದೇವರುಗಳು?", options: ["ಖಗೋಳ, ಗೋವು, ಸಸ್ಯ, ವಾಯು, ಆರೋಗ್ಯ", "ಆರೋಗ್ಯ, ಸಸ್ಯ, ಗೋವು, ವಾಯು, ಖಗೋಳ", "ವಾಯು, ಸಸ್ಯ, ಆರೋಗ್ಯ, ಖಗೋಳ, ಗೋವು", "ಯಾವುದೂ ಅಲ್ಲ"], ans: 0 },

      { q: "117 (68–72). ಬುದ್ಧನ ಜೀವನದ ಸಂಕೇತಗಳು: ಜನನ, ಮನೆ ತೊರೆದಿದ್ದು, ತಪಸ್ಸು, ಪ್ರಥಮ ಉಪದೇಶ, ಮರಣ?", options: ["ಜನನ: ಕಮಲ / ಮನೆ: ಕುದುರೆ / ತಪಸ್ಸು: ಬೋಧಿ ವೃಕ್ಷ / ಉಪದೇಶ: ಧರ್ಮಚಕ್ರ / ಮರಣ: ಸ್ತೂಪ", "ಎಲ್ಲಕ್ಕೂ ಕಮಲ", "ಎಲ್ಲಕ್ಕೂ ಕುದುರೆ", "ಯಾವುದೂ ಅಲ್ಲ"], ans: 0 },
      { q: "118 (73–84). ಬುದ್ಧನ ಶಿಷ್ಯರು: ಆನಂದ (1ನೇ ಶಿಷ್ಯ), ಚನ್ನ (ಸೇವಕ), ಕಂಥಕ (ಕುದುರೆ), ಅಂಗುಲಿಮಾಲ (ಕಳ್ಳ), ಆಮ್ರಪಾಲಿ (ವೇಶ್ಯೆ), ಸುಜಾತಾ (ಖೀರ್ ನೀಡಿದವಳು), ಚಂದ (ವಿಷಪೂರಿತ ಮಾಂಸ ನೀಡಿದವನು), ಜೀವಕ (ವೈದ್ಯ). ಇದು ಸರಿಯೇ?", options: ["ಹೌದು, ಸಂಪೂರ್ಣ ಸರಿಯಾಗಿದೆ", "ತಪ್ಪು", "ಕೆಲವು ಮಾತ್ರ ಸರಿ", "ಯಾವುದೂ ಅಲ್ಲ"], ans: 0 },
      { q: "119 (85–88). ಅತ್ಯಂತ ದೊಡ್ಡ ಚೈತ್ಯಾಲಯ (ಕಾರ್ಲೆ), ಅತ್ಯಂತ ದೊಡ್ಡ ಸ್ತೂಪ (ಸಾಂಚಿ), ವಸತಿ ಕೇಂದ್ರಗಳು (ವಿಹಾರಗಳು). ಇದು ಸರಿಯೇ?", options: ["ಹೌದು, ಸರಿಯಾಗಿದೆ", "ತಪ್ಪು", "ಭಾಗಶಃ ಸರಿ", "ಯಾವುದೂ ಅಲ್ಲ"], ans: 0 },
      { q: "120 (89–90). ದಕ್ಷಿಣ ಭಾರತದ ದೊಡ್ಡ ವಿಹಾರ ಕಲಬುರಗಿಯಲ್ಲಿದೆ ಮತ್ತು ಮಲಗಿರುವ ಬುದ್ಧನ ಮೂರ್ತಿ ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯ ಶಹಾಪುರದಲ್ಲಿದೆ. ಇದು ಸರಿಯೇ?", options: ["ಹೌದು, ಸರಿಯಾಗಿದೆ", "ತಪ್ಪು", "ಬೆಂಗಳೂರಿನಲ್ಲಿದೆ", "ಮೈಸೂರಿನಲ್ಲಿದೆ"], ans: 0 },
      { q: "121 (91–93). ಲಲಿತ ವಿಸ್ತಾರ (ಮಹಾಯಾನ), ಮಹಾವಸ್ತು (ಹೀನಾಯಾನ), ಮಂಜುಶ್ರೀ ಮೂಲ ಕಲ್ಪ (ವಜ್ರಾಯಾನ) ಆಯಾ ಪಂಥಗಳ ಮೊದಲ ಪುಸ್ತಕಗಳೇ?", options: ["ಹೌದು, ಸರಿಯಾಗಿದೆ", "ತಪ್ಪು", "ವೇದಗಳ ಭಾಗ", "ಯಾವುದೂ ಅಲ್ಲ"], ans: 0 },
      { q: "122 (94). ಕರ್ನಾಟಕದಲ್ಲಿರುವ ಬೌದ್ಧರ ನಿರಾಶ್ರಿತರ ಕೇಂದ್ರಗಳು ಯಾವುವು?", options: ["ಮುಂಡಗೋಡ (ಉತ್ತರ ಕನ್ನಡ) ಮತ್ತು ಬೈಲುಕುಪ್ಪೆ (ಮೈಸೂರು)", "ಶ್ರವಣಬೆಳಗೊಳ ಮತ್ತು ಮೂಡಬಿದರೆ", "ಬಾದಾಮಿ ಮತ್ತು ಐಹೊಳೆ", "ಹಂಪಿ ಮತ್ತು ಬೇಲೂರು"], ans: 0 }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questionsData.length).fill(null);
    let score = 0;

    function initQuiz() {
      createPalette();
      loadQuestion(currentIndex);
    }

    function createPalette() {
      const grid = document.getElementById("palette-grid");
      grid.innerHTML = "";
      questionsData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "q-grid-btn";
        btn.id = `palette-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });
    }

    function loadQuestion(index) {
      const qData = questionsData[index];
      document.getElementById("page-info").innerText = `Question ${index + 1} of ${questionsData.length}`;
      document.getElementById("question-text").innerText = qData.q;

      const optionsBox = document.getElementById("options-container");
      optionsBox.innerHTML = "";

      const expBox = document.getElementById("explanation-box");
      expBox.style.display = "none";

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${String.fromCharCode(65 + optIdx)}) ${optText}`;

        if (userAnswers[index] !== null) {
          if (optIdx === qData.ans) {
            btn.classList.add("correct");
          }
          if (userAnswers[index] === optIdx && optIdx !== qData.ans) {
            btn.classList.add("incorrect");
          }
          btn.disabled = true;
        } else {
          btn.onclick = () => selectOption(optIdx);
        }

        optionsBox.appendChild(btn);
      });

      if (userAnswers[index] !== null && userAnswers[index] !== qData.ans) {
        expBox.style.display = "block";
        expBox.innerText = `ತಪ್ಪು! ಸರಿಯಾದ ಉತ್ತರ: ${String.fromCharCode(65 + qData.ans)}) ${qData.options[qData.ans]}`;
      }

      document.getElementById("prev-btn").disabled = index === 0;
      document.getElementById("next-btn").disabled = index === questionsData.length - 1;

      updatePaletteUI();
    }

    function selectOption(selectedIdx) {
      if (userAnswers[currentIndex] !== null) return;

      userAnswers[currentIndex] = selectedIdx;
      if (selectedIdx === questionsData[currentIndex].ans) {
        score++;
      }

      document.getElementById("score-display").innerText = `Score: ${score} / ${questionsData.length}`;
      loadQuestion(currentIndex);
    }

    function updatePaletteUI() {
      questionsData.forEach((_, idx) => {
        const btn = document.getElementById(`palette-btn-${idx}`);
        btn.classList.remove("active", "answered-correct", "answered-incorrect");

        if (idx === currentIndex) {
          btn.classList.add("active");
        }

        if (userAnswers[idx] !== null) {
          if (userAnswers[idx] === questionsData[idx].ans) {
            btn.classList.add("answered-correct");
          } else {
            btn.classList.add("answered-incorrect");
          }
        }
      });
    }

    function nextQuestion() {
      if (currentIndex < questionsData.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion(currentIndex);
      }
    }

    function jumpToQuestion(index) {
      currentIndex = index;
      loadQuestion(currentIndex);
    }

    function retest() {
      if (confirm("ನಿಮಗೆ ಮತ್ತೆ ಪರೀಕ್ಷೆಯನ್ನು ಮೊದಲಿನಿಂದ ತೆಗೆದುಕೊಳ್ಳಬೇಕೇ?")) {
        userAnswers = new Array(questionsData.length).fill(null);
        score = 0;
        currentIndex = 0;
        document.getElementById("score-display").innerText = `Score: 0 / ${questionsData.length}`;
        loadQuestion(currentIndex);
      }
    }

    window.onload = initQuiz;
  </script>
</body>
