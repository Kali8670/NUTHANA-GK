<script>
const quizData = [
    { q: "1. ಪ್ರಾಚೀನ ಭಾರತದಲ್ಲಿದ್ದ ಒಟ್ಟು ಮಹಾ ಜನಪದಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?", options: ["A) 12", "B) 16", "C) 18", "D) 20"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) 16.\nಪ್ರಾಚೀನ ಭಾರತದಲ್ಲಿ ಒಟ್ಟು 16 ಮಹಾ ಜನಪದಗಳು ಬೆಳೆದು ಬಂದವು." },
    { q: "2. 16 ಮಹಾ ಜನಪದಗಳ ಹೆಸರುಗಳು ಮೊಟ್ಟ ಮೊದಲ ಬಾರಿಗೆ ಬೌದ್ಧ ಮತ್ತು ಜೈನರ ಯಾವ ಗ್ರಂಥಗಳಲ್ಲಿ ಕಂಡುಬಂದಿವೆ?", options: ["A) ಬೌದ್ಧರ ಅಂಗುತ್ತರ ನಿಕಾಯ ಮತ್ತು ಜೈನರ ಭಗವತಿ ಸೂತ್ರ", "B) ಬೌದ್ಧರ ವಿನಯ ಪಿಟಕ ಮತ್ತು ಜೈನರ ಕಲ್ಪಸೂತ್ರ", "C) ಬೌದ್ಧರ ಮಹಾವಂಶ ಮತ್ತು ಜೈನರ ಪರಿಶಿಷ್ಟಪರ್ವನ್", "D) ಬೌದ್ಧರ ದೀಪವಂಶ ಮತ್ತು ಜೈನರ ತತ್ವಾರ್ಥ ಸೂತ್ರ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಬೌದ್ಧರ ಅಂಗುತ್ತರ ನಿಕಾಯ ಮತ್ತು ಜೈನರ ಭಗವತಿ ಸೂತ್ರ." },
    { q: "3. 'ಅಂಗ' ಮಹಾಜನಪದದ ರಾಜಧಾನಿ ಮತ್ತು ಪ್ರಸ್ತುತ ಪ್ರದೇಶ ಯಾವುದು?", options: ["A) ಚಂಪಾ - ಪೂರ್ವ ಬಿಹಾರ", "B) ರಾಜಗೃಹ - ದಕ್ಷಿಣ ಬಿಹಾರ", "C) ಬನಾರಸ - ವಾರಣಾಸಿ", "D) ಇಂದ್ರಪ್ರಸ್ಥ - ದೆಹಲಿ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಚಂಪಾ - ಪೂರ್ವ ಬಿಹಾರ." },
    { q: "4. 'ಮಗಧ' ಮಹಾಜನಪದದ ರಾಜಧಾನಿ ಮತ್ತು ಪ್ರಸ್ತುತ ಪ್ರದೇಶ ಯಾವುದು?", options: ["A) ಅಯೋಧ್ಯ - ಔದ್", "B) ರಾಜಗೃಹ - ದಕ್ಷಿಣ ಬಿಹಾರ", "C) ತಕ್ಷಶಿಲೆ - ರಾವಲಪಿಂಡಿ", "D) ಚಂಪಾ - ಪೂ.ಬಿಹಾರ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ರಾಜಗೃಹ - ದಕ್ಷಿಣ ಬಿಹಾರ." },
    { q: "5. 'ಕಾಶಿ' ಮಹಾಜನಪದದ ರಾಜಧಾನಿ ಮತ್ತು ಪ್ರಸ್ತುತ ಪ್ರದೇಶವನ್ನು ಗುರುತಿಸಿ:", options: ["A) ಇಂದ್ರಪ್ರಸ್ಥ - ದೆಹಲಿ", "B) ಬನಾರಸ - ವಾರಣಾಸಿ", "C) ಅಯೋಧ್ಯ - ಔದ್", "D) ತಕ್ಷಶಿಲೆ - ರಾವಲಪಿಂಡಿ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಬನಾರಸ - ವಾರಣಾಸಿ." },
    { q: "6. 'ಕೋಸಲ' ಮಹಾಜನಪದದ ರಾಜಧಾನಿ ಮತ್ತು ಪ್ರಸ್ತುತ ಪ್ರದೇಶ ಯಾವುದು?", options: ["A) ಅಯೋಧ್ಯ - ಔದ್", "B) ಚಂಪಾ - ಪೂ.ಬಿಹಾರ", "C) ಬನಾರಸ - ವಾರಣಾಸಿ", "D) ರಾಜಗೃಹ - ದಕ್ಷಿಣ ಬಿಹಾರ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಅಯೋಧ್ಯ - ಔದ್." },
    { q: "7. 'ಕುರು' ಮಹಾಜನಪದದ ರಾಜಧಾನಿ ಮತ್ತು ಪ್ರಸ್ತುತ ಪ್ರದೇಶವನ್ನು ಗುರುತಿಸಿ:", options: ["A) ತಕ್ಷಶಿಲೆ - ರಾವಲಪಿಂಡಿ", "B) ಇಂದ್ರಪ್ರಸ್ಥ - ದೆಹಲಿ", "C) ಅಯೋಧ್ಯ - ಔದ್", "D) ಚಂಪಾ - ಪೂರ್ವ ಬಿಹಾರ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಇಂದ್ರಪ್ರಸ್ಥ - ದೆಹಲಿ." },
    { q: "8. 'ಗಾಂಧಾರ' ಮಹಾಜನಪದದ ರಾಜಧಾನಿ ಮತ್ತು ಪ್ರಸ್ತುತ ಪ್ರದೇಶ ಯಾವುದು?", options: ["A) ತಕ್ಷಶಿಲೆ - ರಾವಲಪಿಂಡಿ (ಪಾಕಿಸ್ತಾನ)", "B) ಇಂದ್ರಪ್ರಸ್ಥ - ದೆಹಲಿ", "C) ಬನಾರಸ - ವಾರಣಾಸಿ", "D) ರಾಜಗೃಹ - ದಕ್ಷಿಣ ಬಿಹಾರ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ತಕ್ಷಶಿಲೆ - ರಾವಲಪಿಂಡಿ (ಪಾಕಿಸ್ತಾನ)." },
    { q: "9. 16 ಜನಪದಗಳಲ್ಲಿ ಪ್ರಬಲ ಸಾಮ್ರಾಜ್ಯವಾಗಿ ಬೆಳೆದು ಬಂದ ಜನಪದ ಯಾವುದು?", options: ["A) ಗಾಂಧಾರ", "B) ಕುರು", "C) ಮಗಧ", "D) ಕಾಶಿ"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) ಮಗಧ.\n16 ಜನಪದಗಳಲ್ಲಿ ಮಗಧವು ಬಲಿಷ್ಠ ಸಾಮ್ರಾಜ್ಯವಾಗಿ ಬೆಳೆದು ಬಂದಿತು." },
    { q: "10. ಮಗಧ ಸಾಮ್ರಾಜ್ಯದ ಸಂಸ್ಥಾಪಕರು ಯಾರು?", options: ["A) ಬಿಂಬಸಾರ ಮತ್ತು ಅಜಾತಶತ್ರು", "B) ಜರಾಸಂಧ ಮತ್ತು ಬೃಹದ್ರಥ", "C) ಶಿಶುನಾಗ ಮತ್ತು ಕಾಲಾಶೋಕ", "D) ಮಹಾಪದ್ಮನಂದ ಮತ್ತು ಧನನಂದ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಜರಾಸಂಧ ಮತ್ತು ಬೃಹದ್ರಥ." },
    { q: "11. ಮಗಧ ಸಾಮ್ರಾಜ್ಯವನ್ನಾಳಿದ ಮೊದಲ ಸಂತತಿ ಯಾವುದು?", options: ["A) ನಾಗ ಸಂತತಿ", "B) ನಂದ ಸಂತತಿ", "C) ಹರ್ಯಂಕ ಸಂತತಿ", "D) ಮೌರ್ಯ ಸಂತತಿ"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) ಹರ್ಯಂಕ ಸಂತತಿ." },
    { q: "12. ಹರ್ಯಂಕ ಸಂತತಿಯ ಸ್ಥಾಪಕ ಯಾರು?", options: ["A) ಅಜಾತಶತ್ರು", "B) ಬಿಂಬಸಾರ", "C) ನಾಗದಾಸಕ", "D) ಕಾಲಾಶೋಕ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಬಿಂಬಸಾರ." },
    { q: "13. ಬಿಂಬಸಾರನಿಗೆ ಕಾಶಿಯನ್ನು ಬಳುವಳಿಯಾಗಿ ತಂದ ಕೋಸಲಾದೇವಿ ಯಾರ ಮಗಳು ಮತ್ತು ಸಹೋದರಿಯಾಗಿದ್ದಳು?", options: ["A) ಮಹಾಕೋಸಲನ ಮಗಳು, ಪ್ರಸೇನಜಿತನ ಸಹೋದರಿ", "B) ಚೇತನನ ಮಗಳು, ಉದಯನನ ಸಹೋದರಿ", "C) ಮುದ್ರಕನ ಮಗಳು, ಬಿಂಬಸಾರನ ಸಹೋದರಿ", "D) ಪ್ರದ್ಯೋತನ ಮಗಳು, ಪ್ರಸೇನಜಿತನ ಪತ್ನಿ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ಮಹಾಕೋಸಲನ ಮಗಳು, ಪ್ರಸೇನಜಿತನ ಸಹೋದರಿ." },
    { q: "14. ಬಿಂಬಸಾರನು ಯಾರ ಸಹಾಯದಿಂದ ತನ್ನ ಸಾಮ್ರಾಜ್ಯವನ್ನು ನೇಪಾಳದ ಗಡಿಯವರೆಗೆ ವಿಸ್ತರಿಸಿದನು?", options: ["A) ಮೊದಲ ಪತ್ನಿ ಕೋಸಲಾದೇವಿ", "B) ಎರಡನೆಯ ಪತ್ನಿ ಚೆಲ್ಲಣಾ (ವೈಶಾಲಿಯ ಅರಸ ಚೇತಕನ ಮಗಳು)", "C) ಮೂರನೇ ಪತ್ನಿ ಖೇಮಾ", "D) ಪತ್ನಿ ವೈದೇಹಿ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಎರಡನೆಯ ಪತ್ನಿ ಚೆಲ್ಲಣಾ (ವೈಶಾಲಿಯ ಅರಸ ಚೇತಕನ ಮಗಳು)." },
    { q: "15. ಬಿಂಬಸಾರನು ಬೌದ್ಧ ಧರ್ಮ ಸ್ವೀಕರಿಸಲು ಕಾರಣಳಾದ ಮೂರನೇ ಪತ್ನಿ ಖೇಮಾ ಯಾರ ಮಗಳಾಗಿದ್ದಳು?", options: ["A) ಕೋಸಲದ ದೊರೆ ಮಹಾಕೋಸಲನ ಮಗಳು", "B) ವೈಶಾಲಿಯ ದೊರೆ ಚೇತಕನ ಮಗಳು", "C) ಮದ್ರ ರಾಜ್ಯದ ಅರಸ ಮುದ್ರಕನ ಮಗಳು", "D) ಅವಂತಿಯ ದೊರೆ ಪ್ರದ್ಯೋತನ ಮಗಳು"], correct: 2, exp: "ಸರಿಯಾದ ಉತ್ತರ: C) ಮದ್ರ ರಾಜ್ಯದ ಅರಸ ಮುದ್ರಕನ ಮಗಳು." },
    { q: "16. ಅವಂತಿಯ ದೊರೆ ಪ್ರದ್ಯೋತನ ಕಾಮಾಲೆ ರೋಗ ಗುಣಪಡಿಸಲು ಬಿಂಬಸಾರ ತನ್ನ ಆಸ್ಥಾನದ ಯಾವ ವೈದ್ಯನನ್ನು ಕಳುಹಿಸಿದನು?", options: ["A) ಚರಕ", "B) ಜೀವಕ", "C) ಸುಶ್ರುತ", "D) ಧನ್ವಂತರಿ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಜೀವಕ." },
    { q: "17. ಬಿಂಬಸಾರನು ಅಂಗದ ದೊರೆ ಬ್ರಹ್ಮದತ್ತನನ್ನು ಸೋಲಿಸಿ ಚಂಪಾವನ್ನು ವಶಪಡಿಸಿಕೊಂಡು ಯಾರನ್ನು ಅಧಿಕಾರಿಯಾಗಿ ನೇಮಿಸಿದನು?", options: ["A) ತನ್ನ ಮಗ ಕುನಿಕನನ್ನು", "B) ತನ್ನ ಮಗ ಅಜಾತಶತ್ರುವನ್ನು", "C) ನಾಗದಾಸಕನನ್ನು", "D) ಜೀವಕನನ್ನು"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) ತನ್ನ ಮಗ ಕುನಿಕನನ್ನು." },
    { q: "18. ಬಿಂಬಸಾರ ಬಂಧನದಲ್ಲಿದ್ದಾಗ ಅವನ ಯೋಗಕ್ಷೇಮ ನೋಡಿಕೊಂಡ ಪತ್ನಿ ಯಾರು?", options: ["A) ಕೋಸಲಾದೇವಿ", "B) ಚೆಲ್ಲಣಾ", "C) ಖೇಮಾ", "D) ವೈದೇಹಿ"], correct: 3, exp: "ಸರಿಯಾದ ಉತ್ತರ: D) ವೈದೇಹಿ." },
    { q: "19. ಹರ್ಯಂಕ ಸಂತತಿಯ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧ ದೊರೆ ಯಾರು ಹಾಗೂ ಅವನ ಬಿರುದು ಏನಾಗಿತ್ತು?", options: ["A) ಬಿಂಬಸಾರ - ಚಕ್ರವರ್ತಿ", "B) ಅಜಾತಶತ್ರು - ಪಿತೃಹಂತಕ", "C) ನಾಗದಾಸಕ - ಅಮಿತಘಾತ", "D) ಕಾಲಾಶೋಕ - ಕಾಕವರ್ಮ"], correct: 1, exp: "ಸರಿಯಾದ ಉತ್ತರ: B) ಅಜಾತಶತ್ರು - ಪಿತೃಹಂತಕ (ಆಡಳಿತ: ಕ್ರಿ.ಪೂ. 492–460)." },

    { q: "26. ಜೈನ ಮೂಲಗಳ ಪ್ರಕಾರ ಮಹಾಪದ್ಮನಂದನ ನಂತರ ಎಷ್ಟು ಜನ ಆಡಳಿತ ನಡೆಸಿದರು ಮತ್ತು ಕೊನೆಯ ದೊರೆ ಯಾರಾಗಿದ್ದನು?", options: ["A) 8 ಜನ ಆಡಳಿತ ನಡೆಸಿದರು - ಧನನಂದ", "B) 10 ಜನ ಆಡಳಿತ ನಡೆಸಿದರು - ಕಾಲಾಶೋಕ", "C) 5 ಜನ ಆಡಳಿತ ನಡೆಸಿದರು - ನಂದಿವರ್ಧನ", "D) 6 ಜನ ಆಡಳಿತ ನಡೆಸಿದರು - ಚಂದ್ರಗುಪ್ತ"], correct: 0, exp: "ಸರಿಯಾದ ಉತ್ತರ: A) 8 ಜನ ಆಡಳಿತ ಮಾಡಿದರು, ಕೊನೆಯ ದೊರೆ ಧನನಂದ." },

];

let currentIndex = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion(index) {
    currentIndex = index;
    const q = quizData[index];
    
    document.getElementById('sub-header').innerText = `Page ${index + 1} - Question ${index + 1} of ${quizData.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const expBox = document.getElementById('explanation-box');
    expBox.style.display = 'none';
    expBox.className = 'explanation-box';

    q.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (userAnswers[index] !== null) {
            btn.disabled = true;
            if (optIdx === q.correct) {
                btn.classList.add('correct');
            }
            if (userAnswers[index] === optIdx && optIdx !== q.correct) {
                btn.classList.add('wrong');
            }
        } else {
            btn.onclick = () => selectOption(optIdx);
        }

        optionsContainer.appendChild(btn);
    });

    if (userAnswers[index] !== null) {
        expBox.style.display = 'block';
        if (userAnswers[index] === q.correct) {
            expBox.classList.add('correct-bg');
            expBox.innerText = "ಸರಿ! (Correct)\n" + q.exp;
        } else {
            expBox.innerText = "ತಪ್ಪು! (Incorrect)\n" + q.exp;
        }
    }

    updatePalette();
}

function selectOption(optionIndex) {
    userAnswers[currentIndex] = optionIndex;
    loadQuestion(currentIndex);
    calculateScore();
}

function prevQuestion() {
    if (currentIndex > 0) loadQuestion(currentIndex - 1);
}

function nextQuestion() {
    if (currentIndex < quizData.length - 1) loadQuestion(currentIndex + 1);
}

function updatePalette() {
    const grid = document.getElementById('palette-grid');
    grid.innerHTML = '';

    quizData.forEach((_, idx) => {
        const btn = document.createElement('div');
        btn.className = 'palette-btn';
        btn.innerText = idx + 1;

        if (idx === currentIndex) btn.classList.add('active');

        if (userAnswers[idx] !== null) {
            if (userAnswers[idx] === quizData[idx].correct) {
                btn.classList.add('answered-correct');
            } else {
                btn.classList.add('answered-wrong');
            }
        }

        btn.onclick = () => loadQuestion(idx);
        grid.appendChild(btn);
    });
}

function calculateScore() {
    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) score++;
    });
    document.getElementById('score').innerText = score;
}

function resetTest() {
    if (confirm("ನಿಮ್ಮ ಪರೀಕ್ಷೆಯನ್ನು ಮರುಪ್ರಾರಂಭಿಸಲು ನೀವು ಖಚಿತವಾಗಿದ್ದೀರಾ? (Are you sure you want to restart the retest?)")) {
        userAnswers = new Array(quizData.length).fill(null);
        document.getElementById('score').innerText = "0";
        loadQuestion(0);
    }
}

// Timer functionality
let totalSeconds = 30 * 60;
setInterval(() => {
    if (totalSeconds > 0) {
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }
}, 1000);

// Initial initialization
loadQuestion(0);
</script>
