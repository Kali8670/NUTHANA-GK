        let currentQ = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function loadQuestion() {
            const qData = quizData[currentQ];
            document.getElementById("q-tracker").innerText = `Part 2 - Question ${currentQ + 1} of ${quizData.length}`;
            document.getElementById("question-text").innerText = qData.q;

            const optsContainer = document.getElementById("options-container");
            optsContainer.innerHTML = "";

            const expBox = document.getElementById("explanation-box");
            expBox.style.display = "none";

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                
                if (userAnswers[currentQ] !== null) {
                    btn.disabled = true;
                    if (idx === qData.correct) {
                        btn.classList.add("correct");
                    }
                    if (userAnswers[currentQ] === idx && idx !== qData.correct) {
                        btn.classList.add("wrong");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optsContainer.appendChild(btn);
            });

            if (userAnswers[currentQ] !== null) {
                expBox.style.display = "block";
                expBox.innerText = qData.exp;
                if (userAnswers[currentQ] === qData.correct) {
                    expBox.classList.add("correct-bg");
                } else {
                    expBox.classList.remove("correct-bg");
                }
            }

            document.getElementById("prev-btn").disabled = currentQ === 0;
            document.getElementById("next-btn").disabled = currentQ === quizData.length - 1;

            renderPalette();
            updateScore();
        }

        function selectOption(index) {
            userAnswers[currentQ] = index;
            loadQuestion();
        }

        function navigate(step) {
            currentQ += step;
            loadQuestion();
        }

        function renderPalette() {
            const grid = document.getElementById("palette-grid");
            grid.innerHTML = "";

            quizData.forEach((_, idx) => {
                const btn = document.createElement("div");
                btn.className = "palette-btn";
                btn.innerText = idx + 1;

                if (idx === currentQ) btn.classList.add("active");

                if (userAnswers[idx] !== null) {
                    if (userAnswers[idx] === quizData[idx].correct) {
                        btn.classList.add("answered-correct");
                    } else {
                        btn.classList.add("answered-wrong");
                    }
                }

                btn.onclick = () => {
                    currentQ = idx;
                    loadQuestion();
                };
                grid.appendChild(btn);
            });
        }

        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === quizData[idx].correct) score++;
            });
            document.getElementById("score-text").innerText = `Score: ${score} / ${quizData.length}`;
        }

        function retest() {
            if (confirm("ನಿಮಗೆ ಮತ್ತೆ ಪರೀಕ್ಷೆಯನ್ನು ಆರಂಭಿಸಲು ಇಷ್ಟವಿದೆಯೇ? (Are you sure you want to restart the test?)")) {
                userAnswers = new Array(quizData.length).fill(null);
                currentQ = 0;
                loadQuestion();
            }
        }

        // Initialize quiz on page load
        loadQuestion();
    </script>
