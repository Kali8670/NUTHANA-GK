        * {

            padding: 0;
        }

        body {

        /* Top Header Bar */
        .top-header {
            background-color: #0b2545;
            color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .top-header .title {
            font-weight: bold;
            font-size: 16px;
        }

        .top-header .timer {

            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }

        /* Sub Header / Info Bar */
        .sub-header {
            background-color: #e9ecef;
            padding: 6px 15px;
            font-size: 13px;
            color: #555;
            border-bottom: 1px solid #ccc;
        }

        /* Container Layout */
        .main-container {
            display: flex;
            flex-direction: row;
            min-height: calc(100vh - 75px);
        }

        /* Left Side: Question Area */
        .quiz-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .question-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1a1a1a;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 1px solid #ced4da;
            padding: 12px 15px;
            border-radius: 5px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #e2e6ea;
        }

        .option-btn.selected {
            background-color: #d1ecf1;
            border-color: #17a2b8;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Navigation Buttons Bottom */
        .nav-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-prev { background-color: #007bff; }
        .btn-prev:hover { background-color: #0056b3; }

        .btn-next { background-color: #007bff; }
        .btn-next:hover { background-color: #0056b3; }

        .btn-retest { background-color: #dc3545; }
        .btn-retest:hover { background-color: #bd2130; }

        /* Right Side: Question Palette */
        .palette-area {
            width: 280px;
            background-color: #ffffff;
            border-left: 1px solid #ccc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .palette-title {
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .palette-btn {
            padding: 8px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            border-radius: 3px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }

        .palette-btn.active {
            border: 2px solid #000;
            font-weight: bold;
        }

        .palette-btn.answered {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
        }

        .palette-btn.wrong-ans {
            background-color: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .palette-area {
                width: 100%;
                border-left: none;
                border-top: 1px solid #ccc;
            }
            .palette-grid {
                grid-template-columns: repeat(6, 1fr);

        let currentQIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function initQuiz() {
            renderPalette();
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentQIndex = index;
            const q = quizData[index];

            document.getElementById("subHeaderInfo").innerText = `Page ${index + 1} - Question ${index + 1} of ${quizData.length}`;
            document.getElementById("questionText").innerText = q.q;

            const optionsBox = document.getElementById("optionsBox");
            optionsBox.innerHTML = "";

            const expBox = document.getElementById("explanationBox");
            const expText = document.getElementById("explanationText");

            const selected = userAnswers[index];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;

                if (selected !== null) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add("correct");
                    }
                    if (selected === idx && selected !== q.correct) {
                        btn.classList.add("wrong");
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                optionsBox.appendChild(btn);
            });

            if (selected !== null) {
                expText.innerText = q.exp;
                expBox.style.display = "block";
            } else {
                expBox.style.display = "none";
            }

            updatePaletteHighlights();
        }

        function selectOption(optionIndex) {
            userAnswers[currentQIndex] = optionIndex;
            loadQuestion(currentQIndex);
            updateScore();
        }

        function renderPalette() {
            const grid = document.getElementById("paletteGrid");
            grid.innerHTML = "";
            quizData.forEach((_, idx) => {
                const btn = document.createElement("button");
                btn.className = "palette-btn";
                btn.id = `palette-${idx}`;
                btn.innerText = idx + 1;
                btn.onclick = () => loadQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function updatePaletteHighlights() {
            quizData.forEach((_, idx) => {
                const btn = document.getElementById(`palette-${idx}`);
                btn.className = "palette-btn";
                if (idx === currentQIndex) {
                    btn.classList.add("active");
                }
                const ans = userAnswers[idx];
                if (ans !== null) {
                    if (ans === quizData[idx].correct) {
                        btn.classList.add("answered");
                    } else {
                        btn.classList.add("wrong-ans");
                    }
                }
            });
        }

        function updateScore() {
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === quizData[idx].correct) {
                    score++;
                }
            });
            document.getElementById("scoreText").innerText = `Score: ${score} / ${quizData.length}`;
        }

        function nextQuestion() {
            if (currentQIndex < quizData.length - 1) {
                loadQuestion(currentQIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                loadQuestion(currentQIndex - 1);
            }
        }

        function resetQuiz() {
            userAnswers = new Array(quizData.length).fill(null);
            updateScore();
            loadQuestion(0);
        }

        // Initialize on page load
        initQuiz();
    </script>
