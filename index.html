<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuthana GK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Glowing Neon Title */
        h1.title {
            color: #00ff88;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6), 
                         0 0 20px rgba(0, 255, 136, 0.4), 
                         0 0 30px rgba(0, 255, 136, 0.2);
        }

        p.subtitle {
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
        }

        #menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Main Chapter Card */
        .main-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .main-card:hover {
            border-color: #00ff88;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }

        .arrow {
            color: #8b949e;
            transition: transform 0.3s;
        }

        /* Sub-subject container (hidden by default) */
        .sub-container {
            display: none;
            margin-top: 15px;
            padding-left: 10px;
            border-left: 2px solid #30363d;
        }

        .sub-subject-title {
            color: #00ff88;
            font-size: 15px;
            font-weight: 600;
            margin: 12px 0 8px 0;
        }

        /* Chapter Links */
        .chapter-link {
            display: block;
            background-color: #21262d;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 14px;
            margin-bottom: 6px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #30363d;
            transition: background 0.2s;
        }

        .chapter-link:hover {
            background-color: #30363d;
            color: #00ff88;
        }

        .loading-text {
            color: #8b949e;
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Glowing Title -->
        <h1 class="title">NUTHANA GK</h1>
        <p class="subtitle">SELECT MAIN CHAPTER</p>

        <!-- Dynamic Menu Container -->
        <div id="menu-container">
            <p class="loading-text">Loading structure...</p>
        </div>
    </div>

    <script>
        fetch('subjects.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('menu-container');
                container.innerHTML = '';

                data.mainSubjects.forEach(main => {
                    const mainCard = document.createElement('div');
                    mainCard.className = 'main-card';

                    let subHtml = '';
                    main.subSubjects.forEach(sub => {
                        let chaptersHtml = '';
                        sub.chapters.forEach(chap => {
                            chaptersHtml += `<a href="${chap.fileUrl}" class="chapter-link">${chap.title}</a>`;
                        });

                        subHtml += `
                            <div class="sub-subject-title">📁 ${sub.name}</div>
                            <div class="chapter-list">${chaptersHtml}</div>
                        `;
                    });

                    mainCard.innerHTML = `
                        <div class="main-header">
                            <span>${main.name}</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="sub-container">${subHtml}</div>
                    `;

                    // Toggle accordion open/close on click
                    mainCard.addEventListener('click', () => {
                        const subContainer = mainCard.querySelector('.sub-container');
                        const arrow = mainCard.querySelector('.arrow');
                        if (subContainer.style.display === 'block') {
                            subContainer.style.display = 'none';
                            arrow.style.transform = 'rotate(0deg)';
                        } else {
                            subContainer.style.display = 'block';
                            arrow.style.transform = 'rotate(180deg)';
                        }
                    });

                    container.appendChild(mainCard);
                });
            })
            .catch(error => {
                document.getElementById('menu-container').innerHTML = '<p class="loading-text" style="color: #ff5555;">Error loading subjects.json format.</p>';
                console.error(error);
            });
    </script>

</body>
</html>
