<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuthana GK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.title {
            color: #00ff88;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-align: center;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 35px;
            text-align: center;
            text-transform: uppercase;
        }

        #cards-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chapter-card {
            width: 100%;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .chapter-card:hover {
            background-color: #21262d;
            border-color: #00ff88;
            transform: translateY(-2px);
        }

        .chapter-name {
            font-size: 17px;
            font-weight: 500;
        }

        .arrow-icon {
            color: #8b949e;
            font-size: 18px;
            font-weight: bold;
        }

        .chapter-card:hover .arrow-icon {
            color: #00ff88;
        }

        .loading-text {
            color: #8b949e;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">NUTHANA GK</h1>
        <p class="subtitle">SELECT MAIN CHAPTER</p>

        <div id="cards-container">
            <p class="loading-text">Loading subjects...</p>
        </div>
    </div>

    <script>
        // Automatically fetch subjects from subjects.json on GitHub
        fetch('subjects.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not load subjects.json");
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('cards-container');
                container.innerHTML = ''; // Clear loading text

                data.chapters.forEach(chapter => {
                    // Create an anchor tag for each subject card
                    const card = document.createElement('a');
                    card.href = chapter.link;
                    card.className = 'chapter-card';

                    card.innerHTML = `
                        <span class="chapter-name">${chapter.name}</span>
                        <span class="arrow-icon">→</span>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                const container = document.getElementById('cards-container');
                container.innerHTML = '<p class="loading-text" style="color: #ff5555;">Failed to load menu. Check subjects.json.</p>';
                console.error("Error:", error);
            });
    </script>

</body>
</html>
